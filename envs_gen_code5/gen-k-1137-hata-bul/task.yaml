split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) orders/pipeline.py dosyasındaki report fonksiyonunu, girdide sıfır tutarlı bir kalem bulunsa bile hiçbir kalemi atlamayacak şekilde düzelt.

  2) Düzeltilen report fonksiyonu, sıfır tutarlı kalemler dahil tüm kalemleri ve her zaman toplamı döndürsün; toplam satırı hiçbir durumda eksik kalmasın.

setup: |
  mkdir -p orders
  cat > orders/normalize.py <<'NORM'
  def normalize(text):
      rows = []
      for line in text.strip().splitlines():
          name, qty, price = line.split(',')
          rows.append((name.strip(), int(qty), float(price)))
      return rows
  NORM
  cat > orders/summarize.py <<'SUM'
  from orders.normalize import normalize


  def summarize(text):
      rows = normalize(text)
      total = 0.0
      for _, qty, price in rows:
          total += qty * price
      return round(total, 2)


  def item_totals(text):
      rows = normalize(text)
      out = {}
      for name, qty, price in rows:
          out[name] = round(qty * price, 2)
      return out
  SUM
  cat > orders/pipeline.py <<'PIPE'
  from orders.summarize import summarize, item_totals


  def report(text):
      lines = []
      for name, amount in item_totals(text).items():
          if amount == 0.0:
              return lines
          lines.append(name + ":" + str(amount))
      lines.append("TOTAL:" + str(summarize(text)))
      return lines
  PIPE
  cat > input.txt <<'TXT'
  widget,3,4.0
  gadget,1,50.0
  bolt,10,0.5
  TXT

goal_tr: >
  orders/pipeline.py icindeki report fonksiyonunu, sifir tutarli bir kalem
  gorulse bile hicbir kalemi atlamadan ve toplami her zaman ekleyerek tum
  kalemleri ve toplami dondurecek bicimde duzelt.

reference_solution: |
  cat > orders/pipeline.py <<'PIPE'
  from orders.summarize import summarize, item_totals


  def report(text):
      lines = []
      for name, amount in item_totals(text).items():
          lines.append(name + ":" + str(amount))
      lines.append("TOTAL:" + str(summarize(text)))
      return lines
  PIPE

outputs:
