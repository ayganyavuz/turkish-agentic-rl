# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Sabah toplantıda depo izleme panelinin son denemelerde takıldığını konuştuk; bazı uyarı kayıtları ekranda belirmeden kayboluyor. Bunun üzerine sensör tarafındaki kural katmanını gözden geçirmeye karar verdik ve önce alarm kuyruğunu düzgün bir hale getirmemiz gerektiği ortaya çıktı.

  Bu doğrultuda sensors/rules.py dosyasındaki AlarmQueue sınıfını, her zaman en yüksek öncelikli kaydın önce çıktığı bir öncelik kuyruğu olacak şekilde iterator protokolüyle baştan yaz. Kuyruk push ile beslenmeli, len ile içindeki kayıt sayısını vermeli ve iter ile kayıtları öncelik sırasına göre tek tek döndürmeli; bu üç davranış da sensors/monitor.py dosyasındaki collect fonksiyonunun kullanımıyla uyumlu çalışmalı. Kayıtlar öncelik değeri, ad ve değer bilgisini taşımaya devam etsin.

setup: |
  mkdir -p sensors
  cat > sensors/stream.py <<'STREAM'
  def readings(chunks):
      for chunk in chunks:
          for line in chunk.strip().splitlines():
              name, value = line.split('=')
              yield name.strip(), float(value)
  STREAM
  cat > sensors/rules.py <<'RULES'
  class AlarmQueue:
      def __init__(self):
          raise NotImplementedError

      def push(self, priority, name, value):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError

      def __iter__(self):
          raise NotImplementedError
  RULES
  cat > sensors/monitor.py <<'MONITOR'
  from sensors.stream import readings
  from sensors.rules import AlarmQueue


  def collect(chunks, threshold):
      q = AlarmQueue()
      for name, value in readings(chunks):
          if value >= threshold:
              q.push(value, name, value)
      return q
  MONITOR
  cat > data.txt <<'DATA'
  temp=12.5
  temp=99.0
  press=50.0
  press=140.0
  temp=101.5
  DATA

goal_tr: >
  sensors/rules.py icindeki AlarmQueue sinifini, en yuksek oncelikli kaydin
  once ciktigi bir oncelik kuyrugu olarak iterator protokoluyle
  gerceklestir; push, len ve iter davranislari sensors/monitor.py ile uyumlu
  olmali.

reference_solution: |
  cat > sensors/rules.py <<'RULES'
  import heapq


  class AlarmQueue:
      def __init__(self):
          self._heap = []
          self._counter = 0

      def push(self, priority, name, value):
          heapq.heappush(self._heap, (-priority, self._counter, name, value))
          self._counter += 1

      def __len__(self):
          return len(self._heap)

      def __iter__(self):
          for neg_priority, _counter, name, value in sorted(self._heap):
              yield (name, value)
  RULES

