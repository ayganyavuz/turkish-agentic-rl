# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) shift/planner.py dosyasındaki make_reachability fonksiyonunu, build_shift_graph ile kurulan yönlü grafta her düğümden ulaşılabilen tüm düğümleri (düğümün kendisi dahil) döndüren bir closure üretecek şekilde tamamla.

  2) Girdi satırlarını stdin'den "kaynak hedef" biçiminde oku ve rows listesine çevir.

  3) reachable(start) kümesini graf gezinmesiyle hesapla.

setup: |
  mkdir -p shift
  cat > shift/schedule.py <<'SCHED'
  def build_shift_graph(rows):
      graph = {}
      for row in rows:
          worker = row["worker"]
          graph.setdefault(worker, [])
          for other in row["covers"]:
              graph[worker].append(other)
      return graph
  SCHED
  cat > shift/planner.py <<'PLANNER'
  from shift.schedule import build_shift_graph


  def make_reachability(rows):
      graph = build_shift_graph(rows)

      def reachable(start):
          raise NotImplementedError

      return reachable
  PLANNER
  cat > shifts.txt <<'TXT'
  alice bob
  bob carol
  carol alice
  dave erin
  erin dave
  frank grace
  grace frank
  TXT

goal_tr: >
  shift/planner.py icindeki make_reachability fonksiyonunu,
  build_shift_graph ile kurulan yonlu grafta her dugumden ulasilabilen tum
  dugumleri (kendisi dahil) donduren bir closure uretecek bicimde tamamla;
  girdi satirlari stdin'den "kaynak hedef" biciminde okunup rows listesine
  cevrilecek ve reachable(start) kumesi graf gezinmesiyle hesaplanacak.

reference_solution: |
  cat > shift/planner.py <<'PLANNER'
  from shift.schedule import build_shift_graph


  def make_reachability(rows):
      graph = build_shift_graph(rows)
      nodes = set(graph)
      for targets in graph.values():
          nodes.update(targets)

      def reachable(start):
          visited = set()
          stack = [start]
          while stack:
              node = stack.pop()
              if node in visited:
                  continue
              visited.add(node)
              for nxt in graph.get(node, ()):
                  if nxt not in visited:
                      stack.append(nxt)
          return visited

      return reachable
  PLANNER

