split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  inventory/billing.py dosyasındaki invoice fonksiyonunu, catalog içinde adı bulunmayan sipariş adları geldiğinde KeyError vermeyecek şekilde düzelt. Bu tür bilinmeyen adlar için o satır, ad, adet ve 0.0 tutar içerecek biçimde işlenmeli ve toplama hiçbir şey eklenmemeli; catalog'da adı bulunan sipariş adları için davranış aynı kalmalı.

setup: |
  mkdir -p inventory
  cat > inventory/catalog.py <<'CATALOG'
  def build_catalog(rows):
      catalog = {}
      for sku, name, price, stock in rows:
          catalog[sku] = {"name": name, "price": price, "stock": stock}
      return catalog


  def sku_for(catalog, name):
      for sku, item in catalog.items():
          if item["name"] == name:
              return sku
      return None
  CATALOG
  cat > inventory/billing.py <<'BILLING'
  from inventory.catalog import build_catalog, sku_for


  def line_total(catalog, name, qty):
      sku = sku_for(catalog, name)
      item = catalog[sku]
      return item["price"] * qty


  def invoice(rows, orders):
      catalog = build_catalog(rows)
      total = 0.0
      lines = []
      for name, qty in orders:
          amount = line_total(catalog, name, qty)
          lines.append((name, qty, amount))
          total += amount
      return lines, total
  BILLING
  cat > rows.txt <<'ROWS'
  A100,widget,4.0,10
  B200,gadget,50.0,2
  C300,bolt,0.5,100
  ROWS

goal_tr: >
  inventory/billing.py icindeki invoice fonksiyonunu, catalog'da adi
  bulunmayan siparis adlari geldiginde KeyError yerine o satiri ad, adet,
  0.0 tutarli olarak isleyip toplama hicbir sey eklemeyecek bicimde duzelt;
  bilinen adlar icin davranis degismesin.

reference_solution: |
  cat > inventory/billing.py <<'BILLING'
  from inventory.catalog import build_catalog, sku_for


  def line_total(catalog, name, qty):
      sku = sku_for(catalog, name)
      if sku is None:
          return 0.0
      item = catalog[sku]
      return item["price"] * qty


  def invoice(rows, orders):
      catalog = build_catalog(rows)
      total = 0.0
      lines = []
      for name, qty in orders:
          amount = line_total(catalog, name, qty)
          lines.append((name, qty, amount))
          total += amount
      return lines, total
  BILLING

outputs:
