# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) fleet/summary.py dosyasını oluştur.

  2) Bu dosyada make_counter_factory() adında bir closure fabrikası tanımla; fabrika, fleet.registry.fleet_snapshot() çıktısını kullanarak her araç için toplam olay sayısını hesaplasın.

  3) Fabrika her çağrıldığında bağımsız bir sayac closure döndürsün.

  4) Closure bir araç kimliği alsın ve o aracın toplam olay sayısını döndürsün.

  5) Aynı araç için closure tekrar çağrıldığında sayım yeniden hesaplanmasın, önbellekten dönsün.

setup: |
  mkdir -p fleet
  cat > fleet/telemetry.py <<'TELEMETRY'
  def vehicle_events():
      return [
          ("v1", "moving"),
          ("v2", "idle"),
          ("v1", "moving"),
          ("v3", "moving"),
          ("v2", "idle"),
          ("v1", "idle"),
          ("v3", "moving"),
          ("v4", "moving"),
          ("v5", "idle"),
      ]
  TELEMETRY
  cat > fleet/registry.py <<'REGISTRY'
  from fleet.telemetry import vehicle_events


  def fleet_snapshot():
      counts = {}
      for vid, state in vehicle_events():
          counts.setdefault(vid, {})
          counts[vid][state] = counts[vid].get(state, 0) + 1
      return counts
  REGISTRY

goal_tr: >
  fleet/summary.py dosyasini yaz: fleet.registry.fleet_snapshot() ciktisini
  kullanarak her arac icin toplam olay sayisini hesaplayan bir closure
  fabrikasi olan make_counter_factory() tanimla; fabrika her cagrildiginda
  bagimsiz bir sayac closure dondursun, closure bir arac kimligi alip o
  aracin toplam olay sayisini dondursun ve ayni arac icin tekrar cagrilirsa
  sayim tekrar hesaplanmasin (onbellekten donsun).

reference_solution: |
  cat > fleet/summary.py <<'SUMMARY'
  from fleet.registry import fleet_snapshot


  def make_counter_factory():
      cache = {}

      def counter(vehicle_id):
          if vehicle_id not in cache:
              snap = fleet_snapshot()
              total = 0
              for state, n in snap.get(vehicle_id, {}).items():
                  total += n
              cache[vehicle_id] = total
          return cache[vehicle_id]

      return counter
  SUMMARY

