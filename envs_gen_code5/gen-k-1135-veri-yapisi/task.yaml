# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  fx.py'yi Node ve RateList sınıflarıyla bağlı liste yapısına çevir; Node value ve next, RateList head ile append ve add_rate taşısın. convert_chain aynı para biriminde başlayıp biten zinciri bağlı liste üzerinde yürüsün.

setup: |
  cat > fx.py <<'PY'
  def pair_rate(base, quote):
      table = {
          ("USD", "EUR"): 0.92,
          ("EUR", "USD"): 1.09,
          ("USD", "TRY"): 34.0,
          ("TRY", "USD"): 0.029,
      }
      return table[(base, quote)]


  def convert(base, quote, amount):
      return amount * pair_rate(base, quote)


  def convert_chain(legs, amount):
      total = amount
      for base, quote in legs:
          total = convert(base, quote, total)
      return total
  PY

goal_tr: >
  fx.py icindeki pair_rate, convert ve convert_chain fonksiyonlarini, doviz
  cevrimi icin bagli liste dugumu (Node) kullanan bir yapiya cevir: Node
  sinifi value ve next alanlarini tasisin, RateList sinifi head tutsun ve
  append ile add_rate eklesin, convert_chain ayni para biriminden baslayip
  biten bir cevrim zincirini bagli liste uzerinde yurusun.

reference_solution: |
  cat > fx.py <<'PY'
  class Node:
      def __init__(self, value, next=None):
          self.value = value
          self.next = next


  class RateList:
      def __init__(self):
          self.head = None

      def append(self, value):
          node = Node(value)
          if self.head is None:
              self.head = node
              return node
          cur = self.head
          while cur.next is not None:
              cur = cur.next
          cur.next = node
          return node

      def add_rate(self, base, quote, rate):
          return self.append((base, quote, rate))

      def lookup(self, base, quote):
          cur = self.head
          while cur is not None:
              b, q, r = cur.value
              if b == base and q == quote:
                  return r
              cur = cur.next
          raise KeyError((base, quote))


  def pair_rate(rates, base, quote):
      return rates.lookup(base, quote)


  def convert(rates, base, quote, amount):
      return amount * pair_rate(rates, base, quote)


  def convert_chain(rates, legs, amount):
      total = amount
      for base, quote in legs:
          total = convert(rates, base, quote, total)
      return total
  PY

