  bora:75
  cem:120
  ada:30
  deniz:75
  bora:200
  cem:10
  TXT

goal_tr: >
  arena/store.py, arena/trie.py ve arena/board.py dosyalarini; scores.txt
  icindeki "isim:skor" satirlarindan her oyuncunun toplam skorunu trie ile
  tutan ve en yuksek skorlu k oyuncuyu donduren calisan bir zincir olacak
  sekilde tamamla.

reference_solution: |
  cat > arena/store.py <<'STORE'
  def make_score_store():
      root = {}
      return root


  def normalize_name(name):
      return name.strip().lower()
  STORE
  cat > arena/trie.py <<'TRIE'
  from arena.store import make_score_store, normalize_name


  def make_score_trie():
      root = make_score_store()

      def add(name, amount):
          node = root
          for ch in normalize_name(name):
              node = node.setdefault(ch, {})
          node["#"] = node.get("#", 0) + amount
          return node["#"]

      def total(name):
          node = root
          for ch in normalize_name(name):
              if ch not in node:
                  return 0
              node = node[ch]
          return node.get("#", 0)

      def collect():
          out = []

          def walk(node, prefix):
              if "#" in node:
                  out.append((prefix, node["#"]))
              for key in node:
                  if key != "#":
                      walk(node[key], prefix + key)

          walk(root, "")
          return out

      return add, total, collect
  TRIE
  cat > arena/board.py <<'BOARD'
  from arena.trie import make_score_trie


  def build_board(records):
      add, total, collect = make_score_trie()
      for line in records:
          line = line.strip()
          if not line:
              continue
          name, score = line.split(":")
          add(name, int(score))
      return collect()


  def top_players(records, k):
      board = build_board(records)
      board.sort(key=lambda pair: (-pair[1], pair[0]))
      return [(name, score) for name, score in board[:k]]
  BOARD

