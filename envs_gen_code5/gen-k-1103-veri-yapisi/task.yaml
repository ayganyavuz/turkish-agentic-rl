# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  arena/store.py, arena/trie.py ve arena/board.py dosyalarını, scores.txt içindeki "isim:skor" biçimindeki satırlardan her oyuncunun toplam skorunu bir trie yapısında tutan ve en yüksek skorlu k oyuncuyu döndüren çalışan bir zincir oluşturacak şekilde tamamla. arena/board.py içindeki build_board ve top_players fonksiyonları bu zinciri kullanarak çalışsın; build_board kayıtları işleyip toplam skorları trie üzerinden hesaplasın, top_players ise en yüksek skorlu k oyuncuyu döndürsün. scores.txt içindeki her satırda bir "isim:skor" kaydı bulunuyor ve aynı isim birden fazla kez geçebiliyor; bu durumda o oyuncunun skorları toplanmalı.

