id: gen-k-1100-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) callcenter/streams/batches.py dosyasındaki BatchReader sınıfını, girdi akışının son parçası tam bölünmediğinde de kalan o parçayı döndürecek biçimde düzelt.

  2) Düzeltme sonrasında BatchReader, akışı başta olduğu gibi aynı boyutlu parçalara bölmeye devam etsin; yalnızca sonda artan kayıtlar da bir parça olarak döndürülsün.

  3) callcenter/streams/batches.py dışındaki dosyalara dokunma; değişiklik yalnızca bu dosyada olsun.

setup: |
  mkdir -p callcenter/streams
  cat > callcenter/streams/records.py <<'RECORDS'
  def parse_line(line):
      parts = line.strip().split('|')
      if len(parts) != 3:
          return None
      agent, kind, dur = parts
      return (agent, kind, int(dur))


  def iter_records(lines):
      for line in lines:
          rec = parse_line(line)
          if rec is not None:
              yield rec
  RECORDS
  cat > callcenter/streams/batches.py <<'BATCHES'
  from callcenter.streams.records import iter_records


  class BatchReader:
      def __init__(self, lines, size):
          self.lines = lines
          self.size = size

      def __iter__(self):
          batch = []
          for rec in iter_records(self.lines):
              batch.append(rec)
              if len(batch) == self.size:
                  yield batch
                  batch = []
  BATCHES
  cat > callcenter/streams/totals.py <<'TOTALS'
  from callcenter.streams.batches import BatchReader


  def total_minutes(lines, size):
      reader = BatchReader(lines, size)
      total = 0
      for batch in reader:
          for agent, kind, dur in batch:
              if kind == 'call':
                  total += dur
      return total
  TOTALS
  cat > calls.txt <<'CALLS'
  ayse|call|5
  mehmet|note|2
  ayse|call|7
  zeynep|call|3
  mehmet|call|4
  zeynep|note|1
  CALLS

goal_tr: >
  callcenter/streams/batches.py icindeki BatchReader sinifini, akisin son
  parcasi tam bolunmediginde de o parcayi dondurecek bicimde duzelt.

reference_solution: |
  cat > callcenter/streams/batches.py <<'BATCHES'
  from callcenter.streams.records import iter_records


  class BatchReader:
      def __init__(self, lines, size):
          self.lines = lines
          self.size = size

      def __iter__(self):
          batch = []
          for rec in iter_records(self.lines):
              batch.append(rec)
              if len(batch) == self.size:
                  yield batch
                  batch = []
          if batch:
              yield batch
  BATCHES

