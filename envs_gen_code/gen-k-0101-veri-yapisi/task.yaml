      def peek(self):
          if self.is_empty():
              raise IndexError("peek from empty stack")
          return self._items[-1]

      def is_empty(self):
          return len(self._items) == 0

      def size(self):
          return len(self._items)

      def clear(self):
          self._items = []

      def reverse_orders(self):
          raise NotImplementedError

      def top_n(self, n):
          raise NotImplementedError

      def remove_order(self, order_id):
          raise NotImplementedError
  PY

goal_tr: >
  stack_orders.py icindeki OrderStack sinifinin reverse_orders, top_n ve
  remove_order metodlarini gerceklestir: reverse_orders yigini ters cevirir,
  top_n yigindaki en ust n elemani (n yigin boyutundan buyukse tumunu)
  dondurur, remove_order belirtilen siparis numarasini yigindan siler (yoksa
  hata firlatmaz)

reference_solution: |
  cat > stack_orders.py <<'PY'
  class OrderStack:
      def __init__(self):
          self._items = []

      def push(self, order_id):
          self._items.append(order_id)

      def pop(self):
          if self.is_empty():
              raise IndexError("pop from empty stack")
          return self._items.pop()

      def peek(self):
          if self.is_empty():
              raise IndexError("peek from empty stack")
          return self._items[-1]

      def is_empty(self):
          return len(self._items) == 0

      def size(self):
          return len(self._items)

      def clear(self):
          self._items = []

      def reverse_orders(self):
          self._items.reverse()

      def top_n(self, n):
          return self._items[-n:][::-1] if n > 0 else []

      def remove_order(self, order_id):
          if order_id in self._items:
              self._items.remove(order_id)
  PY

