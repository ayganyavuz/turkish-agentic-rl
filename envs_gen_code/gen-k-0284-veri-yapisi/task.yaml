  bst_prices.py dosyasındaki PriceTree sınıfının count_less_than ve count_greater_than metodlarını gerçekleştir. Bu metodlar, ikili arama ağacını düzgün şekilde gezerek threshold değerinden küçük veya eşit fiyatların sayısını ve threshold değerinden büyük veya eşit fiyatların sayısını döndürmelidir. count_less_than metodu threshold değerinden küçük veya eşit fiyatların sayısını, count_greater_than metodu ise threshold değerinden büyük veya eşit fiyatların sayısını döndürmelidir. Mevcut yapıyı ve düğüm sınıfını koruyarak bu iki metodu uygun şekilde tamamla.

