  cat > bst_prices.py <<'PY'
  class BSTNode:
      def __init__(self, price):
          self.price = price
          self.left = None
          self.right = None


  class PriceTree:
      def __init__(self):
          self.root = None

      def insert(self, price):
          if self.root is None:
              self.root = BSTNode(price)
              return
          node = self.root
          while True:
              if price < node.price:
                  if node.left is None:
                      node.left = BSTNode(price)
                      return
                  node = node.left
              else:
                  if node.right is None:
                      node.right = BSTNode(price)
                      return
                  node = node.right

      def find_min(self):
          if self.root is None:
              return None
          node = self.root
          while node.left is not None:
              node = node.left
          return node.price

      def find_max(self):
          if self.root is None:
              return None
          node = self.root
          while node.right is not None:
              node = node.right
          return node.price

      def count_less_than(self, threshold):
          raise NotImplementedError

      def count_greater_than(self, threshold):
          raise NotImplementedError
  PY

goal_tr: >
  bst_prices.py icindeki PriceTree sinifinin count_less_than ve
  count_greater_than metodlarini, BST'yi duzgun sekilde gezip threshold
  degerinden kucuk/esit ve buyuk/esit fiyatlarin sayisini dondurecek sekilde
  gerceklestir

reference_solution: |
  cat > bst_prices.py <<'PY'
  class BSTNode:
      def __init__(self, price):
          self.price = price
          self.left = None
          self.right = None


  class PriceTree:
      def __init__(self):
          self.root = None

      def insert(self, price):
          if self.root is None:
              self.root = BSTNode(price)
              return
          node = self.root
          while True:
              if price < node.price:
                  if node.left is None:
                      node.left = BSTNode(price)
                      return
                  node = node.left
              else:
                  if node.right is None:
                      node.right = BSTNode(price)
                      return
                  node = node.right

      def find_min(self):
          if self.root is None:
              return None
          node = self.root
          while node.left is not None:
              node = node.left
          return node.price

      def find_max(self):
          if self.root is None:
              return None
          node = self.root
          while node.right is not None:
              node = node.right
          return node.price

      def count_less_than(self, threshold):
          return self._count_less(self.root, threshold)

      def _count_less(self, node, threshold):
          if node is None:
              return 0
          if node.price < threshold:
              return 1 + self._count_less(node.left, threshold) + self._count_less(node.right, threshold)
          return self._count_less(node.left, threshold)

      def count_greater_than(self, threshold):
          return self._count_greater(self.root, threshold)

      def _count_greater(self, node, threshold):
          if node is None:
              return 0
          if node.price > threshold:
              return 1 + self._count_greater(node.left, threshold) + self._count_greater(node.right, threshold)
          return self._count_greater(node.right, threshold)
  PY

