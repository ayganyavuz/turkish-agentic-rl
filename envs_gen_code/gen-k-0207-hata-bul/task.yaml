# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  routing/pathfinder.py içindeki find_path fonksiyonunu düzelt, başlangıç noktasını da içeren tam yolu döndürsün.

setup: |
  mkdir -p routing
  cat > routing/grid.py <<'GRID'
  def build_grid(size):
      return [[0] * size for _ in range(size)]

  def set_obstacle(grid, x, y):
      grid[x][y] = 1
  GRID
  cat > routing/directions.py <<'DIRECTIONS'
  def get_directions():
      return [(0, 1), (1, 0), (0, -1), (-1, 0)]
  DIRECTIONS
  cat > routing/pathfinder.py <<'PATHFINDER'
  from routing.grid import build_grid, set_obstacle
  from routing.directions import get_directions


  def find_path(size, obstacles, start, goal):
      grid = build_grid(size)
      for ox, oy in obstacles:
          set_obstacle(grid, ox, oy)

      directions = get_directions()
      queue = [start]
      visited = {start}
      parent = {start: None}

      while queue:
          current = queue.pop(0)
          if current == goal:
              break
          cx, cy = current
          for dx, dy in directions:
              nx, ny = cx + dx, cy + dy
              if 0 <= nx < size and 0 <= ny < size:
                  if grid[nx][ny] == 0 and (nx, ny) not in visited:
                      visited.add((nx, ny))
                      parent[(nx, ny)] = current
                      queue.append((nx, ny))

      if goal not in parent:
          return None

      path = []
      node = goal
      while node is not None:
          path.append(node)
          node = parent[node]
      return path[::-1][1:]
  PATHFINDER

goal_tr: >
  routing/pathfinder.py icindeki find_path fonksiyonunu, baslangic noktasini
  da iceren tam yolu dondurecek bicimde duzelt

reference_solution: |
  cat > routing/pathfinder.py <<'PATHFINDER'
  from routing.grid import build_grid, set_obstacle
  from routing.directions import get_directions


  def find_path(size, obstacles, start, goal):
      grid = build_grid(size)
      for ox, oy in obstacles:
          set_obstacle(grid, ox, oy)

      directions = get_directions()
      queue = [start]
      visited = {start}
      parent = {start: None}

      while queue:
          current = queue.pop(0)
          if current == goal:
              break
          cx, cy = current
          for dx, dy in directions:
              nx, ny = cx + dx, cy + dy
              if 0 <= nx < size and 0 <= ny < size:
                  if grid[nx][ny] == 0 and (nx, ny) not in visited:
                      visited.add((nx, ny))
                      parent[(nx, ny)] = current
                      queue.append((nx, ny))

      if goal not in parent:
          return None

      path = []
      node = goal
      while node is not None:
          path.append(node)
          node = parent[node]
      return path[::-1]
  PATHFINDER

