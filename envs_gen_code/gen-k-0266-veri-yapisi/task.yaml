  mkdir -p orderbook
  cat > orderbook/order.py <<'ORDER'
  class Order:
      def __init__(self, order_id, items, priority):
          self.order_id = order_id
          self.items = items
          self.priority = priority
          self.status = "pending"
  ORDER
  cat > orderbook/fulfillment.py <<'FULFILLMENT'
  from orderbook.order import Order


  class FulfillmentQueue:
      def __init__(self):
          self._orders = []

      def add_order(self, order_id, items, priority):
          self._orders.append(Order(order_id, items, priority))

