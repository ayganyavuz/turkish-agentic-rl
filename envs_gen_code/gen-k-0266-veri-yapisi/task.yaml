prompt: |
  1) `orderbook/fulfillment.py` dosyasındaki `FulfillmentQueue` sınıfının tüm metodlarını, en yüksek öncelikli siparişi (öncelik numarası en küçük olan) verimli şekilde çıkaran bir öncelik kuyruğu olarak gerçekleştir.

  2) `add_order` metodu, verilen sipariş kimliği, ürünler ve öncelik değeriyle yeni bir siparişi kuyruğa eklemelidir.

  3) `pop_highest_priority` metodu, en yüksek öncelikli siparişi kuyruktan çıkarıp döndürmelidir.

  4) `peek_highest_priority` metodu, en yüksek öncelikli siparişi kuyruktan çıkarmadan döndürmelidir.

  5) `__len__` metodu kuyruktaki sipariş sayısını, `is_empty` metodu ise kuyruğun boş olup olmadığını döndürmelidir.

