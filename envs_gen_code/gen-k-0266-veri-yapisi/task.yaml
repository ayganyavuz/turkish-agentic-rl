      def peek_highest_priority(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError

      def is_empty(self):
          raise NotImplementedError
  FULFILLMENT

goal_tr: >
  orderbook/fulfillment.py icindeki FulfillmentQueue sinifinin tum
  metodlarini, en yuksek oncelikli siparisi (oncelik numarasi en kucuk olan)
  verimli sekilde cikaran bir oncelik kuyrugu olarak gerceklestir.

reference_solution: |
  cat > orderbook/fulfillment.py <<'FULFILLMENT'
  from orderbook.order import Order


  class FulfillmentQueue:
      def __init__(self):
          self._orders = []

      def add_order(self, order_id, items, priority):
          self._orders.append(Order(order_id, items, priority))
          idx = len(self._orders) - 1
          while idx > 0:
              parent = (idx - 1) // 2
              if self._orders[parent].priority <= self._orders[idx].priority:
                  break
              self._orders[parent], self._orders[idx] = self._orders[idx], self._orders[parent]
              idx = parent

      def pop_highest_priority(self):
          if not self._orders:
              raise IndexError("pop from empty queue")
          root = self._orders[0]
          last = self._orders.pop()
          if self._orders:
              self._orders[0] = last
              idx = 0
              n = len(self._orders)
              while True:
                  left = 2 * idx + 1
                  right = 2 * idx + 2
                  smallest = idx
                  if left < n and self._orders[left].priority < self._orders[smallest].priority:
                      smallest = left
                  if right < n and self._orders[right].priority < self._orders[smallest].priority:
                      smallest = right
                  if smallest == idx:
                      break
                  self._orders[idx], self._orders[smallest] = self._orders[smallest], self._orders[idx]
                  idx = smallest
          return root

      def peek_highest_priority(self):
          if not self._orders:
              raise IndexError("peek from empty queue")
          return self._orders[0]

      def __len__(self):
          return len(self._orders)

      def is_empty(self):
          return len(self._orders) == 0
  FULFILLMENT

