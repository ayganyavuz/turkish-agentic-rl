reference_solution: |
  cat > routes/network.py <<'PY'
  def parse_network(text):
      """Parse a network description into a dict of connections.

      Format: each line is 'station1-station2:minutes'
      Example: 'A-B:5' means A connects to B in 5 minutes.
      """
      connections = {}
      for line in text.strip().splitlines():
          if not line:
              continue
          route, time_str = line.split(':')
          station_a, station_b = route.split('-')
          time = int(time_str)
          # Store both directions
          connections.setdefault(station_a, []).append((station_b, time))
          connections.setdefault(station_b, []).append((station_a, time))
      return connections


  def find_quickest_route(network_text, start, end):
      """Find the quickest route between two stations.

      Returns a list of station names from start to end, or None if no route exists.
      """
      graph = parse_network(network_text)

      if start not in graph or end not in graph:
          return None

      # Dijkstra's algorithm for minimum total travel time
      import heapq
      distances = {start: 0}
      previous = {start: None}
      pq = [(0, start)]

      while pq:
          current_dist, station = heapq.heappop(pq)
          if station == end:
              break
          if current_dist > distances.get(station, float('inf')):
              continue
          for neighbor, travel_time in graph[station]:
              new_dist = current_dist + travel_time
              if new_dist < distances.get(neighbor, float('inf')):
                  distances[neighbor] = new_dist
                  previous[neighbor] = station
                  heapq.heappush(pq, (new_dist, neighbor))

      if end not in distances:
          return None

      # Reconstruct path
      path = []
      current = end
      while current is not None:
          path.append(current)
          current = previous[current]
      path.reverse()
      return path
  PY

