prompt: |
  routes/network.py dosyasındaki find_quickest_route fonksiyonunu düzelt. Bu fonksiyon şu anda duraklar arasındaki bağlantı sayısını (durak sayısını) en aza indiren bir rota buluyor; ancak asıl amaç toplam seyahat süresini en aza indiren rotayı bulmak olmalı. Yol tarifi ağında her bağlantının bir süresi (dakika cinsinden) var ve sen bu süreleri dikkate alarak, başlangıç durağından hedef durağa giden ve toplam seyahat süresini en aza indiren duraklar listesini döndürmelisin. Eğer rota yoksa None döndürmeye devam et. Mevcut yapıyı ve fonksiyon imzasını koru; routes/network.py dosyasını güncelle.

setup: |
  mkdir -p routes
  cat > routes/network.py <<'PY'
  def parse_network(text):
      """Parse a network description into a dict of connections.

      Format: each line is 'station1-station2:minutes'
      Example: 'A-B:5' means A connects to B in 5 minutes.
      """
      connections = {}
      for line in text.strip().splitlines():
          if not line:
              continue
          route, time_str = line.split(':')
          station_a, station_b = route.split('-')
          time = int(time_str)
          # Store both directions
          connections.setdefault(station_a, []).append((station_b, time))
          connections.setdefault(station_b, []).append((station_a, time))
      return connections


  def find_quickest_route(network_text, start, end):
      """Find the quickest route between two stations.

      Returns a list of station names from start to end, or None if no route exists.
      """
      graph = parse_network(network_text)

      if start not in graph or end not in graph:
          return None

      # Simple BFS for shortest path (by number of hops, not time)
      visited = {start}
      queue = [(start, [start])]

      while queue:
          station, path = queue.pop(0)
          if station == end:
              return path
          for neighbor, _ in graph[station]:
              if neighbor not in visited:
                  visited.add(neighbor)
                  queue.append((neighbor, path + [neighbor]))

      return None
  PY

