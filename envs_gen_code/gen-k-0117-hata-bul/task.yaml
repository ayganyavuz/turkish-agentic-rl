# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Bugün uzun bir gün oldu, özellikle kullanıcı oturumlarının yönetimiyle uğraşırken bazı tutarsızlıklar fark ettim. Her kullanıcı için roller listesinin ayrı ayrı saklanması gerekiyor ama şu an sistem bunu doğru yapmıyor. Yeni bir kullanıcı kaydederken roller listesinin bağımsız olması gerekiyor, yani `auth/session_store.py` dosyasındaki `SessionStore.register` metodunu, her kullanıcının kendi roller listesini bağımsız olarak saklayacak şekilde düzeltmeni istiyorum. Bu düzeltmeyi `auth/session_store.py` dosyasında yapmalısın.

setup: |
  mkdir -p auth
  cat > auth/session_store.py <<'SESSION'
  class SessionStore:
      def __init__(self):
          self.sessions = {}

      def register(self, user_id, roles=[]):
          self.sessions[user_id] = roles
          return self.sessions[user_id]

      def get_roles(self, user_id):
          return self.sessions.get(user_id, [])
  SESSION
  cat > auth/access.py <<'ACCESS'
  from auth.session_store import SessionStore


  def create_admin_session(store, user_id):
      return store.register(user_id, ['admin'])


  def create_default_session(store, user_id):
      return store.register(user_id)
  ACCESS
  cat > main.py <<'MAIN'
  from auth.access import create_admin_session, create_default_session
  from auth.session_store import SessionStore

  store = SessionStore()
  create_default_session(store, 'user1')
  create_admin_session(store, 'admin1')

  assert store.get_roles('user1') == [], store.get_roles('user1')
  assert store.get_roles('admin1') == ['admin'], store.get_roles('admin1')
  print("TAMAM")
  MAIN

goal_tr: >
  auth/session_store.py icindeki SessionStore.register metodunu, her
  kullanici icin roles listesini bagimsiz olarak saklayacak bicimde duzelt.

reference_solution: |
  cat > auth/session_store.py <<'SESSION'
  class SessionStore:
      def __init__(self):
          self.sessions = {}

      def register(self, user_id, roles=None):
          if roles is None:
              roles = []
          self.sessions[user_id] = roles
          return self.sessions[user_id]

      def get_roles(self, user_id):
          return self.sessions.get(user_id, [])
  SESSION

