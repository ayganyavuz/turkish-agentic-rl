# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  orders/tree.py içindeki OrderBST sınıfının range_count metodunu ağaçtaki anahtarların sayısını [lo, hi] aralığında doğru döndürecek, top_k metodunu da en büyük k anahtarın değerlerini doğru döndürecek şekilde gerçekleştir.

setup: |
  mkdir -p orders
  cat > orders/tree.py <<'TREE'
  class BSTNode:
      def __init__(self, key, value):
          self.key = key
          self.value = value
          self.left = None
          self.right = None

  class OrderBST:
      def __init__(self):
          self.root = None

      def insert(self, key, value):
          if self.root is None:
              self.root = BSTNode(key, value)
              return
          self._insert(self.root, key, value)

      def _insert(self, node, key, value):
          if key < node.key:
              if node.left is None:
                  node.left = BSTNode(key, value)
              else:
                  self._insert(node.left, key, value)
          elif key > node.key:
              if node.right is None:
                  node.right = BSTNode(key, value)
              else:
                  self._insert(node.right, key, value)
          else:
              node.value = value

      def find(self, key):
          return self._find(self.root, key)

      def _find(self, node, key):
          if node is None:
              return None
          if key == node.key:
              return node.value
          elif key < node.key:
              return self._find(node.left, key)
          else:
              return self._find(node.right, key)

      def range_count(self, lo, hi):
          raise NotImplementedError

      def top_k(self, k):
          raise NotImplementedError
  TREE
  cat > orders/query.py <<'QUERY'
  from orders.tree import OrderBST


  def count_in_range(bst, lo, hi):
      return bst.range_count(lo, hi)


  def get_top(bst, k):
      return bst.top_k(k)
  QUERY
  cat > data.txt <<'DATA'
  1001,apple
  1005,banana
  1002,cherry
  1008,date
  1003,elderberry
  1009,fig
  1007,grape
  DATA

goal_tr: >
  orders/tree.py icindeki OrderBST sinifinin range_count ve top_k
  metodlarini, agactaki anahtarlarin sayisini ve en buyuk k anahtarin
  degerlerini dogru dondurecek sekilde gerceklestir

reference_solution: |
  cat > orders/tree.py <<'TREE'
  class BSTNode:
      def __init__(self, key, value):
          self.key = key
          self.value = value
          self.left = None
          self.right = None

  class OrderBST:
      def __init__(self):
          self.root = None

      def insert(self, key, value):
          if self.root is None:
              self.root = BSTNode(key, value)
              return
          self._insert(self.root, key, value)

      def _insert(self, node, key, value):
          if key < node.key:
              if node.left is None:
                  node.left = BSTNode(key, value)
              else:
                  self._insert(node.left, key, value)
          elif key > node.key:
              if node.right is None:
                  node.right = BSTNode(key, value)
              else:
                  self._insert(node.right, key, value)
          else:
              node.value = value

      def find(self, key):
          return self._find(self.root, key)

      def _find(self, node, key):
          if node is None:
              return None
          if key == node.key:
              return node.value
          elif key < node.key:
              return self._find(node.left, key)
          else:
              return self._find(node.right, key)

      def range_count(self, lo, hi):
          return self._range_count(self.root, lo, hi)

      def _range_count(self, node, lo, hi):
          if node is None:
              return 0
          if node.key < lo:
              return self._range_count(node.right, lo, hi)
          elif node.key > hi:
              return self._range_count(node.left, lo, hi)
          else:
              return (1 + self._range_count(node.left, lo, hi) +
                      self._range_count(node.right, lo, hi))

      def top_k(self, k):
          result = []
          self._top_k(self.root, k, result)
          return result

      def _top_k(self, node, k, result):
          if node is None or len(result) >= k:
              return
          self._top_k(node.right, k, result)
          if len(result) < k:
              result.append(node.value)
              self._top_k(node.left, k, result)
  TREE

