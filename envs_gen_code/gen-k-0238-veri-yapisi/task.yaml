# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) `roadnet/merger.py` dosyasındaki `merge_contiguous` fonksiyonunu gerçekleştir. Bu fonksiyon, aynı yol kimliğine sahip ve bitişik olan yol parçalarını (bir parçanın `end_km` değeri ile sonraki parçanın `start_km` değeri eşitse) tek bir `RoadSegment` olarak birleştirmelidir.

  2) `roadnet/segments.py` dosyasındaki `RoadSegment` sınıfını kullanarak, birleştirilmiş parçaları temsil eden yeni `RoadSegment` nesneleri oluştur. Birleştirilen parçanın `road_id` değeri aynı kalmalı, `start_km` değeri ilk parçanın başlangıcı, `end_km` değeri ise son parçanın sonu olmalıdır.

  3) `roadnet/merger.py` dosyasındaki `merge_contiguous` fonksiyonunun, girdi olarak aldığı parça listesini işleyip birleştirilmiş parçaların listesini döndürmesini sağla. Birleştirme işlemi, aynı yol üzerinde ardışık gelen ve bitişik olan tüm parçalar için yapılmalıdır.

setup: |
  mkdir -p roadnet
  cat > roadnet/segments.py <<'SEGMENTS'
  class RoadSegment:
      def __init__(self, road_id, start_km, end_km):
          self.road_id = road_id
          self.start_km = start_km
          self.end_km = end_km

      def __repr__(self):
          return f"RoadSegment({self.road_id!r}, {self.start_km}, {self.end_km})"
  SEGMENTS
  cat > roadnet/merger.py <<'MERGER'
  from roadnet.segments import RoadSegment


  def merge_contiguous(segments):
      """Merge segments that are contiguous (end_km == next start_km) on same road."""
      raise NotImplementedError
  MERGER
  cat > roadnet/navigator.py <<'NAVIGATOR'
  from roadnet.segments import RoadSegment
  from roadnet.merger import merge_contiguous


  def build_route(segments):
      """Return list of merged RoadSegments covering the full route."""
      return merge_contiguous(segments)
  NAVIGATOR

goal_tr: >
  roadnet/merger.py icindeki merge_contiguous fonksiyonunu, ayni yol
  uzerinde bitisik (end_km ile sonraki start_km esit) parcalari tek
  RoadSegment'te birlestiren gerceklestirmeyle doldur.

reference_solution: |
  cat > roadnet/merger.py <<'MERGER'
  from roadnet.segments import RoadSegment


  def merge_contiguous(segments):
      if not segments:
          return []
      sorted_segs = sorted(segments, key=lambda s: (s.road_id, s.start_km))
      result = []
      cur_road = sorted_segs[0].road_id
      cur_start = sorted_segs[0].start_km
      cur_end = sorted_segs[0].end_km
      for seg in sorted_segs[1:]:
          if seg.road_id == cur_road and seg.start_km == cur_end:
              cur_end = seg.end_km
          else:
              result.append(RoadSegment(cur_road, cur_start, cur_end))
              cur_road = seg.road_id
              cur_start = seg.start_km
              cur_end = seg.end_km
      result.append(RoadSegment(cur_road, cur_start, cur_end))
      return result
  MERGER

