prompt: |
  session_trie/trie.py dosyasındaki SessionTrie sınıfının delete metodunu, verilen session_id'yi ağaçtan tamamen kaldıracak şekilde gerçekleştir. Bu metot, session_id'ye karşılık gelen tüm düğümleri ve terminal işaretini ağaçtan silmeli, böylece o session_id için find_user çağrısı None döndürmeli ve count_prefix o session_id'yi artık saymamalıdır. Metodu session_trie/trie.py dosyasında uygula.

setup: |
  mkdir -p session_trie
  cat > session_trie/__init__.py <<'EOF'
  EOF
  cat > session_trie/trie.py <<'TRIE'
  class SessionTrie:
      def __init__(self):
          self.root = {}
          self.terminal = "__end__"

      def insert(self, session_id, user_id):
          node = self.root
          for ch in session_id:
              node = node.setdefault(ch, {})
          node[self.terminal] = user_id

      def find_user(self, session_id):
          node = self.root
          for ch in session_id:
              if ch not in node:
                  return None
              node = node[ch]
          return node.get(self.terminal)

      def count_prefix(self, prefix):
          node = self.root
          for ch in prefix:
              if ch not in node:
                  return 0
              node = node[ch]
          return self._count_sessions(node)

      def _count_sessions(self, node):
          count = 0
          if self.terminal in node:
              count += 1
          for key, child in node.items():
              if key != self.terminal:
                  count += self._count_sessions(child)
          return count

      def delete(self, session_id):
          raise NotImplementedError
  TRIE
  cat > session_trie/manager.py <<'MANAGER'
  from session_trie.trie import SessionTrie


  class SessionManager:
      def __init__(self):
          self.trie = SessionTrie()

      def add_session(self, session_id, user_id):
          self.trie.insert(session_id, user_id)

      def get_user(self, session_id):
          return self.trie.find_user(session_id)

      def count_active(self, prefix):
          return self.trie.count_prefix(prefix)

      def remove_session(self, session_id):
          self.trie.delete(session_id)
  MANAGER

goal_tr: >
  session_trie/trie.py icindeki SessionTrie sinifinin delete metodunu,
  verilen session_id'yi agactan tamamen kaldiracak sekilde gerceklestir

reference_solution: |
  cat > session_trie/trie.py <<'TRIE'
  class SessionTrie:
      def __init__(self):
          self.root = {}
          self.terminal = "__end__"

      def insert(self, session_id, user_id):
          node = self.root
          for ch in session_id:
              node = node.setdefault(ch, {})
          node[self.terminal] = user_id

      def find_user(self, session_id):
          node = self.root
          for ch in session_id:
              if ch not in node:
                  return None
              node = node[ch]
          return node.get(self.terminal)

      def count_prefix(self, prefix):
          node = self.root
          for ch in prefix:
              if ch not in node:
                  return 0
              node = node[ch]
          return self._count_sessions(node)

      def _count_sessions(self, node):
          count = 0
          if self.terminal in node:
              count += 1
          for key, child in node.items():
              if key != self.terminal:
                  count += self._count_sessions(child)
          return count

      def delete(self, session_id):
          def _delete(node, chars, depth):
              if depth == len(chars):
                  if self.terminal in node:
                      del node[self.terminal]
                      return len(node) == 0
                  return False
              ch = chars[depth]
              if ch not in node:
                  return False
              should_delete_child = _delete(node[ch], chars, depth + 1)
              if should_delete_child:
                  del node[ch]
                  return len(node) == 0
              return False

          _delete(self.root, session_id, 0)
  TRIE

