prompt: |
  store/bst.py dosyasındaki ProductBST sınıfını, ürün kodlarını (int) ağaç anahtarı ve ürün adlarını (str) değer olarak saklayacak şekilde tamamla. Sınıfın insert, search, range_query ve inorder metotları çalışır durumda olmalı. Ayrıca store/inventory.py ve products.txt dosyalarının bu sınıfla uyumlu çalışacağını unutma.

