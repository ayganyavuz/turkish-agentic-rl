split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  auth/service.py dosyasındaki active_users fonksiyonunu düzeltin. Bu fonksiyon, verilen metin girdisindeki aktif kullanıcıların sayısını doğru şekilde döndürmelidir. Boş girdi için 0 döndürmeli, tekrar eden kullanıcılar ise yalnızca bir kez sayılmalıdır. Mevcut kodda bu işlevin hatalı olduğunu göz önünde bulundurarak auth/service.py dosyasını gereken düzeltmeleri yapacak şekilde güncelleyin.

setup: |
  mkdir -p auth
  cat > auth/store.py <<'STORE'
  def load_sessions(text):
      sessions = {}
      for line in text.strip().splitlines():
          sid, user, active = line.split(',')
          sessions[sid] = {'user': user, 'active': active == '1'}
      return sessions
  STORE
  cat > auth/service.py <<'SERVICE'
  from auth.store import load_sessions


  def active_users(text):
      sessions = load_sessions(text)
      users = set()
      for sid, data in sessions.items():
          if data['active']:
              users.add(data['user'])
      return len(users) + 1
  SERVICE
  cat > sessions.csv <<'CSV'
  a1,alice,1
  b2,bob,0
  c3,carol,1
  d4,alice,0
  CSV

goal_tr: >
  auth/service.py icindeki active_users fonksiyonunu, aktif kullanicilarin
  sayisini dogru dondurecek bicimde duzelt (bos girdi icin 0, tekrar eden
  kullanicilar bir kez sayilir)

reference_solution: |
  cat > auth/service.py <<'SERVICE'
  from auth.store import load_sessions


  def active_users(text):
      sessions = load_sessions(text)
      users = set()
      for sid, data in sessions.items():
          if data['active']:
              users.add(data['user'])
      return len(users)
  SERVICE

