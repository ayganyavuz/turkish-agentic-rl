# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  warehouse/stock.py içindeki StockManager sınıfında yer alan get_group_quantity metodunu gerçekleştir. Bu metot, link_products ile bağlanan ürün gruplarının toplam stok miktarını doğru hesaplamalıdır.

  Su sartlar saglanmali:
  - get_group_quantity metodu, verilen ürün kimliğinin (product_id) bağlı olduğu gruba ait tüm ürünlerin stok miktarlarının toplamını döndürmelidir.
  - Bağlantılar, link_products çağrılarıyla kurulur; aynı gruba ait ürünler birlikte değerlendirilmelidir.
  - Metot, NotImplementedError fırlatmamalı, gerçek bir hesaplama yapmalıdır.
  - Ürün grubu bağlantıları dolaylı olabilir; yani A-B ve B-C bağlantıları varsa A, B ve C aynı grubu oluşturur.

setup: |
  mkdir -p warehouse
  cat > warehouse/items.py <<'ITEMS'
  class Product:
      def __init__(self, product_id, name):
          self.product_id = product_id
          self.name = name

      def __repr__(self):
          return f"Product({self.product_id}, '{self.name}')"
  ITEMS
  cat > warehouse/stock.py <<'STOCK'
  from warehouse.items import Product


  class StockManager:
      def __init__(self):
          self.products = {}
          self.connections = {}
          self.quantities = {}

      def add_product(self, product_id, name, qty):
          self.products[product_id] = Product(product_id, name)
          self.connections[product_id] = product_id
          self.quantities[product_id] = qty

      def _find_root(self, product_id):
          while self.connections[product_id] != product_id:
              product_id = self.connections[product_id]
          return product_id

      def link_products(self, id1, id2):
          root1 = self._find_root(id1)
          root2 = self._find_root(id2)
          if root1 != root2:
              self.connections[root1] = root2

      def get_group_quantity(self, product_id):
          raise NotImplementedError
  STOCK
  cat > warehouse/__init__.py <<'INIT'
  INIT

goal_tr: >
  warehouse/stock.py icindeki StockManager sinifinda get_group_quantity
  metodunu, link_products ile baglanan urun gruplarinin toplam stok
  miktarini dogru hesaplayacak sekilde gerceklestir.

reference_solution: |
  cat > warehouse/stock.py <<'STOCK'
  from warehouse.items import Product


  class StockManager:
      def __init__(self):
          self.products = {}
          self.connections = {}
          self.quantities = {}

      def add_product(self, product_id, name, qty):
          self.products[product_id] = Product(product_id, name)
          self.connections[product_id] = product_id
          self.quantities[product_id] = qty

      def _find_root(self, product_id):
          while self.connections[product_id] != product_id:
              product_id = self.connections[product_id]
          return product_id

      def link_products(self, id1, id2):
          root1 = self._find_root(id1)
          root2 = self._find_root(id2)
          if root1 != root2:
              self.connections[root1] = root2

      def get_group_quantity(self, product_id):
          root = self._find_root(product_id)
          return sum(q for pid, q in self.quantities.items() if self._find_root(pid) == root)
  STOCK

