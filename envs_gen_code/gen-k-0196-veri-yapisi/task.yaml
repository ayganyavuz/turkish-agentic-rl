# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) `.` dizinindeki `transcript.py` dosyasını aç ve içindeki `TranscriptStack` sınıfını incele.

  2) `TranscriptStack` sınıfının `push`, `pop`, `peek`, `is_empty`, `size`, `clear` ve `__len__` metotlarının gövdelerini, yığın (stack) veri yapısının doğru semantiğini uygulayacak şekilde tamamla.

  3) Her metottaki `NotImplementedError` ifadesini, o metodun amacına uygun gerçek bir uygulamayla değiştir.

  4) Yaptığın değişiklikleri `transcript.py` dosyasına kaydet.

setup: |
  cat > transcript.py <<'PY'
  class TranscriptStack:
      def __init__(self):
          self._items = []
          self._size = 0

      def push(self, course, grade):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def is_empty(self):
          raise NotImplementedError

      def size(self):
          raise NotImplementedError

      def clear(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError
  PY

goal_tr: >
  transcript.py icindeki TranscriptStack sinifinin tum metotlarini, yigin
  semantigini dogru uygulayacak sekilde tamamla (NotImplementedError
  govdelerini dogru gerceklestirmelerle degistir).

reference_solution: |
  cat > transcript.py <<'PY'
  class TranscriptStack:
      def __init__(self):
          self._items = []
          self._size = 0

      def push(self, course, grade):
          self._items.append((course, grade))
          self._size += 1

      def pop(self):
          if self._size == 0:
              raise IndexError("pop from empty stack")
          self._size -= 1
          return self._items.pop()

      def peek(self):
          if self._size == 0:
              raise IndexError("peek from empty stack")
          return self._items[-1]

      def is_empty(self):
          return self._size == 0

      def size(self):
          return self._size

      def clear(self):
          self._items = []
          self._size = 0

      def __len__(self):
          return self._size
  PY

