id: gen-k-0223-yarisma
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  transcript.py’yi yeniden yaz; içinde bir öğrencinin not listesini alıp en yüksek ortalamaya sahip alt-dizinin başlangıç indeksini döndüren bir fonksiyon olsun.

setup: |
  mkdir -p .
  cat > transcript.py <<'EOF'
  def compute_gpa(grades):
      if not grades:
          return 0.0
      total = 0
      for grade in grades:
          total += grade
      return total / len(grades)

  def find_best_semester(grades):
      max_avg = -1
      best = 0
      prefix = 0
      for i in range(len(grades)):
          prefix += grades[i]
          avg = prefix / (i + 1)
          if avg > max_avg:
              max_avg = avg
              best = i
      return best
  EOF

goal_tr: >
  transcript.py dosyasini, bir ogrencinin not listesini alip en yuksek
  ortalamaya sahip alt-dizinin baslangic indeksini donduren bir fonksiyon
  icerecek sekilde yeniden yaz.

reference_solution: |
  cat > transcript.py <<'EOF'
  def compute_gpa(grades):
      if not grades:
          return 0.0
      total = 0
      for grade in grades:
          total += grade
      return total / len(grades)

  def find_best_semester(grades):
      if not grades:
          return -1
      max_avg = -1
      best = 0
      for start in range(len(grades)):
          sum_so_far = 0
          for end in range(start, len(grades)):
              sum_so_far += grades[end]
              length = end - start + 1
              avg = sum_so_far / length
              if avg > max_avg or (avg == max_avg and start < best):
                  max_avg = avg
                  best = start
      return best
  EOF

outputs:
  - {path: transcript.py, kind: program, run: 'python3 -c ''import transcript; assert transcript.find_best_semester([3,4,5])==2; assert transcript.find_best_semester([5,3,4])==0; assert transcript.find_best_semester([2,4,1,3])==1; assert transcript.find_best_semester([])==-1; assert transcript.find_best_semester([1,2,3,0,4])==4; print("TAMAM")'''}

checks:
  - {op: run_stdout_eq, cmd: 'python3 -c ''import transcript; assert transcript.find_best_semester([3,4,5])==2; assert transcript.find_best_semester([5,3,4])==0; assert transcript.find_best_semester([2,4,1,3])==1; assert transcript.find_best_semester([])==-1; assert transcript.find_best_semester([1,2,3,0,4])==4; print("TAMAM")''', value: TAMAM}

