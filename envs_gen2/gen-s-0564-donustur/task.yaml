id: gen-s-0564-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) kayitlar/hava.tsv dosyasındaki her şehri kendi adıyla cikti dizini altında bir alt dizine ayır.
  2) Her şehir dizininde o şehre ait satırları başlık satırı dahil olacak şekilde sehir.tsv adlı dosyaya yaz.
  3) Tüm şehir dizinlerini içeren hava.tar.gz arşivini oluştur.

setup: |
  mkdir -p kayitlar
  cat > kayitlar/hava.tsv <<'TSV'
  tarih	sehir	olcum
  2024-01-01	ankara	3
  2024-01-02	ankara	5
  2024-01-03	izmir	12
  2024-01-04	izmir	14
  2024-01-05	istanbul	8
  2024-01-06	istanbul	9
  2024-01-07	ankara	4
  2024-01-08	izmir	13
  2024-01-09	istanbul	7
  2024-01-10	ankara	6
  TSV

goal_tr: >
  kayitlar/hava.tsv dosyasindaki her sehri kendi adiyla bir alt dizine ayir;
  her sehir dizininde o sehre ait satirlari (baslik satiri dahil) sehir.tsv
  adli dosyaya yaz ve tum sehir dizinlerini iceren arsivi hava.tar.gz olarak
  olustur

reference_solution: |
  mkdir -p cikti
  tail -n +2 kayitlar/hava.tsv | cut -f2 | sort -u | while read s; do mkdir -p "cikti/$s"; { head -n1 kayitlar/hava.tsv; grep -P "\t$s\t" kayitlar/hava.tsv; } > "cikti/$s/$s.tsv"; done
  tar -cf hava.tar -C cikti .
  gzip -f hava.tar

outputs:
  - {path: hava.tar.gz, kind: file}
  - {path: cikti, kind: dir}

checks:
  - {op: dir_entries_eq, path: cikti, value: [ankara, istanbul, izmir]}
  - {op: run_stdout_eq, cmd: tar -tzf hava.tar.gz | sort, value: './

    ./ankara/

    ./ankara/ankara.tsv

    ./istanbul/

    ./istanbul/istanbul.tsv

    ./izmir/

    ./izmir/izmir.tsv'}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0564
    bundle: arsiv
    tools:
    - tar
    - gzip
    konu: hava-durumu-kayitlari
    hedef: donustur
    girdi: tsv
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: dolayli-hedef
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
