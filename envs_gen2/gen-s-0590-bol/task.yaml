id: gen-s-0590-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  randevular.json dosyasındaki randevu kayıtlarından bölüm adlarını çıkarıp tekrarsız olarak alfabetik sıraya diz ve sonucu bolumler.txt dosyasına yaz; dosyada her satırda yalnızca bir bölüm adı bulunsun.

setup: |
  cat > randevular.json <<'JSON'
  {"hastane":"Merkez","randevular":[
  {"hasta":"Ali","bolum":"Kardiyoloji","saat":"09:00"},
  {"hasta":"Ayse","bolum":"Noroloji","saat":"10:30"},
  {"hasta":"Can","bolum":"Kardiyoloji","saat":"11:00"},
  {"hasta":"Deniz","bolum":"Ortopedi","saat":"13:15"},
  {"hasta":"Ece","bolum":"Noroloji","saat":"14:00"},
  {"hasta":"Fatma","bolum":"Kardiyoloji","saat":"15:45"}
  ]}
  JSON

goal_tr: >
  randevular.json dosyasindaki randevularin bolum adlarini tekrarsiz olarak
  alfabetik sirada bolumler.txt dosyasina her satirda bir bolum olacak
  sekilde yaz

reference_solution: |
  cut -d'"' -f8 randevular.json | grep -v '^,' | grep -v '^\]' | grep -v '^}' | sort -u | tee bolumler.txt > /dev/null

outputs:
  - {path: bolumler.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: bolumler.txt, value: [Kardiyoloji, Noroloji, Ortopedi]}

metadata:
  domain: bol
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0590
    bundle: dallandir
    tools:
    - tee
    - cut
    konu: hastane-randevulari
    hedef: bol
    girdi: json
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: veriye-bak
    uslup: duz-hedef
    direnc: bos-dosya
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
