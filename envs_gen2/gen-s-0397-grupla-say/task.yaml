id: gen-s-0397-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) veri/olcumler.csv dosyasındaki her satırın ilk sütununda yer alan sensör adını incele ve her sensörün kaç satırda geçtiğini say.

  2) Elde ettiğin sensör adlarını ve her birinin geçiş sayısını, sensör adlarına göre artan sırada {sensör: sayı} biçiminde geçerli JSON olarak sensor_sayilari.json dosyasına yaz.

setup: |
  cat > olcumler.csv <<'CSV'
  s1,22.5,aktif
  s2,19.0,pasif
  s1,23.1,aktif
  s3,25.4,aktif
  s2,18.7,pasif
  s1,21.8,pasif
  s3,24.9,aktif
  s2,20.2,aktif
  CSV
  mkdir -p veri
  mv olcumler.csv veri/olcumler.csv

goal_tr: >
  veri/olcumler.csv dosyasindaki her sensorun (ilk sutun) kac satirda
  gectigini sayip sensor adlarina gore artan sirada {sensor: sayi} biciminde
  gecerli JSON olarak sensor_sayilari.json dosyasina yaz

reference_solution: |
  find veri -name 'olcumler.csv' -print > /dev/null
  cut -d, -f1 veri/olcumler.csv | sort | uniq -c | awk '{print $2, $1}' | sort > sayim.txt
  python3 -c "import json;d={};[d.__setitem__(l.split()[0],int(l.split()[1])) for l in open('sayim.txt')];open('sensor_sayilari.json','w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')"

outputs:
  - {path: sensor_sayilari.json, kind: json}

checks:
  - {op: json_eq, path: sensor_sayilari.json, value: {s1: 3, s2: 3, s3: 2}}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0397
    bundle: python-veri
    tools:
    - python3
    konu: sensor-olcumleri
    hedef: grupla-say
    girdi: csv
    kaynak: tek-dosya
    cikti: json
    kesif: dosyayi-bul
    uslup: numarali-emir
    direnc: baslik-yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
