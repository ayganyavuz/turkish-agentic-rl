id: gen-s-0325-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Kargo operasyonunda günler yoğun geçiyor; sabahki sevkiyat listesiyle akşamki teslimat kayıtları birbirine karışıyor, depodaki arkadaşlar hangi takip kodunun kaç kez işleme girdiğini elle saymaktan yorulmuş durumda. Elimizde kargo.log diye bir dosya var, içinde her satırda bir kayıt duruyor ama aynı kayıt birden fazla kez düşmüş. Bu dağınıklığı toparlayıp düzenli bir özet çıkarmak istiyorum.

  kargo.log dosyasındaki her satırı olduğu gibi koru, sadece tekrar eden satırları bir kez bırak; kalan benzersiz satırları taşıma koduna göre artan sırada sırala. Sonucu denetim.csv dosyasına CSV olarak yaz; dosyanın ilk satırında adet, takip_kodu, kalkis, varis, kg ve durum alanlarını bu sırayla içeren bir başlık olsun ve her satırın başına o satırın kaç kez geçtiğini gösteren bir sayı ekle.

setup: |
  cat > kargo.log <<'LOG'
  TR1001 ISTANBUL ANKARA 12.5 teslim
  TR1002 ANKARA IZMIR 8.0 yolda
  TR1001 ISTANBUL ANKARA 12.5 teslim
  TR1003 IZMIR ANKARA 15.2 teslim
  TR1002 ANKARA IZMIR 8.0 yolda
  TR1004 ANKARA ISTANBUL 3.7 iade
  TR1001 ISTANBUL ANKARA 12.5 teslim
  LOG

goal_tr: >
  kargo.log dosyasindaki her satiri aynen koruyarak tekrarlanan satirlari
  bir kez birak, kalan benzersiz satirlari tasima koduna gore artan sirada
  sirala ve her satirin basina kac kez gectigini gosteren sayaci
  "adet,takip_kodu,kalkis,varis,kg,durum" basligi altinda denetim.csv
  dosyasina CSV olarak yaz

reference_solution: |
  cat > denetim.csv <<'CSV'
  adet,takip_kodu,kalkis,varis,kg,durum
  CSV
  sort kargo.log | uniq -c | sort -k2,2 > gecici.txt
  awk '{print $1","$2","$3","$4","$5","$6}' gecici.txt >> denetim.csv
  rm gecici.txt

outputs:
  - {path: denetim.csv, kind: file}

checks:
  - {op: file_lines_eq, path: denetim.csv, value: ['adet,takip_kodu,kalkis,varis,kg,durum', '3,TR1001,ISTANBUL,ANKARA,12.5,teslim', '2,TR1002,ANKARA,IZMIR,8.0,yolda', '1,TR1003,IZMIR,ANKARA,15.2,teslim', '1,TR1004,ANKARA,ISTANBUL,3.7,iade']}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0325
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: kargo-takibi
    hedef: denetle
    girdi: log-satiri
    kaynak: tek-dosya
    cikti: csv
    kesif: yok
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
