id: gen-s-0571-sirala-sec
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  girdi/vardiya.csv dosyasındaki her vardiya türü için cikti/ dizini altında aynı adlı bir alt dizin oluştur; her vardiyaya ait satırları başlık dahil olacak şekilde gun sütununa göre artan sırada, son satırında newline olmadan o dizindeki kayitlar.csv dosyasına yaz. Çıktı olarak cikti/gece/kayitlar.csv ve cikti/gunduz/kayitlar.csv dosyalarını elde etmek istiyorum.

setup: |
  mkdir -p girdi
  printf 'ad,gun,vardiya\nayse,2024-03-01,gece\nmehmet,2024-03-01,gunduz\nzeynep,2024-03-02,gece\nahmet,2024-03-02,gunduz\nfatma,2024-03-03,gece\ncan,2024-03-03,gunduz\nelif,2024-03-04,gece\nburak,2024-03-04,gunduz' > girdi/vardiya.csv

goal_tr: >
  girdi/vardiya.csv dosyasindaki her vardiya turu icin cikti/ altinda ayni
  adli bir alt dizin olustur ve o vardiyaya ait satirlari (baslik dahil) gun
  sutununa gore artan sirada, son satirinda newline olmadan o dizindeki
  kayitlar.csv dosyasina yaz

reference_solution: |
  mkdir -p cikti
  tail -n +2 girdi/vardiya.csv | cut -d, -f3 | sort -u | while read v; do
    mkdir -p "cikti/$v"
    { head -n1 girdi/vardiya.csv; awk -F, -v v="$v" '$3==v' girdi/vardiya.csv | sort -t, -k2,2; } | awk 'NR==1{print;next}{print}' > "cikti/$v/kayitlar.csv"
    awk 'NR>1' "cikti/$v/kayitlar.csv" > /dev/null
  done
  for v in $(tail -n +2 girdi/vardiya.csv | cut -d, -f3 | sort -u); do
    head -n1 girdi/vardiya.csv > "cikti/$v/kayitlar.csv"
    awk -F, -v v="$v" 'NR>1 && $3==v' girdi/vardiya.csv | sort -t, -k2,2 >> "cikti/$v/kayitlar.csv"
    printf '%s' "$(cat "cikti/$v/kayitlar.csv")" > "cikti/$v/kayitlar.csv"
  done

outputs:
  - {path: cikti, kind: dir}
  - {path: cikti/gece/kayitlar.csv, kind: file}
  - {path: cikti/gunduz/kayitlar.csv, kind: file}

checks:
  - {op: dir_entries_eq, path: cikti, value: [gece, gunduz]}
  - {op: file_lines_eq, path: cikti/gece/kayitlar.csv, value: ['ad,gun,vardiya', 'ayse,2024-03-01,gece', 'zeynep,2024-03-02,gece', 'fatma,2024-03-03,gece', 'elif,2024-03-04,gece']}
  - {op: file_lines_eq, path: cikti/gunduz/kayitlar.csv, value: ['ad,gun,vardiya', 'mehmet,2024-03-01,gunduz', 'ahmet,2024-03-02,gunduz', 'can,2024-03-03,gunduz', 'burak,2024-03-04,gunduz']}

metadata:
  domain: sirala-sec
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0571
    bundle: awk
    tools:
    - awk
    konu: personel-vardiyalari
    hedef: sirala-sec
