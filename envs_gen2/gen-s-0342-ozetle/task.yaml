id: gen-s-0342-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) girdi/sicaklik.csv ve girdi/nem.csv dosyalarını sehir ve gun alanlarına göre birleştir; her sehir ve gun için sicaklik ile nem değerlerini eşleştir.

  2) Birleşen günlük kayıtları cikti/ozet.csv dosyasına sehir,gun,sicaklik,nem sütunlarıyla yaz; sayısal değerleri tam sayıya yuvarla ve satır sonu olarak CRLF kullanma.

  3) Aynı birleşik veriden her sehir için ortalama sicaklik ve ortalama nem değerlerini hesapla.

  4) Hesaplanan sehir bazlı ortalamaları cikti/ortalama.csv dosyasına sehir,ort_sicaklik,ort_nem sütunlarıyla yaz; sayısal değerleri tam sayıya yuvarla ve satır sonu olarak CRLF kullanma.

setup: |
  mkdir -p girdi cikti
  printf 'sehir,gun,sicaklik\r\nIstanbul,2024-03-01,12\r\nAnkara,2024-03-01,7\r\nIzmir,2024-03-01,18\r\nIstanbul,2024-03-02,10\r\nAnkara,2024-03-02,9\r\nIzmir,2024-03-02,20\r\nIstanbul,2024-03-03,15\r\nAnkara,2024-03-03,11\r\nIzmir,2024-03-03,22\r\n' > girdi/sicaklik.csv
  printf 'sehir,gun,nem\r\nIstanbul,2024-03-01,80\r\nAnkara,2024-03-01,60\r\nIzmir,2024-03-01,55\r\nIstanbul,2024-03-02,75\r\nAnkara,2024-03-02,65\r\nIzmir,2024-03-02,50\r\nIstanbul,2024-03-03,70\r\nAnkara,2024-03-03,62\r\nIzmir,2024-03-03,45\r\n' > girdi/nem.csv

goal_tr: >
  girdi/sicaklik.csv ve girdi/nem.csv dosyalarini sehir ve gun alanlarinda
  birlestirip her sehir icin ortalama sicaklik ve ortalama nem degerlerini
  hesaplayarak cikti/ozet.csv dosyasina sehir,gun,sicaklik,nem sutunlariyla
  gunluk kayitlari ve cikti/ortalama.csv dosyasina
  sehir,ort_sicaklik,ort_nem sutunlariyla sehir bazli ortalamalari yaz; iki
  dosyada da CRLF satir sonu kullanma ve sayisal degerleri tam sayiya
  yuvarla.

reference_solution: |
  tr -d '\r' < girdi/sicaklik.csv > cikti/sicaklik.tmp
  tr -d '\r' < girdi/nem.csv > cikti/nem.tmp
  awk -F, 'NR==FNR{if(FNR>1){nem[$1","$2]=$3}next} FNR>1{print $1","$2","$3","nem[$1","$2]}' cikti/nem.tmp cikti/sicaklik.tmp | sort -t, -k1,1 -k2,2 > cikti/ozet.csv
  awk -F, 'NR>1{s[$1]+=$3;n[$1]++} END{for(k in s){printf "%s,%d,%d\n",k,s[k]/n[k],0}}' cikti/ozet.csv | sort -t, -k1,1 > cikti/ortalama.tmp
  awk -F, 'NR==FNR{if(FNR>1){os[$1]=$2;on[$1]=$3}next} FNR>1{print $1","$2","$3}' cikti/ortalama.tmp cikti/ozet.csv | awk -F, 'NR==FNR{if(FNR>1){on[$1]=$3}next} {print $1","$2","on[$1]}' cikti/ortalama.tmp cikti/ozet.csv | sort -t, -k1,1 | awk -F, '!seen[$1]++{print}' > cikti/ortalama.csv
  rm -f cikti/sicaklik.tmp cikti/nem.tmp cikti/ortalama.tmp

outputs:
  - {path: cikti/ozet.csv, kind: file}
  - {path: cikti/ortalama.csv, kind: file}

checks:
  - {op: file_lines_eq, path: cikti/ortalama.csv, value: ['Ankara,2024-03-01,', 'Istanbul,2024-03-01,0', 'Izmir,2024-03-01,0']}
  - {op: file_lines_eq, path: cikti/ozet.csv, value: ['Ankara,2024-03-01,7,60', 'Ankara,2024-03-02,9,65', 'Ankara,2024-03-03,11,62', 'Istanbul,2024-03-01,12,80', 'Istanbul,2024-03-02,10,75', 'Istanbul,2024-03-03,15,70', 'Izmir,2024-03-01,18,55', 'Izmir,2024-03-02,20,50', 'Izmir,2024-03-03,22,45']}

