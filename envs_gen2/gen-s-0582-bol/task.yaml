    konu: kutuphane-kayitlari
    hedef: bol
    girdi: csv
    kaynak: tarball
    cikti: dizin-yapisi
    kesif: yok
    uslup: kabul-kriteri
    direnc: yok
    bukulme: yok
    adim: 4
