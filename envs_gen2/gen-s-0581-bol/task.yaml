    hedef: bol
    girdi: csv
    kaynak: cok-dosya
    cikti: birden-cok-dosya
    kesif: yok
    uslup: kabul-kriteri
    direnc: yok
    bukulme: kirli-veri
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
