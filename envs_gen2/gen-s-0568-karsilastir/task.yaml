id: gen-s-0568-karsilastir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  kutuphane/ocak.ini ve kutuphane/subat.ini dosyalarındaki ortak id'leri bul; her kaydın ad, ocak odunc ve subat odunc değerleriyle ortak.json dosyasına geçerli bir JSON dizisi yaz.

setup: |
  mkdir -p kutuphane
  cat > kutuphane/ocak.ini <<'INI'
  [kitap]
  id=101
  ad=Simyaci
  yazar=Coelho
  odunc=3
  [kitap]
  id=102
  ad=Kurk Mantolu Madonna
  yazar=Sabahattin Ali
  odunc=1
  [kitap]
  id=103
  ad=Tutunamayanlar
  yazar=Atay
  odunc=0
  INI
  cat > kutuphane/subat.ini <<'INI'
  [kitap]
  id=101
  ad=Simyaci
  yazar=Coelho
  odunc=5
  [kitap]
  id=103
  ad=Tutunamayanlar
  yazar=Atay
  odunc=2
  [kitap]
  id=104
  ad=Ince Memed
  yazar=Kemal
  odunc=4
  INI

goal_tr: >
  kutuphane/ocak.ini ve kutuphane/subat.ini dosyalarindaki her kitap icin id
  alanini anahtar kabul edip, iki dosyada da bulunan ortak id'lerin ad, ocak
  odunc ve subat odunc degerlerini iceren kayitlari ortak.json dosyasina
  gecerli bir JSON dizisi olarak yaz.

reference_solution: |
  grep '^id=' kutuphane/ocak.ini | cut -d= -f2 | sort > /tmp/ocak_id.txt
  grep '^id=' kutuphane/subat.ini | cut -d= -f2 | sort > /tmp/subat_id.txt
  comm -12 /tmp/ocak_id.txt /tmp/subat_id.txt > /tmp/ortak_id.txt
  {
    printf '['
    first=1
    while read -r id; do
      ad=$(awk -F= -v k="$id" '$1=="id"{f=1} f&&$1=="ad"{print $2; exit}' kutuphane/ocak.ini)
      o1=$(awk -F= -v k="$id" '$1=="id"{f=1} f&&$1=="odunc"{print $2; exit}' kutuphane/ocak.ini)
      o2=$(awk -F= -v k="$id" '$1=="id"{f=1} f&&$1=="odunc"{print $2; exit}' kutuphane/subat.ini)
      if [ $first -eq 0 ]; then printf ','; fi
      first=0
      printf '{"id":%s,"ad":"%s","ocak_odunc":%s,"subat_odunc":%s}' "$id" "$ad" "$o1" "$o2"
    done < /tmp/ortak_id.txt
    printf ']\n'
  } > ortak.json

outputs:
  - {path: ortak.json, kind: json, run: cat ortak.json}

checks:
  - {op: json_eq, path: ortak.json, value: [{id: 101, ad: Simyaci, ocak_odunc: 3, subat_odunc: 5}, {id: 103, ad: Simyaci, ocak_odunc: 3, subat_odunc: 5}]}

metadata:
  domain: karsilastir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0568
    bundle: kume-farki
    tools:
    - comm
    - sort
    konu: kutuphane-kayitlari
    hedef: karsilastir
    girdi: ini
    kaynak: iki-dosya-capraz
    cikti: json
    kesif: yok
    uslup: terse
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
