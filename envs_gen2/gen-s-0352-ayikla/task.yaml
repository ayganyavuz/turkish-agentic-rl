id: gen-s-0352-ayikla
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  gelen klasöründeki tüm .txt dosyalarındaki satırları birleştir; aynı içeriğe sahip tekrar eden satırlardan yalnızca bir tane bırakıp kalan benzersiz satırları alfabetik olarak sırala ve sonucu ciktilar.txt dosyasına yaz.

setup: |
  mkdir -p gelen
  cat > gelen/a.txt <<'T'
  masa:3 toplam:120 durum:odendi
  masa:1 toplam:80 durum:bekliyor
  masa:5 toplam:200 durum:odendi
  T
  cat > gelen/b.txt <<'T'
  masa:2 toplam:60 durum:iptal
  masa:4 toplam:150 durum:bekliyor
  masa:6 toplam:90 durum:odendi
  T

goal_tr: >
  gelen klasorundeki tum .txt dosyalarindaki satirlari birlestirip, ayni
  icerige sahip tekrarsiz satirlari alfabetik olarak sirala ve sonucu
  ciktilar.txt dosyasina yaz

reference_solution: |
  cat gelen/*.txt | sort > /tmp/tum.txt
  sort -u /tmp/tum.txt > /tmp/benzersiz.txt
  comm -12 /tmp/benzersiz.txt /tmp/benzersiz.txt > ciktilar.txt

outputs:
  - {path: ciktilar.txt, kind: file}

checks:
  - {op: file_lines_eq, path: ciktilar.txt, value: ['masa:1 toplam:80 durum:bekliyor', 'masa:2 toplam:60 durum:iptal', 'masa:3 toplam:120 durum:odendi', 'masa:4 toplam:150 durum:bekliyor', 'masa:5 toplam:200 durum:odendi', 'masa:6 toplam:90 durum:odendi']}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0352
    bundle: kume-farki
    tools:
    - comm
    - sort
    konu: restoran-siparisleri
    hedef: ayikla
    girdi: log-satiri
    kaynak: cok-dosya
    cikti: yeniden-adlandirilmis
    kesif: yok
    uslup: duz-hedef
    direnc: baslik-yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
