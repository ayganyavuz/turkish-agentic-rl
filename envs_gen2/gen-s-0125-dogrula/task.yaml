id: gen-s-0125-dogrula
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) takip.log dosyasındaki "KARGO TASINDI" ibaresini içeren satırların sayısını doğru şekilde belirt.
  2) Bulduğun sayının sadece numerik değerini dogrulanmis_sayi.txt dosyasının içine tek satır olarak yaz.

setup: |
  mkdir -p /workspace
  cd /workspace
  cat > takip.log <<'LOG'
  2024-01-01 08:12:01 KARGO-1001 KARGO TASINDI
  2024-01-01 08:15:02 KARGO-1002 KARGO TESLIM EDILDI
  2024-01-01 08:18:03 KARGO-1003 KARGO TASINDI
  2024-01-01 08:21:04 KARGO-1004 KARGO IADE ALINDI
  2024-01-01 08:24:05 KARGO-1005 KARGO TASINDI
  2024-01-01 08:27:06 KARGO-1006 KARGO TESLIM EDILDI
  2024-01-01 08:30:07 KARGO-1007 KARGO TASINDI
  2024-01-01 08:33:08 KARGO-1008 KARGO KAYIP BILDIRILDI
  2024-01-01 08:36:09 KARGO-1009 KARGO TASINDI
  LOG

goal_tr: >
  takip.log dosyasinda KARGO TASINDI ibaresi iceren satirlarin sayisini
  dogrulanmis_sayi.txt dosyasina tek sayi olarak yaz

reference_solution: |
  cd /workspace
  sed -n '/KARGO TASINDI/p' takip.log | wc -l | tr -d ' ' > dogrulanmis_sayi.txt

outputs:
  - {path: dogrulanmis_sayi.txt, kind: file}

checks:
  - {op: file_content_eq, path: dogrulanmis_sayi.txt, value: '5'}

alt_solutions:
  - name: rakip-1
    script: |
      grep -c "KARGO TASINDI" takip.log | tr -d '[:space:]' > dogrulanmis_sayi.txt

metadata:
  domain: dogrula
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0125
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: kargo-takibi
    hedef: dogrula
    girdi: log-satiri
    kaynak: tek-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    metadata: {}
