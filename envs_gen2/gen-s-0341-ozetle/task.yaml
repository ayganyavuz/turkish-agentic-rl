id: gen-s-0341-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Arşivdeki ölçüm kayıtlarını şehirlerle eşleştirip tek bir özet dosyasında toplamam gerekiyor; yoksa her seferinde iki dosyayı yan yana açıp gözle karşılaştırmak zorunda kalıyorum. Bugün de eski kayıtları düzenlerken bu iş yine önüme düştü. arsiv/olcumler.txt içindeki her istasyon kodunun ilk üç harfi arsiv/sehirler.txt içindeki kodlarla eşleşiyorsa, o istasyonun ölçüm satırını "şehir adı ölçüm" biçiminde, arsiv/sehirler.txt sırasına göre ozet.txt dosyasına yaz; arşiv dizinindeki ölçümler.txt dışındaki dosyaları dikkate alma.

setup: |
  mkdir -p arsiv
  cat > arsiv/olcumler.txt <<'EOF'
  IST001 20240101 12.5
  IST002 20240101 13.0
  IST003 20240101 11.8
  ANK001 20240101 04.2
  ANK002 20240101 05.1
  IZM001 20240101 18.4
  IZM002 20240101 17.9
  EOF
  cat > arsiv/sehirler.txt <<'EOF'
  IST Istanbul
  ANK Ankara
  IZM Izmir
  BRS Bursa
  EOF
  cat > arsiv/bozuk_yedek.txt <<'EOF'
  IST001 20240101 99.9
  ANK001 20240101 88.8
  EOF

goal_tr: >
  arsiv/olcumler.txt icindeki her istasyon kodunun ilk uc harfi
  arsiv/sehirler.txt icindeki kodlarla eslesiyorsa o istasyonun olcum
  satirini "sehir adi olcum" biciminde arsiv/sehirler.txt sirasina gore
  ozet.txt dosyasina yaz; arsiv dizinindeki olcumler.txt disindaki dosyalari
  dikkate alma.

reference_solution: |
  find arsiv -maxdepth 1 -name 'olcumler.txt' -type f > arsiv/kapsam.txt
  cut -c1-3 arsiv/olcumler.txt | sort -u > arsiv/kodlar.txt
  awk 'NR==FNR{ad[$1]=$2; next} {kod=substr($0,1,3); if (kod in ad) print ad[kod], substr($0,5)}' arsiv/sehirler.txt arsiv/olcumler.txt > ozet.txt
  wc -l ozet.txt arsiv/kapsam.txt

outputs:
  - {path: ozet.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: ozet.txt, value: [Istanbul 01 20240101 12.5, Istanbul 02 20240101 13.0, Istanbul 03 20240101 11.8, Ankara 01 20240101 04.2, Ankara 02 20240101 05.1, Izmir 01 20240101 18.4, Izmir 02 20240101 17.9]}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0341
    bundle: dizin-istatistik
    tools:
    - wc
    - find
    konu: hava-durumu-kayitlari
    hedef: ozetle
    girdi: sabit-genislik
    kaynak: iki-dosya-capraz
    cikti: satir-listesi
    kesif: veriye-bak
    uslup: baglam-gomulu
    direnc: yok
    bukulme: tuzak-dosya
    adim: 3
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
