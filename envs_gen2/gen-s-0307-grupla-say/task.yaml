id: gen-s-0307-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) girdi klasöründeki vardiya.txt dosyasını oku; bu dosyada her satırda bir personelin adı ve tuttuğu vardiya türü yer alıyor.

  2) Bu dosyadaki kayıtlara göre en çok vardiya tutan personelin adını ve toplam vardiya sayısını belirle.

  3) Belirlediğin bu adı ve sayıyı, aralarında bir boşluk olacak şekilde "ad sayi" biçiminde, tek satır olarak sonuc.txt dosyasına yaz.

setup: |
  mkdir -p girdi
  cat > girdi/vardiya.txt <<'TXT'
  Ayse  gece
  Mehmet gunduz
  Ayse  gunduz
  Zeynep gece
  Mehmet gece
  Ayse  gece
  TXT

goal_tr: >
  girdi klasorundeki tek duz-metin vardiya dosyasinda en cok vardiya tutan
  personelin adini ve vardiya sayisini "ad sayi" biciminde tek satir olarak
  sonuc.txt dosyasina yaz.

reference_solution: |
  dosya=$(find girdi -type f | head -n 1)
  python3 -c "
  import sys
  from collections import Counter
  c = Counter()
  with open(sys.argv[1]) as f:
      for line in f:
          c[line.split()[0]] += 1
  ad, sayi = sorted(c.items(), key=lambda kv: (-kv[1], kv[0]))[0]
  print(ad, sayi)
  " "$dosya" > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: Ayse 3}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0307
    bundle: python-veri
    tools:
    - python3
    konu: personel-vardiyalari
    hedef: grupla-say
    girdi: duz-metin
    kaynak: tek-dosya
    cikti: tek-sayi
    kesif: dosyayi-bul
    uslup: numarali-emir
    direnc: yok
