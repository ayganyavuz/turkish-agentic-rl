id: gen-s-0567-ozetle
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Hafta sonu için şehir bazlı bir hava durumu özeti hazırlamam gerekiyordu ama elimdeki ham kayıtlar dağınık; her şehir için birden fazla tarih var ve ben sadece en güncel durumu görmek istiyorum. Bu yüzden /workspace içindeki hava.tsv dosyasını kullanarak her şehir için en son tarihli kaydın olay değerini alıp ozet.txt dosyasına yazmanı istiyorum. Çıktıda her satır "sehir<TAB>olay" biçiminde olsun, yani şehir adı ve olay arasında sekme karakteri bulunsun; başka sütun ya da başlık satırı olmasın.

setup: |
  cat > hava.tsv <<'TSV'
  sehir	tarih	olay
  Ankara	2024-01-01	kar
  Ankara	2024-01-02	kar
  Ankara	2024-01-03	gunes
  Izmir	2024-01-01	yagmur
  Izmir	2024-01-02	yagmur
  Izmir	2024-01-03	gunes
  Bursa	2024-01-01	kar
  Bursa	2024-01-02	gunes
  Bursa	2024-01-03	gunes
  TSV

goal_tr: >
  hava.tsv dosyasindaki her sehir icin en son tarihli kaydin olay degerini
  "sehir<TAB>olay" biciminde ozet.txt dosyasina yaz

reference_solution: |
  tail -n +2 hava.tsv | sort -k1,1 -k2,2 | awk -F'\t' '{a[$1]=$3} END {for (s in a) print s"\t"a[s]}' | sort > gecici.txt
  head -n 100 gecici.txt > ozet.txt
  rm gecici.txt

outputs:
  - {path: ozet.txt, kind: lines}

checks:
  - {op: file_lines_eq, path: ozet.txt, value: ["Ankara\tgunes", "Bursa\tgunes", "Izmir\tgunes"]}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0567
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: hava-durumu-kayitlari
    hedef: ozetle
    girdi: tsv
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: baglam-gomulu
    direnc: tekrar-eden-kayit
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
