id: gen-s-0388-grupla-say
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Bu hafta vardiya planlamasıyla uğraşırken elimizdeki kayıtları düzenli tutmak epey zorlaştı; aylık dosyalar birikince kimin hangi vardiyada olduğunu takip etmek imkânsız hale geldi. İnsan kaynakları için vardiya dağılımına dair kısa bir özet çıkarmamız gerekiyor, yoksa her seferinde tüm dosyaları tek tek açıp saymak zorunda kalıyoruz. Bu yüzden vardiyalar klasöründeki tüm json dosyalarındaki kayıtları vardiya alanına göre gruplayıp, her vardiyadaki kişi sayısını vardiya ve sayı sütunlarıyla vardiya_sayilari.csv dosyasına yazmanı istiyorum.

setup: |
  mkdir -p vardiyalar
  cat > vardiyalar/ocak.json <<'JSON'
  {"gun":"pazartesi","vardiya":"sabah","kisi":"ali"}
  {"gun":"pazartesi","vardiya":"sabah","kisi":"ayse"}
  {"gun":"pazartesi","vardiya":"gece","kisi":"veli"}
  JSON
  cat > vardiyalar/subat.json <<'JSON'
  {"gun":"sali","vardiya":"sabah","kisi":"ali"}
  {"gun":"sali","vardiya":"gece","kisi":"ayse"}
  {"gun":"sali","vardiya":"gece","kisi":"veli"}
  {"gun":"sali","vardiya":"gece","kisi":"can"}
  JSON

goal_tr: >
  vardiyalar klasorundeki tum json dosyalarindaki kayitlari vardiya alanina
  gore gruplayip her vardiyadaki kisi sayisini vardiya ve sayi sutunlariyla
  vardiya_sayilari.csv dosyasina yaz

reference_solution: |
  find vardiyalar -name '*.json' -type f -exec cat {} + | sed 's/.*"vardiya":"\([^"]*\)".*/\1/' | sort | uniq -c | awk '{print $2 "," $1}' > vardiya_sayilari.csv
  wc -l < vardiya_sayilari.csv

outputs:
  - {path: vardiya_sayilari.csv, kind: file}

checks:
  - {op: file_lines_eq, path: vardiya_sayilari.csv, value: ['gece,4', 'sabah,3']}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0388
    bundle: dizin-istatistik
    tools:
    - wc
    - find
    konu: personel-vardiyalari
    hedef: grupla-say
    girdi: json
    kaynak: cok-dosya
    cikti: csv
    kesif: yok
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    aile: kabuk
    metadata: {}
