# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sensor/series.py içindeki SensorTrie sınıfını gerçekleştir: add aynı sensor_id'nin değerlerini biriktirsin, prefix verilen önekle başlayan id'leri alfabetik sırada döndürsün, total tüm değerlerin toplamını versin. sensor/stream.py'deki readings ile data.txt kayıtlarını yükleyip bu üç metodu çalıştır.

setup: |
  mkdir -p sensor
  cat > sensor/stream.py <<'STREAM'
  def readings(text):
      out = []
      for line in text.strip().splitlines():
          parts = line.split()
          out.append((parts[0], parts[1:]))
      return out
  STREAM
  cat > sensor/series.py <<'SERIES'
  class SensorTrie:
      def __init__(self):
          raise NotImplementedError

      def add(self, sensor_id, values):
          raise NotImplementedError

      def prefix(self, p):
          raise NotImplementedError

      def total(self, sensor_id):
          raise NotImplementedError
  SERIES
  cat > sensor/__init__.py <<'INIT'
  INIT
  cat > data.txt <<'DATA'
  temp01 3 4 5
  temp02 1
  tempX 9
  hum01 2 2
  DATA

goal_tr: >
  sensor/series.py icindeki SensorTrie sinifini gerceklestir: add
  sensor_id'yi values listesiyle kaydetsin (ayni id tekrar gelirse degerler
  biriksin), prefix verilen onekle baslayan sensor_id'leri alfabetik sirada
  dondursun, total sensor_id'nin tum degerlerinin toplamini dondursun;
  sensor/stream.py'deki readings ciktisini kullanarak data.txt'teki tum
  kayitlari yukleyip bu uc metodu dogru calistir.

reference_solution: |
  cat > sensor/series.py <<'SERIES'
  class SensorTrie:
      def __init__(self):
          self._root = {}
          self._sums = {}

      def add(self, sensor_id, values):
          node = self._root
          for ch in sensor_id:
              node = node.setdefault(ch, {})
          node.setdefault('$', [])
          node['$'].extend(values)
          self._sums[sensor_id] = self._sums.get(sensor_id, 0) + sum(values)

      def prefix(self, p):
          node = self._root
          for ch in p:
              if ch not in node:
                  return []
              node = node[ch]
          found = []
          stack = [(node, p)]
          while stack:
              cur, acc = stack.pop()
              if '$' in cur:
                  found.append(acc)
              for ch in cur:
                  if ch != '$':
                      stack.append((cur[ch], acc + ch))
          return sorted(found)

      def total(self, sensor_id):
          return self._sums.get(sensor_id, 0)
  SERIES

