# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depot/unionfind.py dosyasındaki UnionFind sınıfını tam olarak gerçekleştir. Sınıf; __init__, find, union, connected, group_count ve group_sizes metotlarını içermeli ve bu metotlar gerçek bir birleştir-bul yapısının beklenen davranışını vermeli. Bu sayede depot/inventory.py içindeki merge_batches, bin_groups, largest_group_size ve same_group fonksiyonları batches.txt dosyasındaki birleştirme satırlarına göre doğru raf gruplarını döndürsün. batches.txt her satırında iki sayı (bir birleştirme çifti) bulunur; bin_groups her grubu kendi içinde artan sırada ve grupları da artan sırada döndürmeli, largest_group_size en büyük grubun eleman sayısını vermeli, same_group ise verilen iki rafın aynı grupta olup olmadığını döndürmeli.

  Şu şartlar sağlanmalı:
  - depot/unionfind.py dosyası mevcut ve içinde UnionFind sınıfı tanımlı.
  - UnionFind sınıfı __init__, find, union, connected, group_count ve group_sizes metotlarına sahip ve hiçbiri NotImplementedError fırlatmıyor.
  - UnionFind gerçek bir birleştir-bul yapısı gibi çalışıyor: birleştirilen elemanlar aynı grupta, birleştirilmeyenler ayrı gruplarda görünüyor.
  - depot/inventory.py içindeki merge_batches, bin_groups, largest_group_size ve same_group fonksiyonları değiştirilmeden batches.txt içeriğine göre doğru sonucu üretiyor.
  - bin_groups çıktısı her grup kendi içinde artan, gruplar arası artan sırada listeler döndürüyor.
  - largest_group_size en büyük grubun eleman sayısını döndürüyor; hiç grup yoksa 0 döndürüyor.
  - same_group aynı gruptaki iki raf için doğru, farklı gruplardaki iki raf için yanlış değer döndürüyor.

setup: |
  mkdir -p depot
  cat > depot/__init__.py <<'INIT'
  INIT
  cat > depot/unionfind.py <<'UF'
  class UnionFind:
      def __init__(self, n):
          raise NotImplementedError

      def find(self, x):
          raise NotImplementedError

      def union(self, a, b):
          raise NotImplementedError

      def connected(self, a, b):
          raise NotImplementedError

      def group_count(self):
          raise NotImplementedError

      def group_sizes(self):
          raise NotImplementedError
  UF
  cat > depot/inventory.py <<'INV'
  from depot.unionfind import UnionFind


  def merge_batches(n_bins, merges):
      uf = UnionFind(n_bins)
      for a, b in merges:
          uf.union(a, b)
      return uf


  def bin_groups(n_bins, merges):
      uf = merge_batches(n_bins, merges)
      groups = {}
      for b in range(n_bins):
          groups.setdefault(uf.find(b), []).append(b)
      return sorted(sorted(v) for v in groups.values())


  def largest_group_size(n_bins, merges):
      uf = merge_batches(n_bins, merges)
      sizes = uf.group_sizes()
      if not sizes:
          return 0
      return max(sizes)


  def same_group(n_bins, merges, a, b):
      uf = merge_batches(n_bins, merges)
      return uf.connected(a, b)
  INV
  cat > batches.txt <<'BATCH'
  0 1
  2 3
  1 3
  5 6
  BATCH

goal_tr: >
  depot/unionfind.py icindeki UnionFind sinifini tam olarak gerceklestir;
  oyle ki depot/inventory.py icindeki bin_groups, largest_group_size ve
  same_group fonksiyonlari batches.txt'deki birlestirmelere gore dogru raf
  gruplarini dondursun.

reference_solution: |
  cat > depot/unionfind.py <<'UF'
  class UnionFind:
      def __init__(self, n):
          self.parent = list(range(n))
          self.rank = [0] * n
          self.size = [1] * n
          self.count = n

      def find(self, x):
          root = x
          while self.parent[root] != root:
              root = self.parent[root]
          while self.parent[x] != root:
              self.parent[x], x = root, self.parent[x]
          return root

      def union(self, a, b):
          ra, rb = self.find(a), self.find(b)
          if ra == rb:
              return False
          if self.rank[ra] < self.rank[rb]:
              ra, rb = rb, ra
          self.parent[rb] = ra
          self.size[ra] += self.size[rb]
          if self.rank[ra] == self.rank[rb]:
              self.rank[ra] += 1
          self.count -= 1
          return True

      def connected(self, a, b):
          return self.find(a) == self.find(b)

      def group_count(self):
          return self.count

      def group_sizes(self):
          return sorted(self.size[i] for i in range(len(self.parent)) if self.parent[i] == i)
  UF

