# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) sensor/series.py dosyasındaki SensorSeries sınıfını, değerleri bağlı liste olarak tutacak şekilde yaz; sınıfın append, to_list, max_reading ve count_above metodları doğru çalışsın.

  2) append metodu, verilen değeri bağlı listeye bir düğüm olarak eklesin.

  3) to_list metodu, bağlı listedeki tüm değerleri sırayla bir liste olarak döndürsün.

  4) max_reading metodu, bağlı listedeki en büyük değeri döndürsün.

  5) count_above metodu, bağlı listede verilen eşikten büyük olan değerlerin sayısını döndürsün.

  6) sensor/summary.py dosyasındaki summarize fonksiyonu, SensorSeries sınıfını kullanarak readings, count, max ve above anahtarlarını içeren bir sözlük döndürsün.

setup: |
  mkdir -p sensor
  cat > sensor/node.py <<'NODE'
  class ReadingNode:
      def __init__(self, value, nxt=None):
          self.value = value
          self.next = nxt
  NODE
  cat > sensor/series.py <<'SERIES'
  from sensor.node import ReadingNode


  class SensorSeries:
      def __init__(self):
          raise NotImplementedError

      def append(self, value):
          raise NotImplementedError

      def to_list(self):
          raise NotImplementedError

      def max_reading(self):
          raise NotImplementedError

      def count_above(self, threshold):
          raise NotImplementedError
  SERIES
  cat > sensor/summary.py <<'SUMMARY'
  from sensor.series import SensorSeries


  def summarize(values, threshold):
      series = SensorSeries()
      for v in values:
          series.append(v)
      return {
          "readings": series.to_list(),
          "count": len(series.to_list()),
          "max": series.max_reading(),
          "above": series.count_above(threshold),
      }
  SUMMARY

goal_tr: >
  sensor/series.py icindeki SensorSeries sinifini, degerleri bagli liste
  olarak tutacak ve append, to_list, max_reading, count_above metodlarini
  dogru gerceklestirecek bicimde yaz; sensor/summary.py icindeki summarize
  fonksiyonu bu sinifi kullanarak readings, count, max ve above
  anahtarlarini dondursun.

reference_solution: |
  cat > sensor/series.py <<'SERIES'
  from sensor.node import ReadingNode


  class SensorSeries:
      def __init__(self):
          self.head = None
          self.tail = None
          self.size = 0

      def append(self, value):
          node = ReadingNode(value)
          if self.head is None:
              self.head = node
              self.tail = node
          else:
              self.tail.next = node
              self.tail = node
          self.size += 1

      def to_list(self):
          out = []
          cur = self.head
          while cur is not None:
              out.append(cur.value)
              cur = cur.next
          return out

      def max_reading(self):
          if self.head is None:
              return None
          best = self.head.value
          cur = self.head.next
          while cur is not None:
              if cur.value > best:
                  best = cur.value
              cur = cur.next
          return best

      def count_above(self, threshold):
          total = 0
          cur = self.head
          while cur is not None:
              if cur.value > threshold:
                  total += 1
              cur = cur.next
          return total
  SERIES

