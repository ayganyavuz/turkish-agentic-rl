# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sensor/aggregate.py dosyasındaki bucket_totals fonksiyonunda bir sorun var: fonksiyon çağrılar arasında birikim taşıyor, yani bir çağrıda üretilen kova toplamları sonraki çağrının sonucuna sızıyor. Bu fonksiyonu, her çağrı yalnızca kendi serisinden üretilen kova toplamlarını döndürecek şekilde düzelt. Bunu yaparken sensor/readings.py dosyasına dokunma; oradaki parse_series ve deltas fonksiyonları olduğu gibi kalmalı. sensor/aggregate.py içindeki largest_jump fonksiyonunun davranışı da değişmemeli.

setup: |
  mkdir -p sensor
  cat > sensor/readings.py <<'READINGS'
  def parse_series(text):
      out = []
      for line in text.strip().splitlines():
          if not line.strip():
              continue
          ts, val = line.split(',')
          out.append((int(ts), float(val)))
      return out


  def deltas(series):
      return [series[i + 1][1] - series[i][1] for i in range(len(series) - 1)]
  READINGS
  cat > sensor/aggregate.py <<'AGGREGATE'
  from sensor.readings import parse_series, deltas

  DEFAULT_BUCKETS = {}


  def bucket_totals(text, bucket_seconds, acc=DEFAULT_BUCKETS):
      series = parse_series(text)
      for ts, val in series:
          key = ts // bucket_seconds
          acc[key] = acc.get(key, 0.0) + val
      return acc


  def largest_jump(text):
      series = parse_series(text)
      d = deltas(series)
      if not d:
          return None
      best = max(range(len(d)), key=lambda i: abs(d[i]))
      return series[best][0], d[best]
  AGGREGATE
  printf '0,1.0\n5,2.5\n12,0.5\n' > series_a.csv
  printf '0,10.0\n7,10.5\n20,3.0\n' > series_b.csv

goal_tr: >
  sensor/aggregate.py icindeki bucket_totals fonksiyonunu, cagrilar arasinda
  birikim tasimayacak sekilde duzelt; her cagri yalnizca kendi serisinden
  uretilen kova toplamlarini dondurmeli.

reference_solution: |
  cat > sensor/aggregate.py <<'AGGREGATE'
  from sensor.readings import parse_series, deltas


  def bucket_totals(text, bucket_seconds, acc=None):
      if acc is None:
          acc = {}
      series = parse_series(text)
      for ts, val in series:
          key = ts // bucket_seconds
          acc[key] = acc.get(key, 0.0) + val
      return acc


  def largest_jump(text):
      series = parse_series(text)
      d = deltas(series)
      if not d:
          return None
      best = max(range(len(d)), key=lambda i: abs(d[i]))
      return series[best][0], d[best]
  AGGREGATE

