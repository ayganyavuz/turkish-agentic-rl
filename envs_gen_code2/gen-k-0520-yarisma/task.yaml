# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depot/report.py dosyasını sıfırdan yaz. Bu dosya, depot/inventory.py içindeki load_inventory fonksiyonunu kullanarak stock.txt gibi bir envanter metnini okuyup zone alanına göre toplam miktarları hesaplayan iki fonksiyon içersin: zone_totals(text) ve busiest_zone(text). zone_totals, zone adlarını toplam miktarlara eşleyen bir sözlük döndürsün; busiest_zone ise toplamı en yüksek olan zone'un adını döndürsün.

setup: |
  mkdir -p depot
  cat > depot/records.py <<'REC'
  def split_blocks(text):
      blocks = []
      current = []
      for raw in text.splitlines():
          line = raw.rstrip()
          if line.strip() == "":
              if current:
                  blocks.append(current)
                  current = []
              continue
          current.append(line)
      if current:
          blocks.append(current)
      return blocks


  def parse_field(line):
      key, _, value = line.partition(":")
      return key.strip(), value.strip()


  def parse_block(lines):
      header = lines[0]
      fields = {}
      for line in lines[1:]:
          key, value = parse_field(line)
          fields[key] = value
      return header, fields
  REC
  cat > depot/inventory.py <<'INV'
  from depot.records import split_blocks, parse_block


  def load_inventory(text):
      items = {}
      for block in split_blocks(text):
          header, fields = parse_block(block)
          name = header.split()[0]
          qty = int(fields.get("qty", "0"))
          items[name] = qty
      return items
  INV
  cat > stock.txt <<'TXT'
  crate A-1
  qty: 12
  zone: north

  crate B-2
  qty: 5
  zone: south

  crate C-3
  qty: 30
  zone: north
  TXT

goal_tr: >
  depot/report.py dosyasini sifirdan yaz: load_inventory ile envanteri
  okuyup zone alanina gore toplam miktarlari hesaplayan zone_totals(text) ve
  toplami en yuksek olan zone'u donduren busiest_zone(text) fonksiyonlarini
  icersin; zone_totals sozluk, busiest_zone ise zone adi dondurur.

reference_solution: |
  cat > depot/report.py <<'REP'
  from depot.records import split_blocks, parse_block


  def _rows(text):
      rows = []
      for block in split_blocks(text):
          header, fields = parse_block(block)
          name = header.split()[0]
          qty = int(fields.get("qty", "0"))
          zone = fields.get("zone", "")
          rows.append((name, qty, zone))
      return rows


  def zone_totals(text):
      totals = {}
      for name, qty, zone in _rows(text):
          totals[zone] = totals.get(zone, 0) + qty
      return totals


  def busiest_zone(text):
      totals = zone_totals(text)
      if not totals:
          return None
      return max(sorted(totals), key=lambda z: totals[z])
  REP

