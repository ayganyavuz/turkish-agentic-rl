# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depot/alerts.py dosyasındaki low_stock ve deficit fonksiyonlarını düzelt. Miktarı yeniden sipariş eşiğine eşit olan ürünler de düşük stok olarak sayılmalı; yani hem eşit hem de eşiğin altındaki miktarlar düşük stok kabul edilmeli. Düzeltmeden sonra low_stock, miktarı yeniden sipariş eşiğine eşit ya da ondan az olan ürünlerin sku'larını girdi sırasına göre döndürmeli; deficit ise her düşük stoklu ürünü yeniden sipariş eşiğinin üzerine çıkarmak için gereken toplam birim sayısını hesaplamalı.

setup: |
  mkdir -p depot
  cat > depot/stock.py <<'STOCK'
  def parse_lines(text):
      """Return list of (sku, qty, reorder_at) tuples."""
      rows = []
      for line in text.strip().splitlines():
          sku, qty, reorder_at = line.split(',')
          rows.append((sku, int(qty), int(reorder_at)))
      return rows


  def total_units(text):
      return sum(q for _, q, _ in parse_lines(text))
  STOCK
  cat > depot/alerts.py <<'ALERTS'
  from depot.stock import parse_lines


  def low_stock(text):
      """Return skus whose qty is at or below reorder_at, in input order."""
      rows = parse_lines(text)
      return [sku for sku, qty, reorder_at in rows if qty < reorder_at]


  def deficit(text):
      """Total units needed to bring each low sku back above reorder_at."""
      rows = parse_lines(text)
      return sum(reorder_at - qty for _, qty, reorder_at in rows if qty < reorder_at)
  ALERTS
  cat > inventory.csv <<'CSV'
  bolt,4,5
  nut,10,10
  washer,0,3
  screw,7,6
  CSV

goal_tr: >
  depot/alerts.py icindeki low_stock ve deficit fonksiyonlarini, miktari
  yeniden siparis esigine esit olan urunleri de dusuk stok sayacak bicimde
  duzelt

reference_solution: |
  cat > depot/alerts.py <<'ALERTS'
  from depot.stock import parse_lines


  def low_stock(text):
      """Return skus whose qty is at or below reorder_at, in input order."""
      rows = parse_lines(text)
      return [sku for sku, qty, reorder_at in rows if qty <= reorder_at]


  def deficit(text):
      """Total units needed to bring each low sku back above reorder_at."""
      rows = parse_lines(text)
      return sum(reorder_at - qty for _, qty, reorder_at in rows if qty <= reorder_at)
  ALERTS

