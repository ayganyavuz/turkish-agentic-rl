# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) docs/query.py dosyasındaki first_occurrences fonksiyonunu, belgede bulunmayan kelimeler için -1 döndürecek şekilde düzelt.

  2) Belgede bulunan kelimeler için ilk konum değerinin aynen korunmasını sağla.

setup: |
  mkdir -p docs
  cat > docs/store.py <<'STORE'
  def add_document(store, doc_id, text):
      store[doc_id] = text


  def get_document(store, doc_id):
      return store[doc_id]


  def word_positions(store, doc_id):
      positions = {}
      for index, word in enumerate(store[doc_id].split()):
          positions.setdefault(word, []).append(index)
      return positions
  STORE
  cat > docs/query.py <<'QUERY'
  from docs.store import get_document, word_positions


  def first_occurrences(store, doc_id, words):
      positions = word_positions(store, doc_id)
      result = {}
      for word in words:
          result[word] = positions[word][0]
      return result


  def contains_all(store, doc_id, words):
      text_words = set(get_document(store, doc_id).split())
      return all(word in text_words for word in words)
  QUERY
  cat > build_store.py <<'BUILD'
  from docs.store import add_document

  STORE = {}
  add_document(STORE, "a", "red blue green red")
  add_document(STORE, "b", "green yellow")

  if __name__ == "__main__":
      print(STORE)
  BUILD

goal_tr: >
  docs/query.py icindeki first_occurrences fonksiyonunu, belgede bulunmayan
  kelimeler icin -1 dondurecek sekilde duzelt; belgede bulunan kelimeler
  icin ilk konum aynen kalsin.

reference_solution: |
  cat > docs/query.py <<'QUERY'
  from docs.store import get_document, word_positions


  def first_occurrences(store, doc_id, words):
      positions = word_positions(store, doc_id)
      result = {}
      for word in words:
          if word in positions:
              result[word] = positions[word][0]
          else:
              result[word] = -1
      return result


  def contains_all(store, doc_id, words):
      text_words = set(get_document(store, doc_id).split())
      return all(word in text_words for word in words)
  QUERY

