# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  readings.txt dosyasındaki her satırda verilen sensör serisinin en uzun artan alt dizisinin uzunluğunu hesaplayan longest_increasing.py dosyasını oluştur. Program her satır için hesapladığı uzunluğu büyükten küçüğe sıralı olarak tek satırda yazsın; her satırda yalnızca sayı bulunsun.

setup: |
  cat > readings.txt <<'DATA'
  1 3 2 4 5 2 1
  3 1 4 1 5 9 2
  2 6 5 3 5 8 9
  7 9 3 2 3 8 4
  DATA

goal_tr: >
  readings.txt dosyasindaki her satirda verilen sensor serisinin en uzun
  artan alt dizisinin uzunlugunu hesaplayip, her satir icin bu uzunlugu
  buyukten kucuge sirali olarak tek satirda yazan longest_increasing.py
  dosyasini olustur.

reference_solution: |
  cat > longest_increasing.py <<'PY'
  import sys


  def lis_length(values):
      tails = []
      for value in values:
          lo, hi = 0, len(tails)
          while lo < hi:
              mid = (lo + hi) // 2
              if tails[mid] < value:
                  lo = mid + 1
              else:
                  hi = mid
          if lo == len(tails):
              tails.append(value)
          else:
              tails[lo] = value
      return len(tails)


  def main():
      path = sys.argv[1] if len(sys.argv) > 1 else "readings.txt"
      results = []
      with open(path) as handle:
          for line in handle:
              parts = line.split()
              if not parts:
                  continue
              results.append(lis_length([int(p) for p in parts]))
      results.sort(reverse=True)
      for value in results:
          print(value)


  if __name__ == "__main__":
      main()
  PY

