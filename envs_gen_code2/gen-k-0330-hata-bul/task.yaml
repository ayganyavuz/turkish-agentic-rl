split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sensor/stats.py dosyasındaki mean_series ve peak_to_peak fonksiyonlarını düzelt. Şu an bu fonksiyonlar hiç ölçüm satırı olmayan bir girdiyle çağrıldığında, yani girdi boş olduğunda ya da yalnızca boş satırlardan oluştuğunda çöküyor. Bu durumda çökmek yerine mean_series 0.0, peak_to_peak de 0.0 döndürsün. Davranış diğer tüm girdilerde aynı kalsın.

setup: |
  mkdir -p sensor
  cat > sensor/reader.py <<'READER'
  def parse_series(text):
      rows = []
      for line in text.splitlines():
          line = line.strip()
          if not line:
              continue
          ts, value = line.split(',')
          rows.append((int(ts), float(value)))
      return rows
  READER
  cat > sensor/stats.py <<'STATS'
  from sensor.reader import parse_series


  def mean_series(text):
      rows = parse_series(text)
      total = 0.0
      for _, value in rows:
          total += value
      return total / len(rows)


  def peak_to_peak(text):
      rows = parse_series(text)
      values = [value for _, value in rows]
      return max(values) - min(values)
  STATS
  cat > data.csv <<'CSV'
  10,2.0
  20,4.0
  30,6.0
  CSV

goal_tr: >
  sensor/stats.py icindeki mean_series ve peak_to_peak fonksiyonlarini, hic
  olcum satiri olmayan (bos veya yalnizca bos satirlardan olusan) girdide
  cokme yerine sirasiyla 0.0 ve 0.0 dondurecek bicimde duzelt

reference_solution: |
  cat > sensor/stats.py <<'STATS'
  from sensor.reader import parse_series


  def mean_series(text):
      rows = parse_series(text)
      if not rows:
          return 0.0
      total = 0.0
      for _, value in rows:
          total += value
      return total / len(rows)


  def peak_to_peak(text):
      rows = parse_series(text)
      if not rows:
          return 0.0
      values = [value for _, value in rows]
      return max(values) - min(values)
  STATS

