# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  pricing/catalog.py dosyasındaki PriceList sınıfını, bağlı liste üzerinde çalışan append, find, update, remove, total, to_list ve size metodlarının gerçek gerçekleştirmeleriyle doldur. Böylece pricing/summary.py içindeki cheapest_skus ve catalog_total fonksiyonları doğru sonuç döndürsün.

setup: |
  mkdir -p pricing
  cat > pricing/node.py <<'NODE'
  class PriceNode:
      def __init__(self, sku, price):
          self.sku = sku
          self.price = price
          self.next = None
  NODE
  cat > pricing/catalog.py <<'CATALOG'
  from pricing.node import PriceNode


  class PriceList:
      def __init__(self):
          self.head = None
          self._size = 0

      def append(self, sku, price):
          raise NotImplementedError

      def find(self, sku):
          raise NotImplementedError

      def update(self, sku, price):
          raise NotImplementedError

      def remove(self, sku):
          raise NotImplementedError

      def total(self):
          raise NotImplementedError

      def to_list(self):
          raise NotImplementedError

      def size(self):
          raise NotImplementedError
  CATALOG
  cat > pricing/summary.py <<'SUMMARY'
  from pricing.catalog import PriceList


  def cheapest_skus(pairs, k):
      pl = PriceList()
      for sku, price in pairs:
          pl.append(sku, price)
      ordered = sorted(pl.to_list(), key=lambda p: (p[1], p[0]))
      return [sku for sku, _ in ordered[:k]]


  def catalog_total(pairs):
      pl = PriceList()
      for sku, price in pairs:
          pl.append(sku, price)
      return pl.total()
  SUMMARY

goal_tr: >
  pricing/catalog.py icindeki PriceList sinifini, bagli liste uzerinde
  calisan append, find, update, remove, total, to_list ve size metodlarinin
  gercek gerceklestirmeleriyle doldur; boylece pricing/summary.py icindeki
  cheapest_skus ve catalog_total dogru sonuc dondursun.

reference_solution: |
  cat > pricing/catalog.py <<'CATALOG'
  from pricing.node import PriceNode


  class PriceList:
      def __init__(self):
          self.head = None
          self._size = 0

      def append(self, sku, price):
          node = PriceNode(sku, price)
          if self.head is None:
              self.head = node
          else:
              cur = self.head
              while cur.next is not None:
                  cur = cur.next
              cur.next = node
          self._size += 1

      def find(self, sku):
          cur = self.head
          while cur is not None:
              if cur.sku == sku:
                  return cur.price
              cur = cur.next
          return None

      def update(self, sku, price):
          cur = self.head
          while cur is not None:
              if cur.sku == sku:
                  cur.price = price
                  return True
              cur = cur.next
          return False

      def remove(self, sku):
          prev = None
          cur = self.head
          while cur is not None:
              if cur.sku == sku:
                  if prev is None:
                      self.head = cur.next
                  else:
                      prev.next = cur.next
                  self._size -= 1
                  return True
              prev = cur
              cur = cur.next
          return False

      def total(self):
          acc = 0.0
          cur = self.head
          while cur is not None:
              acc += cur.price
              cur = cur.next
          return acc

      def to_list(self):
          out = []
          cur = self.head
          while cur is not None:
              out.append((cur.sku, cur.price))
              cur = cur.next
          return out

      def size(self):
          return self._size
  CATALOG

