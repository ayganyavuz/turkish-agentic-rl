# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depot/parser.py dosyasındaki parse_moves fonksiyonunu düzeltmen gerekiyor. Şu anki hali, her satırdaki isteğe bağlı birim etiketini yanlış okuyor; oysa birim etiketi '@' işaretinden sonra gelen alanda yer alıyor ve boşluksuz tek bir etiket olarak veriliyor. Fonksiyon hareketleri doğru şekilde ayrıştırmalı; öyle ki depot/inventory.py içindeki net_stock doğru stok değerlerini döndürebilsin. depot/parser.py dışındaki dosyaları değiştirmene gerek yok, sadece bu dosyayı ele al.

setup: |
  mkdir -p depot
  cat > depot/parser.py <<'PARSER'
  def parse_moves(text):
      """Parse a warehouse movement log.

      Each non-empty line has the form:
          <op> <item> <qty>[ @ <unit>]
      where op is IN or OUT, qty is an integer, and the optional
      trailing field after '@' is a unit label (no spaces).

      Returns a list of dicts with keys: op, item, qty, unit.
      """
      moves = []
      for raw in text.splitlines():
          line = raw.strip()
          if not line or line.startswith('#'):
              continue
          parts = line.split()
          op = parts[0]
          item = parts[1]
          qty = int(parts[2])
          unit = ''
          if len(parts) > 3:
              unit = parts[3]
          moves.append({'op': op, 'item': item, 'qty': qty, 'unit': unit})
      return moves
  PARSER
  cat > depot/inventory.py <<'INV'
  from depot.parser import parse_moves


  def net_stock(text):
      """Return a dict mapping item -> net quantity (IN minus OUT)."""
      totals = {}
      for m in parse_moves(text):
          sign = 1 if m['op'] == 'IN' else -1
          totals[m['item']] = totals.get(m['item'], 0) + sign * m['qty']
      return totals
  INV
  cat > log.txt <<'LOG'
  # warehouse log
  IN bolt 10 @ box
  OUT bolt 3 @ box
  IN nut 5
  OUT nut 2
  IN bolt 4
  LOG

