# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sensor/aggregate.py içindeki moving_average fonksiyonunu düzelt: her pencere için doğru (zaman damgası, değer) çiftlerini döndürsün.

setup: |
  mkdir -p sensor
  cat > sensor/reader.py <<'READER'
  def parse_series(text):
      rows = []
      for line in text.strip().splitlines():
          ts, val = line.split(',')
          rows.append((int(ts), float(val)))
      return rows
  READER
  cat > sensor/aggregate.py <<'AGG'
  from sensor.reader import parse_series


  def moving_average(text, window):
      rows = parse_series(text)
      out = []
      total = 0.0
      for i, (ts, val) in enumerate(rows):
          total += val
          if i >= window:
              total -= rows[i - window][1]
          if i >= window - 1:
              out.append((ts, round(total / window, 3)))
              return out
      return out
  AGG
  cat > series.csv <<'CSV'
  1,2.0
  2,4.0
  3,6.0
  4,8.0
  5,10.0
  CSV

goal_tr: >
  sensor/aggregate.py icindeki moving_average fonksiyonunu, her pencere icin
  dogru hareketli ortalama ciftlerini (zaman damgasi, deger) dondurecek
  bicimde duzelt

