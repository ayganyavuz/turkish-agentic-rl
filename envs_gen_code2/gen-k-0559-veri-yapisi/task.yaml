goal_tr: >
  docs/index.py icindeki DocIndex sinifini, her belgeyi kelimelere ayirip
  kelimeleri bir ikili arama agacina yerlestiren, search ile o kelimeyi
  iceren belge kimliklerini artan sirada, prefix ile verilen onekle baslayan
  kelimeleri alfabetik sirada donduren ve size ile agactaki benzersiz kelime
  sayisini veren bicimde tamamla.

reference_solution: |
  cat > docs/index.py <<'INDEX'
  from docs.tokens import normalize


  class _Node:
      __slots__ = ("word", "docs", "left", "right")

      def __init__(self, word, doc_id):
          self.word = word
          self.docs = [doc_id]
          self.left = None
          self.right = None


  class DocIndex:
      def __init__(self):
          self._root = None
          self._count = 0

      def _insert(self, node, word, doc_id):
          if node is None:
              return _Node(word, doc_id)
          if word == node.word:
              if doc_id not in node.docs:
                  node.docs.append(doc_id)
          elif word < node.word:
              node.left = self._insert(node.left, word, doc_id)
          else:
              node.right = self._insert(node.right, word, doc_id)
          return node

      def add(self, doc_id, text):
          for word in normalize(text):
              if not word:
                  continue
              before = self._lookup(self._root, word)
              self._root = self._insert(self._root, word, doc_id)
              if before is None:
                  self._count += 1

      def _lookup(self, node, word):
          while node is not None:
              if word == node.word:
                  return node
              node = node.left if word < node.word else node.right
          return None

      def search(self, word):
          node = self._lookup(self._root, word)
          if node is None:
              return []
          return sorted(node.docs)

      def prefix(self, pre):
          out = []
          self._collect(self._root, pre, out)
          return sorted(out)

      def _collect(self, node, pre, out):
          if node is None:
              return
          if node.word.startswith(pre):
              out.append(node.word)
          self._collect(node.left, pre, out)
          self._collect(node.right, pre, out)

      def size(self):
          return self._count
  INDEX

