  docs/index.py içindeki DocIndex sınıfını tamamla: eklenen her belgeyi kelimelere ayırıp ikili arama ağacına koysun. search kelimeyi içeren belge kimliklerini artan sırada, prefix verilen önekle başlayan kelimeleri alfabetik sırada döndürsün, size de ağaçtaki benzersiz kelime sayısını versin.

