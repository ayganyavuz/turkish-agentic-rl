prompt: |
  orderflow/queue_base.py dosyasındaki OrderQueue sınıfını tam bir FIFO kuyruğu olarak gerçekleştir. push metodu yeni kaydı kuyruğun sonuna eklesin, pop metodu kuyruğun başındaki kaydı çıkarıp döndürsün, peek metodu kuyruğun başındaki kaydı çıkarmadan döndürsün. size kuyruktaki kayıt sayısını, is_empty kuyruğun boş olup olmadığını döndürsün. total_amount kuyrukta bulunan tüm kayıtların amount değerlerinin toplamını döndürsün. Ayrıca orderflow/batch.py dosyasındaki drain_batches ve total_revenue fonksiyonları bu sınıf üzerinde doğru şekilde çalışsın.

  Şu şartlar sağlanmalı:
  - orderflow/queue_base.py dosyasında OrderQueue sınıfı, hiçbir metodu NotImplementedError fırlatmayacak şekilde tam olarak gerçekleştirilmiş olmalı.
  - push, kaydı kuyruğun sonuna eklemeli.
  - pop, kuyruğun başındaki kaydı çıkarıp döndürmeli; kuyruk FIFO sırasını korumalı.
  - peek, kuyruğun başındaki kaydı çıkarmadan döndürmeli ve kuyruk değişmemeli.
  - size, kuyrukta bulunan kayıt sayısını döndürmeli.
  - is_empty, kuyruk boşken doğru, doluyken yanlış değer döndürmeli.
  - total_amount, kuyrukta bulunan tüm kayıtların amount değerlerinin toplamını döndürmeli.
  - orderflow/batch.py içindeki drain_batches fonksiyonu bu sınıf üzerinde doğru çalışmalı; batch_size kadar kaydı gruplayıp liste listesi döndürmeli, son parti daha kısa olabilmeli, kuyruk boşken boş liste döndürmeli.
  - orderflow/batch.py içindeki total_revenue fonksiyonu bu sınıf üzerinde doğru çalışmalı; kuyruktaki tüm amount değerlerini toplayıp kuyruğu boşaltmalı.

