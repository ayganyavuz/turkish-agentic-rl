      """FIFO queue of order records.

      Each record is a tuple (order_id, customer, amount).
      """

      def __init__(self):
          raise NotImplementedError

      def push(self, order_id, customer, amount):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def size(self):
          raise NotImplementedError

      def is_empty(self):
          raise NotImplementedError

      def total_amount(self):
          raise NotImplementedError
  BASE
  cat > orderflow/batch.py <<'BATCH'
  from orderflow.queue_base import OrderQueue


  def drain_batches(queue, batch_size):
      """Pop orders from queue and group them into batches.

      Returns a list of lists. The final batch may be shorter than
      batch_size. If the queue is empty, returns an empty list.
      """
      batches = []
      while not queue.is_empty():
          batch = []
          for _ in range(batch_size):
              if queue.is_empty():
                  break
              batch.append(queue.pop())
          batches.append(batch)
      return batches


  def total_revenue(queue):
      """Sum the amount field of every order in the queue, leaving it empty."""
      total = 0.0
      while not queue.is_empty():
          order = queue.pop()
          total += order[2]
      return total
  BATCH
  cat > orderflow/__init__.py <<'INIT'
  INIT

goal_tr: >
  orderflow/queue_base.py icindeki OrderQueue sinifini FIFO kuyruk olarak
  tam gerceklestir; push sona eklesin, pop bastan cikarsin, peek cikarmadan
  basi dondursun, size ve is_empty dogru olsun, total_amount kuyruktaki tum
  amount degerlerinin toplamini dondursun ve orderflow/batch.py icindeki
  drain_batches ile total_revenue bu sinif uzerinde dogru calissin.

reference_solution: |
  cat > orderflow/queue_base.py <<'BASE'
  class OrderQueue:
      """FIFO queue of order records.

      Each record is a tuple (order_id, customer, amount).
      """

      def __init__(self):
          self._items = []
          self._head = 0

      def push(self, order_id, customer, amount):
          self._items.append((order_id, customer, amount))

      def pop(self):
          if self.is_empty():
              raise IndexError("pop from empty OrderQueue")
          order = self._items[self._head]
          self._head += 1
          if self._head > 64 and self._head * 2 >= len(self._items):
              self._items = self._items[self._head:]
              self._head = 0
          return order

      def peek(self):
          if self.is_empty():
              raise IndexError("peek from empty OrderQueue")
          return self._items[self._head]

      def size(self):
          return len(self._items) - self._head

      def is_empty(self):
          return self.size() == 0

      def total_amount(self):
          total = 0.0
          for i in range(self._head, len(self._items)):
              total += self._items[i][2]
          return total
  BASE

