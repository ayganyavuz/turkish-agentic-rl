# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sensor_queue.py içindeki SensorQueue sınıfını, (value, sensor_id) çiftlerini tutan bir öncelik kuyruğu olarak gerçekleştir. pop_max en yüksek değeri, eşitlikte en küçük sensor_id'yi döndürsün.

setup: |
  cat > sensor_queue.py <<'PY'
  class SensorQueue:
      def __init__(self):
          raise NotImplementedError

      def push(self, sensor_id, value):
          raise NotImplementedError

      def pop_max(self):
          raise NotImplementedError

      def size(self):
          raise NotImplementedError
  PY

goal_tr: >
  sensor_queue.py icindeki SensorQueue sinifini, (value, sensor_id)
  ciftlerini tutan ve pop_max ile en yuksek degeri (esitlikte en kucuk
  sensor_id'yi) donduren bir oncelik kuyrugu olacak bicimde gerceklestir.

reference_solution: |
  cat > sensor_queue.py <<'PY'
  import heapq


  class SensorQueue:
      def __init__(self):
          self._heap = []

      def push(self, sensor_id, value):
          heapq.heappush(self._heap, (-value, sensor_id))

      def pop_max(self):
          if not self._heap:
              raise IndexError("pop from empty queue")
          neg_value, sensor_id = heapq.heappop(self._heap)
          return (sensor_id, -neg_value)

      def size(self):
          return len(self._heap)
  PY

