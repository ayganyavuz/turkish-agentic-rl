# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  planner/events.py dosyasındaki make_event ve clone_event fonksiyonlarını, çağrılar arasında paylaşılan değiştirilebilir varsayılan değer kullanmayacak biçimde düzelt. Böylece bir etkinliğe eklenen etiketler başka etkinliklere sızmasın. planner/agenda.py ve check_agenda.py dosyalarındaki mevcut davranış korunmalı.

setup: |
  mkdir -p planner
  cat > planner/events.py <<'EVENTS'
  def make_event(title, day, tags=None):
      return {"title": title, "day": day, "tags": tags}


  def clone_event(event, extra_tags=[]):
      tags = list(event["tags"]) if event["tags"] else []
      tags.extend(extra_tags)
      return {"title": event["title"], "day": event["day"], "tags": tags}
  EVENTS
  cat > planner/agenda.py <<'AGENDA'
  from planner.events import make_event, clone_event


  def build_week(titles):
      week = []
      for index, title in enumerate(titles):
          day = index + 1
          event = make_event(title, day)
          week.append(event)
      return week


  def add_recurring(week, title, days):
      recurring = make_event(title, days[0])
      for day in days:
          copy = clone_event(recurring)
          copy["day"] = day
          week.append(copy)
      return week
  AGENDA
  cat > check_agenda.py <<'CHECK'
  from planner.agenda import build_week, add_recurring

  week = build_week(["standup", "review"])
  add_recurring(week, "sync", [2, 4])
  print(week)
  CHECK

goal_tr: >
  planner/events.py icindeki make_event ve clone_event fonksiyonlarini,
  cagrilar arasinda paylasilan degistirilebilir varsayilan deger
  kullanmayacak bicimde duzelt; boylece bir etkinlige eklenen etiketler
  baska etkinliklere sizmasin.

reference_solution: |
  cat > planner/events.py <<'EVENTS'
  def make_event(title, day, tags=None):
      return {"title": title, "day": day, "tags": list(tags) if tags else []}


  def clone_event(event, extra_tags=None):
      tags = list(event["tags"]) if event["tags"] else []
      if extra_tags:
          tags.extend(extra_tags)
      return {"title": event["title"], "day": event["day"], "tags": tags}
  EVENTS

