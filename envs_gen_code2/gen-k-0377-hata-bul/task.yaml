# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Dün akşam depo tarafındaki fatura dökümünü incelerken muhasebeden biri iade ve iptal olan satırların hâlâ toplama girdiğini söyledi; ben de bugün oturup şu raporlama kısmına bakayım dedim. Malum, ay sonu yaklaşıyor ve rakamların temiz çıkması lazım.

  shop/rollup.py dosyasındaki billable_total ve count_billable fonksiyonları şu an iptal edilmiş ya da iade edilmiş kayıtları da hesaba katıyor gibi görünüyor; bunların yalnızca geçerli, yani iptal ve iade edilmemiş kayıtları sayması gerekiyor. Bu düzeltmeyi yaparken elimizdeki orders.txt dosyası için billable_total toplamının 550, count_billable adedinin ise 2 dönmesini bekliyorum. Sadece shop/rollup.py üzerinde çalış, diğer dosyalara dokunma.

setup: |
  mkdir -p shop
  cat > shop/records.py <<'RECORDS'
  def parse_line(line):
      parts = line.split('|')
      return {
          'sku': parts[0],
          'qty': int(parts[1]),
          'unit_cents': int(parts[2]),
          'status': parts[3],
      }


  def parse_records(text):
      return [parse_line(l) for l in text.strip().splitlines() if l.strip()]
  RECORDS
  cat > shop/rollup.py <<'ROLLUP'
  from shop.records import parse_records


  def billable_total(text):
      total = 0
      for r in parse_records(text):
          if r['status'] != 'cancelled' or r['status'] != 'refunded':
              total += r['qty'] * r['unit_cents']
      return total


  def count_billable(text):
      n = 0
      for r in parse_records(text):
          if r['status'] != 'cancelled' or r['status'] != 'refunded':
              n += 1
      return n
  ROLLUP
  cat > orders.txt <<'DATA'
  A1|2|150|paid
  B2|1|900|cancelled
  C3|4|50|refunded
  D4|1|250|paid
  DATA

goal_tr: >
  shop/rollup.py icindeki billable_total ve count_billable fonksiyonlarini,
  yalnizca iptal ve iade edilmemis kayitlari sayacak bicimde duzelt;
  orders.txt icin toplam 550 ve adet 2 donmelidir.

