# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Sprint planlamasında oturum yönetimi işi bu hafta bana kaldı; dün akşam geç saatlere kadar auth tarafındaki eski kodları okuyup notlar çıkardım, bugün de asıl düzeltmeye geçiyorum. Ekip olarak sınır durumlarında tuhaf davranışlar gördüğümüz için önce en kritik parçayı ele almak istiyorum.

  auth/session.py dosyasındaki is_valid fonksiyonu şu an yanlış bir sınır kuralı uyguluyor; now değeri expires_at değerine eşit olduğunda oturumu hâlâ geçerli sayıyor. Bunu, now değeri expires_at değerine eşit veya ondan büyük olduğunda oturumu geçersiz sayacak şekilde düzeltmeni istiyorum. Sadece bu davranış değişsin, dosyadaki diğer fonksiyonların imzaları ve mantığı olduğu gibi kalsın.

setup: |
  mkdir -p auth
  cat > auth/store.py <<'STORE'
  SESSIONS = {}


  def put(token, user_id, expires_at):
      SESSIONS[token] = (user_id, expires_at)


  def get(token):
      return SESSIONS.get(token)
  STORE
  cat > auth/session.py <<'SESSION'
  from auth.store import put, get


  def start(token, user_id, now, ttl):
      put(token, user_id, now + ttl)


  def is_valid(token, now):
      entry = get(token)
      if entry is None:
          return False
      _, expires_at = entry
      return now <= expires_at


  def active_users(tokens, now):
      ids = []
      for token in tokens:
          entry = get(token)
          if entry is None:
              continue
          user_id, _ = entry
          if is_valid(token, now):
              ids.append(user_id)
      return ids
  SESSION

goal_tr: >
  auth/session.py icindeki is_valid fonksiyonunu, now degeri expires_at
  degerine esit veya ondan buyuk oldugunda oturumu gecersiz sayacak bicimde
  duzelt.

reference_solution: |
  cat > auth/session.py <<'SESSION'
  from auth.store import put, get


  def start(token, user_id, now, ttl):
      put(token, user_id, now + ttl)


  def is_valid(token, now):
      entry = get(token)
      if entry is None:
          return False
      _, expires_at = entry
      return now < expires_at


  def active_users(tokens, now):
      ids = []
      for token in tokens:
          entry = get(token)
          if entry is None:
              continue
          user_id, _ = entry
          if is_valid(token, now):
              ids.append(user_id)
      return ids
  SESSION

