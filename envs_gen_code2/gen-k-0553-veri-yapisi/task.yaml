prompt: |
  Depo yönetimi tarafında acil stok talepleri bazen sırayla karışıyor; hangi talebin daha önce işleme alınacağını netleştirmek için öncelik kavramına ihtiyacımız var. Bugün bu işi tek bir dosyada toparlamaya çalışıyoruz. /workspace altındaki warehouse.py dosyasında InventoryQueue sınıfı şu an sadece iskelet halinde duruyor ve metotları NotImplementedError fırlatıyor.

  Bu sınıfı, küçük öncelik numarası olan öğelerin daha önce çıkacağı bir öncelik kuyruğu olarak çalışacak biçimde gerçekleştir. push, pop, peek ve len desteklensin. Aynı öncelik numarasına sahip öğelerde ise önce eklenen önce çıksın.

setup: |
  cat > warehouse.py <<'PY'
  class InventoryQueue:
      """Priority queue of restock requests.

      Lower priority number means more urgent.
      """

      def __init__(self):
          raise NotImplementedError

      def push(self, priority, item):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError
  PY

goal_tr: >
  warehouse.py icindeki InventoryQueue sinifini, kucuk oncelik numarasi daha
  once cikacak sekilde calisan bir oncelik kuyrugu olarak gerceklestir;
  push, pop, peek ve len desteklensin ve esit onceliklerde once eklenen once
  cikarilsin.

reference_solution: |
  cat > warehouse.py <<'PY'
  import heapq


  class InventoryQueue:
      """Priority queue of restock requests.

      Lower priority number means more urgent.
      """

      def __init__(self):
          self._heap = []
          self._counter = 0

      def push(self, priority, item):
          heapq.heappush(self._heap, (priority, self._counter, item))
          self._counter += 1

      def pop(self):
          if not self._heap:
              raise IndexError("pop from empty queue")
          priority, _, item = heapq.heappop(self._heap)
          return item

      def peek(self):
          if not self._heap:
              raise IndexError("peek from empty queue")
          return self._heap[0][2]

      def __len__(self):
          return len(self._heap)
  PY

