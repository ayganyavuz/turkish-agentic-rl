prompt: |
  price_trie.py dosyasındaki PriceTrie sınıfını gerçekleştir. insert metodu bir ürün adını verdiği fiyatla kaydetsin; aynı ad tekrar eklenirse fiyatı güncellensin. price metodu tam eşleşen adın fiyatını döndürsün, böyle bir ad kayıtlı değilse None döndürsün. names_with_prefix metodu verilen önekle başlayan tüm adları alfabetik sıralı bir liste olarak döndürsün. prefix_total metodu bu adların fiyat toplamını döndürsün. Boş önek tüm kayıtlı adları kapsasın. Kayıtlı olmayan bir ad veya hiçbir adla eşleşmeyen bir önek için hata fırlatılmasın.

  Şu şartlar sağlanmalı:
  - price_trie.py dosyası PriceTrie sınıfını içermeli ve sınıfın insert, price, names_with_prefix, prefix_total metotları çalışır durumda olmalı.
  - insert aynı adla tekrar çağrıldığında önceki fiyat yeni fiyatla güncellenmeli, ad ikinci kez listede görünmemeli.
  - price tam eşleşen adın fiyatını döndürmeli; ad kayıtlı değilse None döndürmeli.
  - names_with_prefix verilen önekle başlayan adları alfabetik sıralı liste olarak döndürmeli.
  - prefix_total verilen önekle başlayan adların fiyat toplamını döndürmeli.
  - Boş önek tüm kayıtlı adları kapsamalı.
  - Kayıtlı olmayan ad veya eşleşmeyen önek için hata fırlatılmamalı.

