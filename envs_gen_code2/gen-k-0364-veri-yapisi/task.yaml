goal_tr: >
  price_trie.py icindeki PriceTrie sinifini gerceklestir: insert urun adini
  fiyatla kaydetsin (ayni ad tekrar eklenirse fiyati guncellesin), price tam
  eslesen adin fiyatini dondursun (yoksa None), names_with_prefix verilen
  onekle baslayan adlari alfabetik sirali liste olarak dondursun,
  prefix_total bu adlarin fiyat toplamini dondursun; bos onek tum adlari
  kapsar ve kayitli olmayan ad icin hata firlatilmasin.

reference_solution: |
  cat > price_trie.py <<'PY'
  class PriceTrie:
      """Prefix tree mapping product names to their unit prices (in cents)."""

      def __init__(self):
          self.root = {}

      def insert(self, name, cents):
          node = self.root
          for ch in name:
              node = node.setdefault(ch, {})
          node["$"] = cents

      def _walk(self, prefix):
          node = self.root
          for ch in prefix:
              if ch not in node:
                  return None
              node = node[ch]
          return node

      def price(self, name):
          node = self._walk(name)
          if node is None:
              return None
          return node.get("$")

      def _collect(self, node, prefix, out):
          if "$" in node:
              out.append(prefix)
          for ch in sorted(k for k in node if k != "$"):
              self._collect(node[ch], prefix + ch, out)

      def names_with_prefix(self, prefix):
          node = self._walk(prefix)
          if node is None:
              return []
          out = []
          self._collect(node, prefix, out)
          return out

      def prefix_total(self, prefix):
          total = 0
          for n in self.names_with_prefix(prefix):
              total += self.price(n)
          return total
  PY

