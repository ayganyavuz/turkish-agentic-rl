goal_tr: >
  sensors/cache.py icindeki LRU sinifini (kapasite sinirli, en son
  kullanilani basa alan onbellek) ve sensors/window.py icindeki Window
  sinifini, penceredeki en yeni okumayi ts ile sorgulayip onbellekten
  donecek bicimde gerceklestir; kapasite asildiginda en eski kullanilan
  anahtar dusurulsun ve ayni ts tekrar eklendiginde degeri guncellensin.

reference_solution: |
  cat > sensors/cache.py <<'CACHE'
  from collections import OrderedDict


  class LRU:
      def __init__(self, capacity):
          if capacity <= 0:
              raise ValueError("capacity must be positive")
          self.capacity = capacity
          self._data = OrderedDict()

      def get(self, key):
          if key not in self._data:
              return None
          self._data.move_to_end(key)
          return self._data[key]

      def put(self, key, value):
          if key in self._data:
              self._data.move_to_end(key)
          self._data[key] = value
          while len(self._data) > self.capacity:
              self._data.popitem(last=False)

      def __len__(self):
          return len(self._data)
  CACHE
  cat > sensors/window.py <<'WINDOW'
  from sensors.cache import LRU


  class Window:
      def __init__(self, capacity):
          self.cache = LRU(capacity)

      def add(self, ts, value):
          self.cache.put(ts, value)

      def last(self, ts):
          return self.cache.get(ts)

      def size(self):
          return len(self.cache)
  WINDOW

