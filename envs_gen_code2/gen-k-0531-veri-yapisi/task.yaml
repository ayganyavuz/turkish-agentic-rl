  sensors/cache.py içindeki LRU sınıfını ve sensors/window.py içindeki Window sınıfını tamamla; Window.last(ts) penceredeki en yeni okumayı ts ile sorgulayıp önbellekten döndürsün, kapasite aşılınca en eski kullanılan anahtar düşürülsün ve aynı ts tekrar eklenince değeri güncellensin.

