prompt: |
  route_net.py içindeki RouteStack sınıfını tamamla; push, pop, peek ve depth çalışsın, resolve(target) yığın üzerinden hedefe giden düğüm zincirini yol listesi olarak döndürsün.

setup: |
  cat > route_net.py <<'PY'
  class RouteStack:
      def __init__(self):
          raise NotImplementedError

      def push(self, node):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def depth(self):
          raise NotImplementedError

      def resolve(self, target):
          raise NotImplementedError
  PY
  cat > net.txt <<'TXT'
  A B
  B C
  B D
  C E
  D E
  E F
  TXT

goal_tr: >
  route_net.py icindeki RouteStack sinifini; push/pop/peek/depth calissin ve
  resolve(target) hedefe giden dugum zincirini yigin uzerinden bulup yol
  listesi dondursun diye tamamla.

reference_solution: |
  cat > route_net.py <<'PY'
  class RouteStack:
      def __init__(self):
          self._items = []

      def push(self, node):
          self._items.append(node)

      def pop(self):
          if not self._items:
              raise IndexError("empty stack")
          return self._items.pop()

      def peek(self):
          if not self._items:
              raise IndexError("empty stack")
          return self._items[-1]

      def depth(self):
          return len(self._items)

      def resolve(self, target):
          return self._items[:self._items.index(target) + 1]
  PY

