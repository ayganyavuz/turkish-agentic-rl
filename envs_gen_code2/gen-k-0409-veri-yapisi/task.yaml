prompt: |
  agenda/queue.py dosyasındaki EventQueue sınıfını bir öncelik kuyruğu olarak gerçekleştir. Kuyruk, olayları eklenme sırasından bağımsız olarak en küçük gün değerine göre çıkarmalı; iki olayın gün değeri eşitse, önce eklenen önce çıkmalı. Sınıfın push, pop, peek, size ve is_empty metodları çalışsın. push bir olayı adı ve günüyle eklesin, pop en küçük günlü olayı kuyruktan çıkarıp döndürsün, peek çıkarmadan o olayı döndürsün, size kuyruktaki olay sayısını versin, is_empty kuyruk boşken doğru değeri döndürsün.

setup: |
  mkdir -p agenda
  cat > agenda/events.py <<'EVENTS'
  def parse_events(text):
      rows = []
      for line in text.strip().splitlines():
          name, day = line.split(',')
          rows.append((name, int(day)))
      return rows
  EVENTS
  cat > agenda/queue.py <<'QUEUE'
  class EventQueue:
      def __init__(self):
          raise NotImplementedError

      def push(self, name, day):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def peek(self):
          raise NotImplementedError

      def size(self):
          raise NotImplementedError

      def is_empty(self):
          raise NotImplementedError
  QUEUE
  cat > agenda/schedule.py <<'SCHEDULE'
  from agenda.queue import EventQueue


  def schedule(text):
      events = []
      for name, day in text:
          events.append((day, name))
      events.sort()
      q = EventQueue()
      for day, name in events:
          q.push(name, day)
      out = []
      while not q.is_empty():
          out.append(q.pop())
      return out
  SCHEDULE

goal_tr: >
  agenda/queue.py icindeki EventQueue sinifini, olaylari eklenme sirasindan
  bagimsiz olarak en kucuk gun degerine gore (esitlikte once eklenen once
  cikacak bicimde) cikaran bir oncelik kuyrugu olarak gerceklestir; push,
  pop, peek, size ve is_empty metodlari calissin.

reference_solution: |
  cat > agenda/queue.py <<'QUEUE'
  import heapq


  class EventQueue:
      def __init__(self):
          self._heap = []
          self._counter = 0

      def push(self, name, day):
          heapq.heappush(self._heap, (day, self._counter, name))
          self._counter += 1

      def pop(self):
          if not self._heap:
              raise IndexError("pop from empty queue")
          day, _, name = heapq.heappop(self._heap)
          return (name, day)

      def peek(self):
          if not self._heap:
              raise IndexError("peek from empty queue")
          day, _, name = self._heap[0]
          return (name, day)

      def size(self):
          return len(self._heap)

      def is_empty(self):
          return len(self._heap) == 0
  QUEUE

