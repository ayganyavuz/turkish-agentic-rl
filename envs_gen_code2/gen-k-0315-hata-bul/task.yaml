# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  school/transcript.py içindeki honor_list fonksiyonunu, ortalaması sınır değerine eşit olan öğrencileri de listeye alacak şekilde düzelt.

setup: |
  mkdir -p school
  cat > school/courses.py <<'COURSES'
  def credit_of(course):
      table = {"MATH101": 4, "PHY101": 3, "CS101": 5}
      return table[course]
  COURSES
  cat > school/transcript.py <<'TRANSCRIPT'
  from school.courses import credit_of


  def weighted_gpa(rows):
      total_points = 0.0
      total_credits = 0
      for course, grade, count in rows:
          c = credit_of(course) * count
          total_points += c * grade
          total_credits += c
      return round(total_points / total_credits, 2)


  def honor_list(rows, limit):
      names = []
      for name, grades in rows:
          gpa = weighted_gpa(grades)
          if gpa > limit:
              names.append(name)
      return names
  TRANSCRIPT
  cat > roster.txt <<'ROSTER'
  ada MATH101 3.5 1
  ada CS101 4.0 1
  bora PHY101 2.0 1
  COSTA

goal_tr: >
  school/transcript.py icindeki honor_list fonksiyonunu, ortalamasi sinir
  degerine esit olan ogrencileri de onur listesine katacak bicimde duzelt.

reference_solution: |
  cat > school/transcript.py <<'TRANSCRIPT'
  from school.courses import credit_of


  def weighted_gpa(rows):
      total_points = 0.0
      total_credits = 0
      for course, grade, count in rows:
          c = credit_of(course) * count
          total_points += c * grade
          total_credits += c
      return round(total_points / total_credits, 2)


  def honor_list(rows, limit):
      names = []
      for name, grades in rows:
          gpa = weighted_gpa(grades)
          if gpa >= limit:
              names.append(name)
      return names
  TRANSCRIPT

