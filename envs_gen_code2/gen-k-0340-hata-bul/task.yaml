split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depot/stock.py dosyasındaki restock_plan, below_threshold ve coverage fonksiyonlarını düzelt. Stok miktarı eşik değerine tam eşit olan ürünler artık eşiğin altında sayılmasın; yani eksik kabul edilenler yalnızca stoğu eşik değerinden küçük olan ürünler olsun.

setup: |
  mkdir -p depot
  cat > depot/items.py <<'ITEMS'
  def parse_items(text):
      rows = []
      for line in text.strip().splitlines():
          sku, qty = line.split(',')
          rows.append((sku.strip(), int(qty)))
      return rows


  def total_units(rows):
      return sum(q for _, q in rows)
  ITEMS
  cat > depot/stock.py <<'STOCK'
  from depot.items import parse_items, total_units


  def restock_plan(text, threshold):
      rows = parse_items(text)
      out = []
      for sku, qty in rows:
          if qty < threshold:
              out.append((sku, threshold - qty))
      return out


  def below_threshold(text, threshold):
      rows = parse_items(text)
      out = []
      for sku, qty in rows:
          if qty <= threshold:
              out.append(sku)
      return out


  def coverage(text, threshold):
      rows = parse_items(text)
      need = sum(d for _, d in restock_plan(text, threshold))
      have = total_units(rows)
      return have - need
  STOCK
  cat > inventory.txt <<'INV'
  bolt,10
  nut,0
  washer,3
  screw,7
  INV

goal_tr: >
  depot/stock.py icindeki restock_plan, below_threshold ve coverage
  fonksiyonlarini, esik degerine tam esit stogu olan urunler esigin altinda
  sayilmayacak (yani yalnizca stogu esikten kucuk olanlar eksik sayilacak)
  bicimde duzelt.

reference_solution: |
  cat > depot/stock.py <<'STOCK'
  from depot.items import parse_items, total_units


  def restock_plan(text, threshold):
      rows = parse_items(text)
      out = []
      for sku, qty in rows:
          if qty < threshold:
              out.append((sku, threshold - qty))
      return out


  def below_threshold(text, threshold):
      rows = parse_items(text)
      out = []
      for sku, qty in rows:
          if qty < threshold:
              out.append(sku)
      return out


  def coverage(text, threshold):
      rows = parse_items(text)
      need = sum(d for _, d in restock_plan(text, threshold))
      have = total_units(rows)
      return have - need
  STOCK

