id: gen-k-0002-veri-yapisi
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) `route_network/union_find.py` dosyasındaki `UnionFind` sınıfının `find` ve `union` metodlarını tamamla.
  2) `find` metodu, bir düğümün kökünü (root) bulacak şekilde gerçekleştir.
  3) `union` metodu, iki düğümü birleştirecek şekilde gerçekleştir.
  4) Bu metodların, `route_network/route_planner.py` dosyasındaki `can_connect` fonksiyonunun şehirlerin birbirine bağlı olup olmadığını doğru şekilde denetlemesini sağlayacak biçimde çalışmasını sağla.

setup: |
  mkdir -p route_network
  cat > route_network/union_find.py <<'EOF'
  class UnionFind:
      def __init__(self, n):
          self.parent = list(range(n))
          self.rank = [0] * n

      def find(self, x):
          raise NotImplementedError

      def union(self, x, y):
          raise NotImplementedError
  EOF
  cat > route_network/route_planner.py <<'EOF'
  from route_network.union_find import UnionFind


  def can_connect(city_count, routes):
      uf = UnionFind(city_count)
      for a, b in routes:
          uf.union(a, b)
      root = uf.find(0)
      for city in range(1, city_count):
          if uf.find(city) != root:
              return False
      return True
  EOF

goal_tr: >
  route_network/union_find.py icindeki UnionFind sinifini, yol tarifi aginda
  tum sehirlerin birbirine bagli olup olmadigini dogru denetleyecek sekilde
  gerceklestir (find ve union metodlarini tamamla)

reference_solution: |
  cat > route_network/union_find.py <<'EOF'
  class UnionFind:
      def __init__(self, n):
          self.parent = list(range(n))
          self.rank = [0] * n

      def find(self, x):
          if self.parent[x] != x:
              self.parent[x] = self.find(self.parent[x])
          return self.parent[x]

      def union(self, x, y):
          rx, ry = self.find(x), self.find(y)
          if rx == ry:
              return False
          if self.rank[rx] < self.rank[ry]:
              self.parent[rx] = ry
          elif self.rank[rx] > self.rank[ry]:
              self.parent[ry] = rx
          else:
              self.parent[ry] = rx
              self.rank[rx] += 1
          return True
  EOF

outputs:
