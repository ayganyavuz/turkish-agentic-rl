goal_tr: >
  planner/intervals.py, planner/agenda.py ve planner/summary.py icindeki
  NotImplementedError govdelerini, yarim-acik [start, end) dakika
  araliklarini birlestirip gun icindeki mesgul bloklari ve bosluklari dogru
  hesaplayacak sekilde gerceklestir; normalize araliklari artan baslangica
  gore sirala ve negatif/ters araliklari (start >= end) at, merge kesisen
  veya deginen araliklari tek blokta birlestirsin, busy_blocks normalize
  edilmis bloklari dondursun, free_gaps gun sinirlari icinde mesgul olmayan
  araliklari dondursun, describe ise "busy=<n> free=<n>" biciminde ozet
  uretsin.

reference_solution: |
  cat > planner/intervals.py <<'PY'
  def normalize(intervals):
      cleaned = [(int(s), int(e)) for s, e in intervals if int(s) < int(e)]
      cleaned.sort(key=lambda pair: (pair[0], pair[1]))
      return cleaned


  def merge(intervals):
      merged = []
      for start, end in normalize(intervals):
          if merged and start <= merged[-1][1]:
              prev_start, prev_end = merged[-1]
              merged[-1] = (prev_start, max(prev_end, end))
          else:
              merged.append((start, end))
      return merged
  PY
  cat > planner/agenda.py <<'PY'
  from planner.intervals import normalize, merge


  def busy_blocks(intervals):
      return merge(intervals)


  def free_gaps(intervals, day_start, day_end):
      gaps = []
      cursor = int(day_start)
      for start, end in merge(intervals):
          if start > cursor:
              gaps.append((cursor, start))
          cursor = max(cursor, end)
      if cursor < int(day_end):
          gaps.append((cursor, int(day_end)))
      return gaps
  PY
  cat > planner/summary.py <<'PY'
  from planner.agenda import busy_blocks, free_gaps


  def describe(intervals, day_start, day_end):
      return "busy=%d free=%d" % (
          len(busy_blocks(intervals)),
          len(free_gaps(intervals, day_start, day_end)),
      )
  PY

