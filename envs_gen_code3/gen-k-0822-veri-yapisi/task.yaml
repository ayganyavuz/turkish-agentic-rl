# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  planner/intervals.py, planner/agenda.py ve planner/summary.py dosyalarındaki NotImplementedError gövdelerini gerçek işlevlerle doldur. planner/intervals.py içindeki normalize ve merge fonksiyonları yarım-açık [start, end) dakika aralıklarıyla çalışsın; normalize aralıkları artan başlangıca göre sıralı döndürsün ve negatif ya da ters aralıkları (start >= end) atsın; merge ise kesişen veya değen aralıkları tek blokta birleştirsin. planner/agenda.py içinde busy_blocks normalize edilmiş meşgul blokları döndürsün, free_gaps ise gün sınırları içinde meşgul olmayan aralıkları döndürsün. planner/summary.py içindeki describe, verilen aralıklar ve gün sınırları için "busy=<n> free=<n>" biçiminde özet üretsin. planner/summary.py dosyasını oluştur ve planner/intervals.py dosyasını güncelle.

  Şu şartlar sağlanmalı:
  - planner/intervals.py içinde normalize ve merge fonksiyonları NotImplementedError yerine gerçek uygulamaya sahip olmalı.
  - planner/agenda.py içinde busy_blocks ve free_gaps fonksiyonları gerçek uygulamaya sahip olmalı.
  - planner/summary.py içinde describe fonksiyonu gerçek uygulamaya sahip olmalı ve çıktısı tam olarak "busy=<n> free=<n>" biçiminde olmalı.
  - normalize, negatif veya ters aralıkları (start >= end) atmalı ve kalan aralıkları artan başlangıca göre sıralı döndürmeli.
  - merge, kesişen veya değen aralıkları tek blokta birleştirmeli.
  - busy_blocks, normalize edilmiş meşgul blokları döndürmeli.
  - free_gaps, gün sınırları içinde meşgul olmayan aralıkları döndürmeli.
  - Aralıklar yarım-açık [start, end) biçiminde ele alınmalı.

