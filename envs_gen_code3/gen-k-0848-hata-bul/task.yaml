# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  bank/report.py dosyasındaki account_summary fonksiyonunu düzelt; her hesabın bakiyesi, o hesaba ait tüm tutarların toplamı olacak şekilde çalışsın. Böylece data.csv üzerinde alice için 125, bob için 50 değerleri elde edilsin. Aynı düzeltmeyle bank/report.py içindeki total_deposits fonksiyonu da 175 döndürsün.

setup: |
  mkdir -p bank
  cat > bank/ledger.py <<'LEDGER'
  def parse_transactions(text):
      rows = []
      for line in text.strip().splitlines():
          parts = line.split(',')
          rows.append((parts[0], int(parts[1])))
      return rows


  def running_balance(text):
      rows = parse_transactions(text)
      total = 0
      out = []
      for acct, amount in rows:
          total = total + amount
          out.append((acct, total))
      return out


  def account_totals(text):
      rows = parse_transactions(text)
      totals = {}
      for acct, amount in rows:
          totals[acct] = totals.get(acct, 0) + amount
      return totals
  LEDGER
  cat > bank/report.py <<'REPORT'
  from bank.ledger import running_balance


  def account_summary(text):
      balances = running_balance(text)
      result = {}
      for acct, bal in balances:
          result[acct] = bal
      return result


  def total_deposits(text):
      balances = running_balance(text)
      return sum(bal for _, bal in balances)
  REPORT
  cat > data.csv <<'CSV'
  alice,100
  bob,50
  alice,25
  CSV

goal_tr: >
  bank/report.py icindeki account_summary fonksiyonunu, her hesabin bakiye
  toplamini (o hesaba ait tum tutarlarin toplamini) dogru dondurecek bicimde
  duzelt; boylece alice icin 125 ve bob icin 50 degerleri elde edilsin, ve
  total_deposits de 175 dondursun.

reference_solution: |
  cat > bank/report.py <<'REPORT'
  from bank.ledger import account_totals


  def account_summary(text):
      return account_totals(text)


  def total_deposits(text):
      totals = account_totals(text)
      return sum(totals.values())
  REPORT

ara_adim: |
  cat > bank/report.py <<'REPORT'
