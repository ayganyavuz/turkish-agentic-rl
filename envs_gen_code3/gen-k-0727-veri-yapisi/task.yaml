# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  bank/ledger.py içindeki Ledger sınıfında settle ve pending metodlarını gerçekleştir. settle işlemleri (fee, varış) öncelik sırasına göre uygulayıp her işlemden sonraki bakiyeyi (txn_id, balance) listesi olarak döndürsün, pending ise kuyrukta bekleyen işlem sayısını versin.

setup: |
  mkdir -p bank
  cat > bank/events.py <<'EVENTS'
  import heapq


  class EventQueue:
      """Min-heap keyed by (priority, seq). Lower priority value pops first."""

      def __init__(self):
          self._heap = []
          self._seq = 0

      def push(self, priority, payload):
          heapq.heappush(self._heap, (priority, self._seq, payload))
          self._seq += 1

      def pop(self):
          priority, seq, payload = heapq.heappop(self._heap)
          return priority, payload

      def __len__(self):
          return len(self._heap)
  EVENTS
  cat > bank/ledger.py <<'LEDGER'
  from bank.events import EventQueue


  class Ledger:
      """Applies transactions in ascending (fee, arrival) priority order.

      A transaction is (txn_id, amount, fee). Transactions with the same fee
      are applied in arrival order. Returns the running balance after each
      applied transaction as a list of (txn_id, balance).
      """

      def __init__(self):
          self._queue = EventQueue()
          self._next_arrival = 0

      def submit(self, txn_id, amount, fee):
          self._queue.push(fee, (self._next_arrival, txn_id, amount))
          self._next_arrival += 1

      def settle(self):
          raise NotImplementedError

      def pending(self):
          raise NotImplementedError
  LEDGER
  cat > bank/statement.py <<'STATEMENT'
  from bank.ledger import Ledger


  def build_statement(transactions):
      """transactions: list of (txn_id, amount, fee) in arrival order.

      Returns list of (txn_id, balance) after settling all transactions.
      """
      ledger = Ledger()
      for txn_id, amount, fee in transactions:
          ledger.submit(txn_id, amount, fee)
      return ledger.settle()
  STATEMENT
  cat > bank/__init__.py <<'INIT'
  INIT

