# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) cal/query.py dosyasındaki reachable ve chain fonksiyonlarını, takvim etkinlikleri arasındaki bağlantılar çift yönlü sayılacak şekilde düzelt.

  2) reachable fonksiyonu, çağrıldığı düğümün kendisini de erişilebilir etkinlikler arasında kapsayacak hale gelsin.

  3) chain fonksiyonu, hedef etkinliğe hiçbir yol yoksa None döndürecek şekilde çalışsın.

  4) Düzeltmeler cal/store.py içindeki Calendar yapısındaki bağlantılarla uyumlu olsun; cal/query.py dışında yeni bir dosya oluşturma.

setup: |
  mkdir -p cal
  cat > cal/model.py <<'MODEL'
  class Event:
      def __init__(self, name, start, end):
          self.name = name
          self.start = start
          self.end = end
  MODEL
  cat > cal/store.py <<'STORE'
  from cal.model import Event


  class Calendar:
      def __init__(self):
          self.events = []
          self.adj = {}

      def add(self, name, start, end):
          self.events.append(Event(name, start, end))
          self.adj.setdefault(name, [])
          return name

      def link(self, a, b):
          self.adj.setdefault(a, [])
          self.adj.setdefault(b, [])
          self.adj[a].append(b)
  STORE
  cat > cal/query.py <<'QUERY'
  from cal.store import Calendar


  def reachable(cal, start):
      raise NotImplementedError


  def chain(cal, start, target):
      raise NotImplementedError
  QUERY

goal_tr: >
  Takvim etkinlikleri arasindaki baglantilar uzerinde gezinme bozuk
  calisiyor: bir etkinlikten yalnizca ileri yonde erisilebilenler bulunuyor,
  geri yonde bagli etkinlikler kayboluyor ve iki etkinlik arasindaki yol
  bazen hic bulunamiyor; cal/query.py icindeki reachable ve chain
  fonksiyonlarini, baglantilar cift yonlu sayilacak, reachable cagrildigi
  dugumun kendisini de kapsayacak ve erisilemeyen hedef icin chain None
  donecek bicimde duzelt.

reference_solution: |
  cat > cal/store.py <<'STORE'
  from cal.model import Event


  class Calendar:
      def __init__(self):
          self.events = []
          self.adj = {}

      def add(self, name, start, end):
          self.events.append(Event(name, start, end))
          self.adj.setdefault(name, [])
          return name

      def link(self, a, b):
          self.adj.setdefault(a, [])
          self.adj.setdefault(b, [])
          self.adj[a].append(b)
          self.adj[b].append(a)
  STORE
  cat > cal/query.py <<'QUERY'
  from cal.store import Calendar


  def reachable(cal, start):
      seen = set()
      stack = [start]
      while stack:
          node = stack.pop()
          if node in seen:
              continue
          seen.add(node)
          for nxt in cal.adj.get(node, []):
              if nxt not in seen:
                  stack.append(nxt)
      return sorted(seen)


  def chain(cal, start, target):
      if start == target:
          return [start]
      prev = {start: None}
      queue = [start]
      idx = 0
      while idx < len(queue):
          node = queue[idx]
          idx += 1
          for nxt in cal.adj.get(node, []):
              if nxt in prev:
                  continue
              prev[nxt] = node
              if nxt == target:
                  path = [nxt]
                  cur = node
                  while cur is not None:
                      path.append(cur)
                      cur = prev[cur]
                  path.reverse()
                  return path
              queue.append(nxt)
      return None
  QUERY

