# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  sessions/merge.py dosyasındaki merge_intervals ve total_span fonksiyonlarını gerçekleştir. merge_intervals aralıkları birleştirmeli, total_span ise birleştirilmiş aralıkların toplam kapsanan süresini doğru biçimde hesaplamalı; böylece sessions/report.py içindeki active_users her kullanıcı için doğru sonucu döndürsün. Çalışma dizini /workspace; sessions/records.py ve sessions/report.py olduğu gibi kalmalı, sadece sessions/merge.py üzerinde çalış.

setup: |
  mkdir -p sessions
  cat > sessions/records.py <<'RECORDS'
  def parse_sessions(text):
      rows = []
      for line in text.strip().splitlines():
          user, start, end = line.split(';')
          rows.append((user, int(start), int(end)))
      return rows
  RECORDS
  cat > sessions/merge.py <<'MERGE'
  def merge_intervals(intervals):
      raise NotImplementedError


  def total_span(intervals):
      raise NotImplementedError
  MERGE
  cat > sessions/report.py <<'REPORT'
  from sessions.records import parse_sessions
  from sessions.merge import merge_intervals, total_span


  def active_users(text):
      rows = parse_sessions(text)
      by_user = {}
      for user, start, end in rows:
          by_user.setdefault(user, []).append((start, end))
      result = {}
      for user, spans in by_user.items():
          merged = merge_intervals(spans)
          result[user] = total_span(merged)
      return result
  REPORT
  cat > log.txt <<'LOG'
  ann;0;10
  bob;5;20
  ann;8;15
  bob;30;40
  ann;25;30
  LOG

goal_tr: >
  sessions/merge.py icindeki merge_intervals ve total_span fonksiyonlarini,
  aralik birlestirme yapip toplam kapsanan sureyi dogru hesaplayacak bicimde
  gerceklestir; boylece sessions/report.py icindeki active_users dogru sonuc
  dondursun.

reference_solution: |
  cat > sessions/merge.py <<'MERGE'
  def merge_intervals(intervals):
      if not intervals:
          return []
      ordered = sorted(intervals, key=lambda p: (p[0], p[1]))
      merged = [list(ordered[0])]
      for start, end in ordered[1:]:
          last = merged[-1]
          if start <= last[1]:
              if end > last[1]:
                  last[1] = end
          else:
              merged.append([start, end])
      return [tuple(p) for p in merged]


  def total_span(intervals):
      return sum(end - start for start, end in intervals)
  MERGE

