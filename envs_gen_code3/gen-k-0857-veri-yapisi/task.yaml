          raise NotImplementedError

      def find(self, sku):
          raise NotImplementedError

      def to_list(self):
          raise NotImplementedError

      def total(self):
          raise NotImplementedError
  CATALOG
  cat > pricing/discounts.py <<'DISCOUNTS'
