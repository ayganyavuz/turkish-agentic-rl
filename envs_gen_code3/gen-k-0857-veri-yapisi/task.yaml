# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Dükkânda stok ve fiyat takibi için yazdığımız küçük bir araç var; müşterilere indirimli fiyat gösterirken bazen aynı ürünün birden fazla kaydı karışıyor ve toplamlar tutmuyor. Bugün de o yüzden bütün öğleden sonrayı eski kayıtları karşılaştırarak geçirdim, artık elle kontrol etmekten yoruldum. Bu yüzden fiyat listesinin ve raporun kendiliğinden düzgün çalışması lazım.

  pricing/catalog.py içindeki PriceList bağlı-liste sınıfını, fiyat listesini sku'ya göre sıralı tutacak şekilde tamamla; insert, remove, find, to_list ve total metotları düzgün çalışsın. pricing/discounts.py içindeki fonksiyonlar da bu yapıyla uyumlu olsun. pricing/report.py içindeki fonksiyonlar ise bu liste üzerinden raporu doğru üretsin.

