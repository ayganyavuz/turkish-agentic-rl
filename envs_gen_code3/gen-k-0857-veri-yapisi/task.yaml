  def discounted_total(price_list, percent):
      raise NotImplementedError


  def cheapest(price_list):
      raise NotImplementedError
  DISCOUNTS
  cat > pricing/report.py <<'REPORT'
  from pricing.discounts import discounted_total, cheapest


  def summary(price_list, percent):
      raise NotImplementedError
  REPORT

goal_tr: >
  pricing/catalog.py icindeki PriceList bagli-liste sinifini (insert,
  remove, find, to_list, total) ve pricing/discounts.py ile
  pricing/report.py icindeki fonksiyonlari, fiyat listesini sku'ya gore
  sirali tutacak ve raporu dogru uretecek bicimde gerceklestir.

reference_solution: |
  cat > pricing/catalog.py <<'CATALOG'
  class Node:
      def __init__(self, sku, price):
          self.sku = sku
          self.price = price
          self.next = None


  class PriceList:
      """Singly linked list of (sku, price) nodes kept sorted by sku."""

      def __init__(self):
          self.head = None

      def insert(self, sku, price):
          new_node = Node(sku, price)
          if self.head is None or self.head.sku > sku:
              new_node.next = self.head
              self.head = new_node
              return
          prev = self.head
          while prev.next is not None and prev.next.sku < sku:
              prev = prev.next
          if prev.next is not None and prev.next.sku == sku:
              prev.next.price = price
              return
          new_node.next = prev.next
          prev.next = new_node

      def remove(self, sku):
          prev = None
          cur = self.head
          while cur is not None:
              if cur.sku == sku:
                  if prev is None:
                      self.head = cur.next
                  else:
                      prev.next = cur.next
                  return True
              prev = cur
              cur = cur.next
          return False

      def find(self, sku):
          cur = self.head
          while cur is not None:
              if cur.sku == sku:
                  return cur.price
              cur = cur.next
          return None

      def to_list(self):
          out = []
          cur = self.head
          while cur is not None:
              out.append((cur.sku, cur.price))
              cur = cur.next
          return out

      def total(self):
          acc = 0.0
          cur = self.head
          while cur is not None:
              acc += cur.price
              cur = cur.next
          return acc
  CATALOG
  cat > pricing/discounts.py <<'DISCOUNTS'
  from pricing.catalog import PriceList


  def discounted_total(price_list, percent):
      base = price_list.total()
      return round(base * (100 - percent) / 100, 2)


  def cheapest(price_list):
      cur = price_list.head
      if cur is None:
          return None
      best = cur
      while cur is not None:
          if cur.price < best.price:
              best = cur
          cur = cur.next
      return best.sku
  DISCOUNTS
  cat > pricing/report.py <<'REPORT'
  from pricing.discounts import discounted_total, cheapest


  def summary(price_list, percent):
      return {
          "count": len(price_list.to_list()),
          "total": round(price_list.total(), 2),
          "discounted": discounted_total(price_list, percent),
          "cheapest": cheapest(price_list),
      }
  REPORT

