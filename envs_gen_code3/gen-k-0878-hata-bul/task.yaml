  - {path: depo/stock.py, kind: program, run: 'python3 -c ''from depo.stock import total_value as f; assert f("a,2,3.0")==6.0, f("a,2,3.0"); assert f("a,1,0.1\nb,1,0.2")==0.3, f("a,1,0.1\nb,1,0.2"); print("REGRESYON-TAMAM")'''}

