# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  depo/rapor.py içindeki total_units fonksiyonu tüm satırlardaki miktarların toplamını doğru döndürsün, low_stock ise eşik değerine eşit miktarları da listeye katsın. Sadece bu iki fonksiyonu düzelt.

setup: |
  mkdir -p depo
  cat > depo/kayit.py <<'KAYIT'
  def parse_items(text):
      rows = []
      for line in text.strip().splitlines():
          sku, qty = line.split(':')
          rows.append((sku.strip(), int(qty)))
      return rows
  KAYIT
  cat > depo/rapor.py <<'RAPOR'
  from depo.kayit import parse_items


  def total_units(text):
      rows = parse_items(text)
      total = 0
      for sku, qty in rows:
          total += qty
          return total
      return total


  def low_stock(text, threshold):
      rows = parse_items(text)
      result = []
      for sku, qty in rows:
          if qty < threshold:
              result.append(sku)
      return result
  RAPOR
  cat > envanter.txt <<'ENV'
  A1:5
  B2:20
  C3:3
  ENV

goal_tr: >
  depo/rapor.py icindeki total_units fonksiyonunu tum satirlardaki
  miktarlarin toplamini dogru dondurecek, low_stock fonksiyonunu ise esik
  degerine esit miktarlari da dahil edecek bicimde duzelt.

reference_solution: |
  cat > depo/rapor.py <<'RAPOR'
  from depo.kayit import parse_items


  def total_units(text):
      rows = parse_items(text)
      total = 0
      for sku, qty in rows:
          total += qty
      return total


  def low_stock(text, threshold):
      rows = parse_items(text)
      result = []
      for sku, qty in rows:
          if qty <= threshold:
              result.append(sku)
      return result
  RAPOR

