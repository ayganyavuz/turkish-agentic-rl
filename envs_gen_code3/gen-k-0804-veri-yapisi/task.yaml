goal_tr: >
  bank/queuecore.py icindeki MinHeap sinifini (push, pop, peek, __len__) ve
  bank/ledger.py icindeki Ledger sinifini (deposit, withdraw,
  next_transaction, pending_count) tam olarak gerceklestir; islemler oncelik
  kuyrugunda kucuk oncelik degeri once cikacak sekilde tutulsun ve ayni
  oncelikte ekleme sirasi (FIFO) korunsun.

reference_solution: |
  cat > bank/queuecore.py <<'QUEUECORE'
  class MinHeap:
      def __init__(self):
          self._items = []
          self._counter = 0

      def push(self, priority, value):
          entry = (priority, self._counter, value)
          self._counter += 1
          self._items.append(entry)
          i = len(self._items) - 1
          while i > 0:
              parent = (i - 1) // 2
              if self._items[parent] <= self._items[i]:
                  break
              self._items[parent], self._items[i] = self._items[i], self._items[parent]
              i = parent

      def pop(self):
          if not self._items:
              raise IndexError("pop from empty heap")
          top = self._items[0]
          last = self._items.pop()
          if self._items:
              self._items[0] = last
              i = 0
              n = len(self._items)
              while True:
                  left = 2 * i + 1
                  right = 2 * i + 2
                  smallest = i
                  if left < n and self._items[left] < self._items[smallest]:
                      smallest = left
                  if right < n and self._items[right] < self._items[smallest]:
                      smallest = right
                  if smallest == i:
                      break
                  self._items[i], self._items[smallest] = self._items[smallest], self._items[i]
                  i = smallest
          return top[2]

      def peek(self):
          if not self._items:
              raise IndexError("peek from empty heap")
          return self._items[0][2]

      def __len__(self):
          return len(self._items)
  QUEUECORE
  cat > bank/ledger.py <<'LEDGER'
  from bank.queuecore import MinHeap


  class Ledger:
      def __init__(self):
          self._heap = MinHeap()

      def deposit(self, tx_id, amount):
          self._heap.push(amount, tx_id)

      def withdraw(self, tx_id, amount):
          self._heap.push(amount, tx_id)

      def next_transaction(self):
          return self._heap.pop()

      def pending_count(self):
          return len(self._heap)
  LEDGER

