      def load(self, text):
          for sku, qty, loc in parse_lines(text):
              self._items[sku] = (qty, loc)

      def quantity(self, sku):
          raise NotImplementedError

      def location(self, sku):
          raise NotImplementedError

      def skus(self):
          raise NotImplementedError
  INVENTORY
  cat > depo/merge.py <<'MERGE'
  from depo.inventory import Inventory


  class Merger:
      def __init__(self):
          self._inv = Inventory()

      def load(self, text):
          self._inv.load(text)

      def merge(self, other):
          raise NotImplementedError

      def groups(self):
          raise NotImplementedError
  MERGE
  cat > depo/report.py <<'REPORT'
  from depo.merge import Merger


  def summarize(text):
      m = Merger()
      m.load(text)
      m.merge(Merger())
      return m.groups()
  REPORT

goal_tr: >
  depo/inventory.py ve depo/merge.py icindeki NotImplementedError
  govdelerini, depo/report.py'deki summarize fonksiyonu depo envanterini sku
  bazinda gruplayip her grubu "kok:toplam" biciminde dondurecek sekilde
  gerceklestir; birlestirme islemi ayni konumdaki skulari tek gruba toplayan
  bir birlesim-bulma (union-find) yapisiyla yapilmali.

reference_solution: |
  cat > depo/inventory.py <<'INVENTORY'
  from depo.records import parse_lines


  class Inventory:
      def __init__(self):
          self._items = {}

      def load(self, text):
          for sku, qty, loc in parse_lines(text):
              self._items[sku] = (qty, loc)

      def quantity(self, sku):
          return self._items[sku][0]

      def location(self, sku):
          return self._items[sku][1]

      def skus(self):
          return sorted(self._items)
  INVENTORY
  cat > depo/merge.py <<'MERGE'
  from depo.inventory import Inventory


  class Merger:
      def __init__(self):
          self._inv = Inventory()
          self._parent = {}

      def load(self, text):
          self._inv.load(text)

      def _find(self, x):
          root = x
          while self._parent[root] != root:
              root = self._parent[root]
          while self._parent[x] != root:
              self._parent[x], x = root, self._parent[x]
          return root

      def _union(self, a, b):
          ra, rb = self._find(a), self._find(b)
          if ra != rb:
              self._parent[rb] = ra

      def _ensure(self, sku):
          self._parent.setdefault(sku, sku)

      def merge(self, other):
          for sku in other._inv.skus():
              self._ensure(sku)
          for sku in self._inv.skus():
              self._ensure(sku)
          by_loc = {}
          for sku in self._inv.skus():
              by_loc.setdefault(self._inv.location(sku), []).append(sku)
          for sku in other._inv.skus():
              by_loc.setdefault(other._inv.location(sku), []).append(sku)
          for loc in sorted(by_loc):
              members = by_loc[loc]
              for sku in members[1:]:
                  self._union(members[0], sku)

      def groups(self):
          buckets = {}
          for sku in self._inv.skus():
              buckets.setdefault(self._find(sku), []).append(sku)
          out = []
          for root in sorted(buckets):
              total = sum(self._inv.quantity(s) for s in buckets[root])
              out.append("%s:%d" % (root, total))
          return out
  MERGE

