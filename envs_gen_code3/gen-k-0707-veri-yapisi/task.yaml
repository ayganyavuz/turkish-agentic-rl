  depo/inventory.py ve depo/merge.py içindeki NotImplementedError gövdelerini doldur; depo/report.py'deki summarize, envanteri sku bazında gruplayıp her grubu "kök:toplam" biçiminde döndürsün. Birleştirme aynı konumdaki skuları tek gruba toplayan union-find ile yapılsın.

