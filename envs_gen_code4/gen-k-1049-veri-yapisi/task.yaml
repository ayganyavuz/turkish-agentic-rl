prompt: |
  kargo/stack.py dosyasındaki ParcelStack sınıfını ve load_stack fonksiyonunu tamamla. load_stack, manifest.csv dosyasındaki kolileri parse_manifest ile okuyup sırayla yığına itmeli ve dolu bir ParcelStack döndürmeli. ParcelStack push, pop, peek, __len__, __iter__ ve __contains__ metotlarında doğru sonucu vermeli; __add__ ise iki yığını birleştirip yeni bir ParcelStack döndürmeli.

setup: |
  mkdir -p kargo
  cat > kargo/parcels.py <<'PARCELS'
  def parse_manifest(path):
      """Her satir: takip_no,sehir,agirlik"""
      rows = []
      with open(path, encoding="utf-8") as fh:
          for line in fh:
              line = line.strip()
              if not line:
                  continue
              tid, city, weight = line.split(",")
              rows.append((tid, city, float(weight)))
      return rows
  PARCELS
  cat > kargo/stack.py <<'STACK'
