      raise NotImplementedError
  STACK
  cat > manifest.csv <<'CSV'
  TR01,ankara,2.5
  TR02,izmir,1.0
  TR03,bursa,4.25
  TR04,ankara,0.75
  CSV

goal_tr: >
  kargo/stack.py icindeki ParcelStack sinifini ve load_stack fonksiyonunu,
  manifest.csv dosyasindaki kolileri sirayla yigina itecek,
  pop/peek/len/iter/contains ile dogru sonucu verecek ve iki yigini
  birlestiren __add__ operatorunu destekleyecek bicimde tamamla.

reference_solution: |
  cat > kargo/stack.py <<'STACK'
  from kargo.parcels import parse_manifest


  class ParcelStack:
      """Kargo kolileri icin son-giren-ilk-cikan yigin."""

      def __init__(self):
          self._items = []

      def push(self, item):
          self._items.append(item)

      def pop(self):
          if not self._items:
              raise IndexError("bos yigin")
          return self._items.pop()

      def peek(self):
          if not self._items:
              raise IndexError("bos yigin")
          return self._items[-1]

      def __len__(self):
          return len(self._items)

      def __add__(self, other):
          merged = ParcelStack()
          merged._items = list(self._items) + list(other._items)
          return merged

      def __iter__(self):
          return iter(reversed(self._items))

      def __contains__(self, item):
          return item in self._items


  def load_stack(path):
      stack = ParcelStack()
      for row in parse_manifest(path):
          stack.push(row)
      return stack
  STACK

