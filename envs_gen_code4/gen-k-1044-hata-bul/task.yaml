# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  maintenance/schedule.py dosyasındaki build_checker fabrikasında bir hata var: makine kullanım saatleri tür ayrımı yapılmadan tek bir toplamda biriktiriliyor ve is_due(machine, kind) çağrısı hangi tür sorgulanırsa sorgulansın bu tek toplamı o türün limitiyle karşılaştırıyor. Bu yüzden bir makinenin farklı bakım türleri (örneğin oil, belt, filter) için kullanım saatleri birbirine karışıyor ve is_due yanlış sonuç döndürüyor. maintenance/schedule.py dosyasını, her makinenin kullanım saatlerini bakım türü bazında ayrı ayrı toplayacak ve is_due(machine, kind) çağrısında yalnızca o makinenin o türe ait toplamını o türün kendi limitiyle karşılaştıracak şekilde düzelt. maintenance/registry.py ve maintenance/thresholds.py dosyalarındaki mevcut yapı ve arayüzler korunmalı; build_checker yine normalize edilmiş satırları yükleyip çağrılabilir bir is_due fonksiyonu döndürmeli.

setup: |
  mkdir -p maintenance
  cat > maintenance/registry.py <<'REGISTRY'
  def normalize_rows(raw_rows):
      out = []
      for row in raw_rows:
          out.append({
              "machine": row["machine"].strip().lower(),
              "hours": int(row["hours"]),
              "kind": row["kind"].strip().lower(),
          })
      return out


  def load_registry(raw_rows):
      return normalize_rows(raw_rows)
  REGISTRY
  cat > maintenance/thresholds.py <<'THRESHOLDS'
  LIMITS = {
      "oil": 500,
      "belt": 800,
      "filter": 300,
  }


  def limit_for(kind):
      return LIMITS[kind]
  THRESHOLDS
  cat > maintenance/schedule.py <<'SCHEDULE'
  from maintenance.registry import load_registry
  from maintenance.thresholds import limit_for


  def build_checker(raw_rows):
      rows = load_registry(raw_rows)
      totals = {}
      for row in rows:
          totals[row["machine"]] = totals.get(row["machine"], 0) + row["hours"]

      def is_due(machine, kind):
          used = totals.get(machine, 0)
          return used >= limit_for(kind)

      return is_due
  SCHEDULE

goal_tr: >
  maintenance/schedule.py icindeki build_checker fabrikasini, her makine
  icin kullanim saatlerini tur bazinda ayri toplayip is_due(machine, kind)
  cagrisinda o turun kendi limitiyle karsilastirarak dogru sonuc verecek
  bicimde duzelt.

reference_solution: |
  cat > maintenance/schedule.py <<'SCHEDULE'
  from maintenance.registry import load_registry
  from maintenance.thresholds import limit_for


  def build_checker(raw_rows):
      rows = load_registry(raw_rows)
      totals = {}
      for row in rows:
          key = (row["machine"], row["kind"])
          totals[key] = totals.get(key, 0) + row["hours"]

      def is_due(machine, kind):
          used = totals.get((machine, kind), 0)
          return used >= limit_for(kind)

      return is_due
  SCHEDULE

