id: gen-k-1002-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  fleet/dispatch.py içindeki largest_active fonksiyonu şu an yanlış çalışıyor: aktif araçlardan kapasitesi en yüksek olanları seçerken sonuncuyu listeye katmıyor. Bu fonksiyonu, yalnızca aktif araçlar arasından kapasitesi en yüksek k aracın plakasını, kapasitesi büyükten küçüğe azalan sırada döndürecek biçimde düzelt. Dönen değer bir plaka listesi olsun ve fleet/registry.py ile fleet/vehicles.py dosyaları olduğu gibi kalsın; yalnızca fleet/dispatch.py üzerinde çalış.

setup: |
  mkdir -p fleet
  cat > fleet/vehicles.py <<'VEH'
  from dataclasses import dataclass


  @dataclass
  class Vehicle:
      plate: str
      capacity: int
      active: bool = True
  VEH
  cat > fleet/registry.py <<'REG'
  from fleet.vehicles import Vehicle


  class Registry:
      def __init__(self):
          self._vehicles = []

      def add(self, plate, capacity, active=True):
          self._vehicles.append(Vehicle(plate, capacity, active))

      def all(self):
          return list(self._vehicles)
  REG
  cat > fleet/dispatch.py <<'DIS'
  from fleet.registry import Registry


  def build_registry(rows):
      reg = Registry()
      for row in rows:
          reg.add(row[0], row[1], row[2] if len(row) > 2 else True)
      return reg


  def total_capacity(reg):
      total = 0
      for v in reg.all():
          if v.active:
              total += v.capacity
      return total


  def largest_active(reg, k):
      active = [v for v in reg.all() if v.active]
      active.sort(key=lambda v: v.capacity, reverse=True)
      return [v.plate for v in active[:k - 1]]
  DIS

goal_tr: >
  fleet/dispatch.py icindeki largest_active fonksiyonunu, aktif araclardan
  kapasitesi en yuksek k tanesinin plakasini azalan sirada dogru dondurecek
  bicimde duzelt.

reference_solution: |
  cat > fleet/dispatch.py <<'DIS'
  from fleet.registry import Registry


  def build_registry(rows):
      reg = Registry()
      for row in rows:
          reg.add(row[0], row[1], row[2] if len(row) > 2 else True)
      return reg


  def total_capacity(reg):
      total = 0
      for v in reg.all():
          if v.active:
              total += v.capacity
      return total


  def largest_active(reg, k):
      active = [v for v in reg.all() if v.active]
      active.sort(key=lambda v: v.capacity, reverse=True)
      return [v.plate for v in active[:k]]
  DIS

