id: gen-k-0903-yarisma
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  flights/core/query.py dosyasını yaz. Bu dosyada FlightIndex adında bir sınıf tanımla. Sınıf, Flight nesnelerini süreye göre artan sırada tutsun. insert metodu yeni bir Flight'ı sıralı biçimde eklesin. find metodu ise verilen hedef süreyi ikili arama ile bulup bu süreye sahip ilk Flight nesnesini döndürsün; eşleşen bir Flight yoksa None döndürsün.

setup: |
  mkdir -p flights
  cat > flights/__init__.py <<'INIT'
  INIT
  mkdir -p flights/core
  cat > flights/core/__init__.py <<'CINIT'
  CINIT
  cat > flights/core/records.py <<'RECORDS'
  class Flight:
      def __init__(self, code, origin, dest, duration):
          self.code = code
          self.origin = origin
          self.dest = dest
          self.duration = duration

      def __lt__(self, other):
          return self.duration < other.duration

      def __eq__(self, other):
          return self.duration == other.duration

      def __repr__(self):
          return "Flight(%s,%s,%s,%d)" % (self.code, self.origin, self.dest, self.duration)


  def load_flights(rows):
      return [Flight(c, o, d, int(m)) for c, o, d, m in rows]
  RECORDS
  cat > flights/core/schedule.py <<'SCHED'
  def binary_search_min_duration(flights, target):
      lo, hi = 0, len(flights) - 1
      while lo <= hi:
          mid = (lo + hi) // 2
          if flights[mid].duration == target:
              return mid
          elif flights[mid].duration < target:
              lo = mid + 1
          else:
              hi = mid - 1
      return -1
  SCHED

goal_tr: >
  flights/core/query.py dosyasini yaz; Flight nesnelerini sureye gore artan
  sirada tutan ve verilen hedef sureyi ikili aramayla bulan bir FlightIndex
  sinifi tanimlasin (insert metodu sirali ekleme, find metodu hedef sureyi
  bulup ilk eslesen Flight'i dondursun, bulunamazsa None).

reference_solution: |
  cat > flights/core/query.py <<'QUERY'
  from flights.core.records import Flight


  class FlightIndex:
      def __init__(self):
          self._flights = []

      def insert(self, flight):
          lo, hi = 0, len(self._flights)
          while lo < hi:
              mid = (lo + hi) // 2
              if self._flights[mid].duration < flight.duration:
                  lo = mid + 1
              else:
                  hi = mid
          self._flights.insert(lo, flight)

      def find(self, duration):
          lo, hi = 0, len(self._flights) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if self._flights[mid].duration == duration:
                  return self._flights[mid]
              elif self._flights[mid].duration < duration:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return None

      def __len__(self):
          return len(self._flights)
  QUERY

