  cat > stock/report.py <<'REPORT'
  from stock.events import load_events
  from stock.queue import MovementQueue


  def drain(text):
      q = MovementQueue()
      for kind, sku, qty in load_events(text):
          q.push((qty, sku, kind))
      out = []
      while q:
          out.append(q.pop())
      return out
  REPORT
  cat > movements.txt <<'MOV'
  in SKU-A 5
  out SKU-B 12
  in SKU-C 3
  out SKU-A 7
  in SKU-B 9
  MOV

goal_tr: >
  stock/queue.py icindeki MovementQueue sinifini,
  push/pop/__len__/__bool__/__lt__/__eq__ metotlarini calisir bicimde
  gerceklestir; push ile verilen (oncelik, sku, kind) demetlerini en kucuk
  oncelikli once cikacak sekilde sakla, esit onceliklerde once push edilen
  once pop edilsin, pop bos kuyrukta IndexError yukseltsin ve iki kuyruk
  __lt__/__eq__ ile sirasiyla oncelik-ve-siraya gore karsilastirilsin.

reference_solution: |
  cat > stock/queue.py <<'QUEUE'
  import heapq


  class MovementQueue:
      """Priority queue of stock movements keyed by (priority, seq).

      Movements are (priority, sku, kind) tuples.  The queue is ordered by
      ascending priority, ties broken by insertion order.
      """

      def __init__(self):
          self._heap = []
          self._seq = 0

      def push(self, movement):
          heapq.heappush(self._heap, (movement[0], self._seq, movement))
          self._seq += 1

      def pop(self):
          if not self._heap:
              raise IndexError("pop from empty MovementQueue")
          return heapq.heappop(self._heap)[2]

      def __len__(self):
          return len(self._heap)

      def __bool__(self):
          return bool(self._heap)

      def _keys(self):
          return [(p, s) for p, s, _ in self._heap]

      def __lt__(self, other):
          return self._keys() < other._keys()

      def __eq__(self, other):
          return self._keys() == other._keys()
  QUEUE

