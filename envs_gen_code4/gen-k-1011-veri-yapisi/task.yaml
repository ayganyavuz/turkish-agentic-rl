prompt: |
  stock/queue.py dosyasındaki MovementQueue sınıfını çalışır hale getir. Sınıfın push, pop, __len__, __bool__, __lt__ ve __eq__ metotlarını gerçekleştir. push ile verilen (öncelik, sku, kind) demetlerini, en küçük öncelikli olan önce çıkacak şekilde sakla; aynı önceliğe sahip demetlerde ise önce push edilen önce pop edilsin. pop çağrıldığında boş kuyrukta IndexError yükseltilsin. İki kuyruk __lt__ ve __eq__ ile karşılaştırılırken sırasıyla öncelik ve sıraya göre değerlendirilsin.

