# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  loaner/core/merge.py dosyasındaki merge_intervals fonksiyonunu düzelt. Fonksiyon, iç içe geçmiş veya birbirine değerek çakışan aralıkları en küçük sayıda aralığa indirgemeli ve sonucu başlangıca göre artan sırada döndürmeli. Aralıkların başlangıç ve bitiş değerleri değişmemeli; sadece çakışanlar birleştirilmeli.

setup: |
  mkdir -p loaner/core loaner/app
  cat > loaner/core/__init__.py <<'PY'
  PY
  cat > loaner/app/__init__.py <<'PY'
  PY
  cat > loaner/core/interval.py <<'PY'
  from dataclasses import dataclass


  @dataclass(frozen=True)
  class Interval:
      """Half-open interval [start, end)."""

      start: int
      end: int

      def __post_init__(self):
          if self.start > self.end:
              raise ValueError("start must not exceed end")
  PY
  cat > loaner/core/merge.py <<'PY'
  from loaner.core.interval import Interval


  def merge_intervals(intervals):
      """Merge overlapping/touching intervals into a minimal sorted list."""
      ordered = sorted(intervals, key=lambda iv: (iv.start, iv.end))
      merged = []
      for iv in ordered:
          if merged and merged[-1].end >= iv.start:
              last = merged[-1]
              merged[-1] = Interval(last.start, iv.end)
          else:
              merged.append(Interval(iv.start, iv.end))
      return merged
  PY
  cat > loaner/app/reader.py <<'PY'
  import sys

  from loaner.core.interval import Interval


  def parse_stream(stream):
      """Read lines 'start end' from a text stream into Interval objects."""
      intervals = []
      for line in stream:
          line = line.strip()
          if not line:
              continue
          left, right = line.split()
          intervals.append(Interval(int(left), int(right)))
      return intervals


  def read_stdin():
      return parse_stream(sys.stdin)
  PY
  cat > loaner/app/report.py <<'PY'
  from loaner.core.merge import merge_intervals


  def summarize(intervals):
      """Return merged intervals as a list of (start, end) tuples."""
      return [(iv.start, iv.end) for iv in merge_intervals(intervals)]
  PY

goal_tr: >
  loaner/core/merge.py icindeki merge_intervals fonksiyonunu, ic ice gecmis
  veya birbirine degerek cakisan araliklari en kucuk sayida araliga
  indirecek ve sonucu baslangica gore artan sirada dondurecek bicimde
  duzelt.

reference_solution: |
  cat > loaner/core/merge.py <<'PY'
  from loaner.core.interval import Interval


  def merge_intervals(intervals):
      """Merge overlapping/touching intervals into a minimal sorted list."""
      ordered = sorted(intervals, key=lambda iv: (iv.start, iv.end))
      merged = []
      for iv in ordered:
          if merged and merged[-1].end >= iv.start:
              last = merged[-1]
              merged[-1] = Interval(last.start, max(last.end, iv.end))
          else:
              merged.append(Interval(iv.start, iv.end))
      return merged
  PY

