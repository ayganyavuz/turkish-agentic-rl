# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  stream/alarms.py dosyasındaki AlarmQueue sınıfını FIFO kuyruk olarak gerçekleştir. Aynı dosyadaki alarm_rule dekoratörünü de gerçekleştir; dekoratör bir limit değeri alsın ve sardığı feed fonksiyonunu, işlenen okuma bu limiti aştığında kuyruğa (sensor, value) ikilisini ekleyecek biçimde sarmalasın. feed fonksiyonu stdin'den okunan her satırı işlesin; her satır için stream/events.py içindeki parse_line kullanılarak elde edilen sensör ve değer, eşik aşıldığında kuyruğa eklensin. feed, akış sonunda kuyruğu döndürsün.

setup: |
  mkdir -p stream
  cat > stream/events.py <<'EVENTS'
  def parse_line(line):
      """Return (sensor_id, reading) or None for blank/comment lines."""
      line = line.strip()
      if not line or line.startswith("#"):
          return None
      sensor, value = line.split("=")
      return sensor.strip(), float(value)
  EVENTS
  cat > stream/alarms.py <<'ALARMS'
  from stream.events import parse_line


  class AlarmQueue:
      def __init__(self):
          raise NotImplementedError

      def push(self, sensor, value):
          raise NotImplementedError

      def pop(self):
          raise NotImplementedError

      def __len__(self):
          raise NotImplementedError

      def __bool__(self):
          raise NotImplementedError


  def alarm_rule(limit):
      def decorate(fn):
          raise NotImplementedError
      return decorate


  @alarm_rule(limit=5.0)
  def feed(line, queue):
      raise NotImplementedError
  ALARMS

goal_tr: >
  stream/alarms.py icindeki AlarmQueue sinifini FIFO kuyruk olarak ve
  alarm_rule dekoratorunu, feed fonksiyonu stdin'den okunan her satiri
  isleyip esik asildiginda kuyruga (sensor, value) ekleyecek bicimde
  gerceklestir; feed satirlari akis sonunda kuyrugu dondursun.

reference_solution: |
  cat > stream/alarms.py <<'ALARMS'
  import sys

  from stream.events import parse_line


  class AlarmQueue:
      def __init__(self):
          self._items = []

      def push(self, sensor, value):
          self._items.append((sensor, value))

      def pop(self):
          return self._items.pop(0)

      def __len__(self):
          return len(self._items)

      def __bool__(self):
          return bool(self._items)


  def alarm_rule(limit):
      def decorate(fn):
          def wrapper(line, queue):
              parsed = parse_line(line)
              if parsed is None:
                  return None
              sensor, value = parsed
              if value >= limit:
                  queue.push(sensor, value)
                  return (sensor, value)
              return None
          return wrapper
      return decorate


  @alarm_rule(limit=5.0)
  def feed(line, queue):
      return None


  def run(stream=None):
      if stream is None:
          stream = sys.stdin
      queue = AlarmQueue()
      for line in stream:
          feed(line, queue)
      return queue
  ALARMS

