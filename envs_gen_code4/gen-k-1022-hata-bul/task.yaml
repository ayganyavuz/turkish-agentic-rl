# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Sabahtan beri netlog paketindeki log özetleme çıktısına bakıyorum ve bir türlü tutarlı sonuç alamadım. Aynı ana makine arka arkaya birçok satırda geçiyor, ama özet çıktısında ya sıfır görünüyor ya da toplamlar eksik çıkıyor; sanki sayaçlar her satırda baştan başlıyor gibi. Artık bunun düzelmesini istiyorum.

  netlog/core/aggregator.py dosyasındaki HostAggregator sınıfını ve netlog/report/summary.py içindeki summarize akışını, her ana makine için istek sayısı ve bayt toplamının tüm girdi boyunca doğru birikmesini sağlayacak biçimde düzelt. summarize(stdin) çağrıldığında her host için (host, hits, total_bytes) demetlerini, hostların ilk görülme sırasını koruyarak döndürsün ve arka arkaya gelen aynı host satırlarında sonucu sıfırlamasın.

setup: |
  mkdir -p netlog/core netlog/report
  cat > netlog/core/__init__.py <<'EOF'
  EOF
  cat > netlog/report/__init__.py <<'EOF'
  EOF
  cat > netlog/core/parser.py <<'EOF'
  def parse_lines(stream):
      entries = []
      for raw in stream:
          line = raw.strip()
          if not line:
              continue
          parts = line.split()
          status = int(parts[0])
          host = parts[1]
          bytes_sent = int(parts[2])
          entries.append((status, host, bytes_sent))
      return entries
  EOF
  cat > netlog/core/aggregator.py <<'EOF'
  class HostAggregator:
      def __init__(self):
          self._hits = {}
          self._bytes = {}
          self._current_host = None

      def begin_host(self, host):
          self._current_host = host
          if host not in self._hits:
              self._hits[host] = 0
              self._bytes[host] = 0

      def add_entry(self, status, host, bytes_sent):
          self.begin_host(host)
          self._hits[host] += 1
          self._bytes[host] += bytes_sent

      def end_host(self, host):
          self._hits[host] = 0
          self._bytes[host] = 0
          self._current_host = None

      def totals(self, host):
          return (self._hits.get(host, 0), self._bytes.get(host, 0))
  EOF
  cat > netlog/report/summary.py <<'EOF'
  import sys

  from netlog.core.parser import parse_lines
  from netlog.core.aggregator import HostAggregator


  def summarize(stream):
      entries = parse_lines(stream)
      agg = HostAggregator()
      order = []
      for status, host, bytes_sent in entries:
          if host not in order:
              order.append(host)
          agg.begin_host(host)
          agg.add_entry(status, host, bytes_sent)
          agg.end_host(host)
      result = []
      for host in order:
          hits, total = agg.totals(host)
          result.append((host, hits, total))
      return result


  def main():
      for host, hits, total in summarize(sys.stdin):
          print(host, hits, total)


  if __name__ == "__main__":
      main()
  EOF

goal_tr: >
  netlog paketindeki HostAggregator ve summarize akisini, her ana makine
  icin istek sayisi ve bayt toplaminin tum girdi boyunca dogru birikmesini
  saglayacak bicimde duzelt; summarize(stdin) her host icin (host, hits,
  total_bytes) demetlerini ilk gorulme sirasinda dondursun ve ard arda gelen
  ayni host satirlarinda sonucu sifirlamasin.

reference_solution: |
  cat > netlog/core/aggregator.py <<'EOF'
  class HostAggregator:
      def __init__(self):
          self._hits = {}
          self._bytes = {}
          self._current_host = None

      def begin_host(self, host):
          self._current_host = host
          if host not in self._hits:
              self._hits[host] = 0
              self._bytes[host] = 0

      def add_entry(self, status, host, bytes_sent):
          if host != self._current_host:
              self.begin_host(host)
          self._hits[host] += 1
          self._bytes[host] += bytes_sent

      def end_host(self, host):
          self._current_host = None

      def totals(self, host):
          return (self._hits.get(host, 0), self._bytes.get(host, 0))
  EOF
  cat > netlog/report/summary.py <<'EOF'
  import sys

  from netlog.core.parser import parse_lines
  from netlog.core.aggregator import HostAggregator


  def summarize(stream):
      entries = parse_lines(stream)
      agg = HostAggregator()
      order = []
      for status, host, bytes_sent in entries:
          if host not in order:
              order.append(host)
          agg.begin_host(host)
          agg.add_entry(status, host, bytes_sent)
      result = []
      for host in order:
          hits, total = agg.totals(host)
          result.append((host, hits, total))
      return result


  def main():
      for host, hits, total in summarize(sys.stdin):
          print(host, hits, total)


  if __name__ == "__main__":
      main()
  EOF

