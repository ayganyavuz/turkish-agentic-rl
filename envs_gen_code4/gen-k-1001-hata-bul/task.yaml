id: gen-k-1001-hata-bul
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) clinic/scheduling.py dosyasındaki Scheduler.book metodu, aynı Scheduler nesnesi üzerinde farklı günlere sıralı olmayan şekilde kayıt yapıldığında günlük hasta listelerini sıfırlayıp önceki kayıtları siliyor. Bu hatayı gider; her gün için hasta listesi birikimli ve doğru kalsın.

  2) Bir güne ait kayıt yapıldıktan sonra başka bir güne, ardından tekrar ilk güne dönüldüğünde o günün daha önce kaydedilmiş hasta listesi korunsun ve yeni kayıtlar bu listenin üzerine eklensin; hiçbir günün listesi sıfırlanmasın.

  3) Günlük listelerin tutulması günler arasında gidip gelerek yapılan kayıtlarda da doğru sonucu versin; Scheduler.day_count ve clinic/report.py içindeki VisitReport.summary çağrıları her gün için birikimli ve doğru sayıları döndürsün.

  4) Değişiklik yalnızca clinic/scheduling.py dosyasında yapılsın; clinic/records.py, clinic/report.py ve data.txt dosyalarındaki mevcut davranış korunsun.

setup: |
  mkdir -p clinic
  cat > clinic/__init__.py <<'INIT'
  INIT
  cat > clinic/records.py <<'RECORDS'
  class PatientRecord:
      def __init__(self, patient_id, name):
          self.patient_id = patient_id
          self.name = name
          self.visits = 0

      def add_visit(self):
          self.visits += 1
          return self.visits


  def load_patients(rows):
      out = []
      for pid, name in rows:
          out.append(PatientRecord(pid, name))
      return out
  RECORDS
  cat > clinic/scheduling.py <<'SCHED'
  from clinic.records import load_patients


  class Scheduler:
      def __init__(self, rows):
          self.patients = load_patients(rows)
          self.calendar = {}
          self.current_day = None

      def book(self, patient_id, day):
          for p in self.patients:
              if p.patient_id == patient_id:
                  p.add_visit()
                  if day != self.current_day:
                      self.current_day = day
                      self.calendar[day] = []
                  self.calendar[day].append(patient_id)
                  return True
          return False

      def day_count(self, day):
          return len(self.calendar.get(day, []))


  def build_scheduler(rows):
      return Scheduler(rows)
  SCHED
  cat > clinic/report.py <<'REPORT'
  from clinic.scheduling import build_scheduler


  class VisitReport:
      def __init__(self, rows):
          self.scheduler = build_scheduler(rows)
          self.total = 0

      def register(self, patient_id, day):
          ok = self.scheduler.book(patient_id, day)
          if ok:
              self.total += 1
          return ok

      def summary(self):
          return {"total": self.total, "per_day": dict(self.scheduler.calendar)}
  REPORT
  cat > data.txt <<'DATA'
  P1,ayse
  P2,mehmet
  P3,zeynep
  DATA

goal_tr: >
  clinic/scheduling.py icindeki Scheduler.book metodundaki gunluk liste
  sifirlama hatasini gider: ayni Scheduler uzerinde gunler arasinda gidip
  gelerek yapilan kayitlarda her gunun hasta listesi birikimli ve dogru
  tutulmali, bir gune geri donuldugunde onceki kayitlar silinmemeli.

reference_solution: |
  cat > clinic/scheduling.py <<'SCHED'
  from clinic.records import load_patients


  class Scheduler:
      def __init__(self, rows):
          self.patients = load_patients(rows)
          self.calendar = {}

      def book(self, patient_id, day):
          for p in self.patients:
              if p.patient_id == patient_id:
                  p.add_visit()
                  self.calendar.setdefault(day, [])
                  self.calendar[day].append(patient_id)
                  return True
          return False

      def day_count(self, day):
          return len(self.calendar.get(day, []))


  def build_scheduler(rows):
      return Scheduler(rows)
  SCHED

